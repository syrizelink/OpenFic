appId: com.openfic.app
productName: OpenFic
copyright: Copyright © 2026 Syrize

directories:
  output: dist-electron

publish:
  provider: github
  owner: syrizelink
  repo: OpenFic
  releaseType: release

electronLanguages:
  - en-US
  - zh-CN

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: resources/app-update.yml
    to: app-update.yml

win:
  icon: resources/icons/openfic.svg
  artifactName: OpenFic-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: OpenFic-${version}-win-${arch}-setup.${ext}

mac:
  icon: resources/icons/openfic.svg
  artifactName: OpenFic-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null

linux:
  icon: resources/icons
  artifactName: OpenFic-${version}-linux-${arch}.${ext}
  synopsis: An AI-native writing tool for fiction authors
  description: OpenFic is an AI-native, cross-platform writing tool built for fiction authors.
  maintainer: Syrize <syrize@qq.com>
  vendor: syrizelink
  target:
    - AppImage
    - tar.gz
  category: Utility
