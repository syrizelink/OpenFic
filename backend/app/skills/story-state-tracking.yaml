id: builtin-skill--story-state-tracking
name: Pelacakan Status Cerita
summary: Menyaring status yang dibutuhkan penulisan saat ini dari konteks cerita yang sudah ada, serta melacak tokoh, hubungan, petunjuk awal, batasan dunia, dan kemajuan alur cerita.
is_enabled: true
content: |
  # Protokol Pelacakan Status

  Sasaran Skill ini bukan mengulang ringkasan seluruh teks, melainkan menyaring dari materi yang tersedia saat ini informasi yang "jika tidak diketahui, bab ini atau telaah kali ini akan salah tulis", lalu membentuk potret status yang dapat terus dipakai.

  ## Satu, Logika Penyaringan Catatan Cepat Bagian Ini

  Ambil tiga jenis informasi dari konteks yang sudah ada:

  1. Status saat ini: kemampuan terbaru, perubahan hubungan, dan citra publik tokoh yang terlibat di bagian ini.
  2. Sebab-akibat historis: penyebab petunjuk awal dan peristiwa masa lalu yang berkaitan langsung dengan peristiwa di bagian ini.
  3. Batasan dunia: sistem kekuatan, aturan sosial, batasan geografis, dan latar lain yang tidak boleh dilanggar di bagian ini.

  ### Standar Penyaringan

  - Bagian ini melibatkan seorang tokoh: pertahankan status terkini dan perubahan terbaru tokoh itu.
  - Bagian ini menarik kembali atau menggerakkan petunjuk awal: pertahankan detail konkret kemunculan pertama petunjuk itu beserta landasan yang dibangun pada teks sebelumnya.
  - Bagian ini melibatkan tempat, kemampuan, atau aturan: pertahankan batasan dunia yang terkait.
  - Pengetahuan latar belakang murni dan materi yang tidak punya kaitan sebab-akibat dengan bagian ini: jangan dimasukkan dulu ke catatan cepat.
  - Informasi yang tidak pasti ditandai "materi tidak menyebutkan" atau "menunggu konfirmasi"; jangan mengarang hanya agar tabelnya lengkap.

  ## Dua, Format Catatan Cepat Bagian Ini

  ```
  ## Catatan Cepat Bagian Ini

  ### Alur Cerita Saat Ini
  {peristiwa, tujuan, atau pilihan yang akan digerakkan bagian ini}

  ### Status Tokoh
  {Tokoh A}: {status terkini dalam satu kalimat, memuat perubahan terbaru}
  {Tokoh B}: {status terkini dalam satu kalimat}

  ### Petunjuk Awal/Masa Lalu Terkait
  {Petunjuk 1}: {detail konkret kemunculan pertama}, saat ini perlu {ditarik kembali/digerakkan/belum ditangani}

  ### Batasan Dunia
  {Batasan 1}: {aturan atau latar yang berkaitan dengan bagian ini}

  ### Masalah Belum Terselesaikan
  {tujuan, risiko, informasi, atau masalah hubungan yang wajib dipertahankan setelah bagian ini berakhir}
  ```

  Catatan cepat harus cukup singkat sehingga dapat langsung memandu penulisan atau telaah berikutnya, tetapi tidak boleh menghapus fakta yang memengaruhi sebab-akibat, perilaku tokoh, atau konsistensi latar hanya demi keringkasan.

  ## Tiga, Potret Status Tokoh

  Tokoh utama dapat dipelihara dengan format berikut:

  ```
  ## {Nama Tokoh}
  - Identitas saat ini: {identitas/pekerjaan terbaru}
  - Kemampuan saat ini: {tingkat kemampuan terbaru}
  - Tujuan saat ini: {tujuan yang sedang dikejar}
  - Batasan saat ini: {batasan luka, sumber daya, aturan, hubungan, atau informasi}
  - Hubungan kunci:
    - Dengan {Tokoh B}: {status hubungan saat ini}, perubahan terbaru: {peristiwa}
    - Dengan {Tokoh C}: {status hubungan saat ini}
  - Citra publik: {bagaimana dunia luar memandang tokoh ini}
  - Informasi yang diketahui: {fakta kunci yang jelas diketahui tokoh}
  - Kesalahpahaman atau ketidaktahuan: {fakta yang belum diketahui atau dinilai salah oleh tokoh}
  - Petunjuk awal yang menunggu ditarik: {butir terbuka yang berkaitan dengan tokoh ini}
  - Catatan perubahan status:
    - {posisi atau tahap}: {deskripsi perubahan}
  ```

  ### Aturan Pembaruan

  1. Status berhenti pada posisi yang ditentukan pengguna saat ini; jangan mengalirkan informasi teks berikutnya ke teks sebelumnya.
  2. Setelah setiap peristiwa, periksa apakah identitas, kemampuan, tujuan, batasan, hubungan, citra publik, dan informasi yang diketahui mengalami perubahan.
  3. Bidang yang tidak berubah tidak perlu diuraikan ulang.
  4. Lacak hanya tokoh utama: tokoh yang tampil beberapa kali, memiliki alur cerita sendiri, memengaruhi alur utama, atau memikul hubungan penting; tokoh lewat sekali tidak dimasukkan.
  5. Catatan perubahan menyimpan catatan kunci terbaru. Catatan yang lebih lama boleh digabung menjadi ringkasan tahap, tetapi fakta yang memengaruhi perilaku saat ini tidak boleh hilang.
  6. Jika materi memunculkan konflik, daftarkan kedua sumber dan titik konfliknya lalu tunggu putusan, jangan menimpanya secara diam-diam.

  ## Empat, Pelacakan Petunjuk Awal

  Setiap petunjuk awal minimal mencatat:
  - Posisi kemunculan pertama.
  - Makna permukaannya pada saat itu.
  - Status saat ini: belum direncanakan, sudah ditanam, sudah digerakkan, sudah ditarik kembali, sudah tidak berlaku, atau materi tidak menyebutkan.
  - Kemungkinan syarat penarikan kembali dan tokoh yang terkait.
  - Fakta, hubungan, aturan, atau pemahaman alur utama yang akan berubah setelah ditarik kembali.
  - Ekspektasi dan risiko yang muncul jika petunjuk terus digantung.

  Penarikan kembali tidak cukup ditulis "sudah dijelaskan"; jelaskan bagaimana detail lama memperoleh makna baru, serta tujuan, hubungan, sumber daya, atau pengetahuan siapa yang berubah setelah penarikan itu.

  ## Lima, Pemeriksaan Status Antarbab

  - Apakah bab saat ini memakai identitas, kemampuan, hubungan, dan sebutan tokoh yang sudah berubah.
  - Apakah bab saat ini membuat tokoh mengetahui informasi yang sebelumnya tidak ia ketahui.
  - Apakah bab saat ini memakai lebih awal latar atau kemampuan yang belum terbuka.
  - Apakah tujuan, pilihan, harga, dan petunjuk awal yang sudah dijanjikan masih memiliki catatan status.
  - Apakah tokoh, tempat, organisasi, dan aturan baru akan dipakai lagi nanti; yang akan dipakai lagi harus masuk ke pelacakan status.
  - Apakah setelah bab berakhir terbentuk status tujuan, risiko, informasi, hubungan, sumber daya, identitas, atau emosi yang baru.

  ## Enam, Prinsip Keluaran

  - Utamakan mencatat hal yang memengaruhi keputusan berikutnya.
  - Bedakan fakta teks asli, pengetahuan tokoh, dan penilaian analitis.
  - Jangan mengganti bidang status dengan ringkasan utuh.
  - Jangan menambahkan fakta yang tidak disediakan pengguna.
  - Jangan menuliskan penjelasan pelacakan status, tabel, atau metainformasi ke dalam isi utama novel.

  ## Tujuh, Perubahan Status dan Penanganan Konflik

  Setelah setiap peristiwa, periksa secara berurutan: identitas, kemampuan, tujuan, batasan, hubungan, citra publik, informasi yang diketahui, kesalahpahaman, status petunjuk awal, sumber daya, luka, janji, dan pendirian emosional. Catat hanya perubahan yang memengaruhi keputusan berikutnya; bidang yang tidak berubah tidak diuraikan ulang.

  Jika materi memunculkan konflik, daftarkan sumber, posisi, dan titik konfliknya, tandai "menunggu putusan", dan jangan menimpanya secara diam-diam. Status berhenti pada posisi yang ditentukan pengguna, dan informasi teks berikutnya tidak boleh dialirkan ke teks sebelumnya; tokoh hanya boleh memakai informasi yang wajar ia ketahui sampai titik tersebut.

  ### Tabel Perubahan Status

  ```
  Posisi/peristiwa:
  Faktor pemicu:
  Bidang yang berubah: tujuan / risiko / informasi / hubungan / sumber daya / identitas / kemampuan / citra publik / emosi
  Sebelum berubah:
  Setelah berubah:
  Siapa yang tahu:
  Dampak bagi kelanjutannya:
  Apakah membentuk janji atau petunjuk awal baru:
  ```

  ### Pemeriksaan Akhir Bab

  Apakah bab memakai identitas, kemampuan, hubungan, dan sebutan yang sudah berubah; apakah membuat tokoh mengetahui informasi yang sebelumnya tidak ia ketahui; apakah memakai lebih awal latar atau kemampuan yang belum terbuka; apakah janji, pilihan, harga, dan petunjuk awal masih memiliki catatan status; apakah tokoh, tempat, organisasi, dan aturan baru akan dipakai lagi nanti; apakah setelah berakhir terbentuk status tujuan, risiko, informasi, hubungan, sumber daya, identitas, atau emosi yang baru.
references:
  - name: Daftar Periksa Potret Status
    content: |
      - Tokoh sekarang ada di mana, berstatus apa, dan sedang melakukan apa.
      - Tokoh saat ini menginginkan apa, mampu melakukan apa, dan tidak mampu melakukan apa.
      - Informasi apa yang diketahui tokoh, dan informasi apa yang ia salah pahami.
      - Perubahan apa yang terjadi pada hubungan dibandingkan titik status sebelumnya.
      - Harga, sumber daya, luka, atau janji apa yang ditinggalkan peristiwa terbaru.
  - name: Daftar Periksa Pelacakan Petunjuk Awal
    content: |
      - Posisi kemunculan pertama dan makna permukaannya pada saat itu.
      - Status saat ini dan penggerakan terakhirnya.
      - Syarat atau kemungkinan kaitan yang dibutuhkan untuk penarikan kembali.
      - Jika terus digantung, ekspektasi atau risiko apa yang muncul pada langkah berikutnya.
      - Saat ditarik kembali, apakah akan mengubah tokoh, hubungan, aturan, atau pemahaman alur utama.
