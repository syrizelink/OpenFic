  - name: Aturan Tokoh Utama, Antagonis, dan Penyajian
    content: |
      - Tujuan, tindakan, dan sikap tokoh diutamakan ditunjukkan lewat perilaku, keputusan, dialog, dan reaksi.
      - Antagonis harus punya mimpi, trauma, cacat, dan keyakinan miliknya sendiri; penghalang sebaiknya lahir dari watak tokoh dan tujuannya.
      - Saat perilaku kunci tidak sesuai watak tokoh, tambahkan dulu motif yang wajar pada tataran tokoh atau sesuaikan alur ceritanya.
      - Jangan memaksa semua tokoh menjadi berdimensi: tokoh fungsional boleh tetap datar dan misterius.
      - Jangan biarkan pelindung yang kuat menyelesaikan krisis kapan saja; rasa aman harus sesuai dengan emosi inti genrenya.
