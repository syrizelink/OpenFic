content: |
  # Manual Operasional Perancangan Dasar Tokoh dan Perancangan Tokoh

  Muat saat merancang tokoh utama/tokoh pendukung/tokoh antagonis. Lihat dulu rute keputusan, pilih templat yang tepat, lalu kerjakan langkah demi langkah. Skill ini juga dipakai sebagai tolok ukur pembanding saat membuat tokoh dan saat membedah karya; saat membedah, bandingkan naskah sumber dengan pola standar butir per butir, jangan menulis ulang karya baru mengikuti templat.

  ## Rute Keputusan

  | Apa yang kamu rancang | Pakai templat ini | Lihat bagian mana |
  |------------|-----------|-----------|
  | Tokoh utama | Templat kartu tokoh utama | Bagian 1 |
  | Tokoh pendukung | Templat kartu tokoh pendukung | Bagian 2 |
  | Tokoh antagonis | Tabel tingkatan antagonis -> Empat unsur pembangun antagonis -> Empat langkah watak antagonis | Bagian 3 |
  | Motif tokoh | Templat rantai motif -> Jenis konflik motif | Bagian 4 |
  | Pembentukan/pendalaman tokoh | Rujukan cepat metode pembentukan (metode empat lapis/metode obsesi/titik pengulangan/penyajian berlapis, dll.) | Bagian 5 |
  | Masalah khusus tokoh utama | Wibawa/pertumbuhan/garis merah/nada terlalu tinggi/identitas dan keunggulan bawaan | Bagian 6 |
  | Pendalaman pembentukan antagonis | Penggarapan antagonis/watak antagonis digarap seperti tokoh utama | Bagian 7 |

  | Apa yang sedang kamu kerjakan | Pakai metode apa |
  |-----------|-----------|
  | Merancang kontras tokoh | Metode kontras tiga lapis label + tahap lanjut kontras perilaku |
  | Merancang tokoh pendukung | Fungsionalisasi tokoh pendukung + metode penulisan ansambel |
  | Menonjolkan watak tokoh | Tabel rujukan cepat penonjolan watak tokoh |
  | Merancang adegan emosional | Templat adegan kecerdasan emosional tinggi |
  | Mendalamkan dimensi tokoh | Metode pendalaman ke arah watak tokoh + kerangka watak tokoh sembilan dimensi |
  | Membangun rasa keterlibatan | Metode pembangunan rasa keterlibatan |
  | Mengelola hubungan tokoh | Empat tahap hubungan watak tokoh + struktur pola pikir dunia kerja |
  | Merancang ciri khas tokoh utama | Keunggulan bawaan menyandera watak tokoh + pembentukan berpusat pada gimik |

  ## Bagian 1: Kartu Tokoh Utama

  ### Templat Isian

  ```
  Nama:
  Jenis kelamin:
  Posisi tokoh: (satu kalimat yang menjelaskan fungsi tokoh utama dalam cerita)
  Label identitas: (misalnya: mahasiswa tak berguna, mantan tentara khusus, pangeran yang jatuh miskin)
  Ciri fisik: (3-5 kata kunci, harus punya daya ingat)
    Contoh: tinggi kurus, selalu memakai jaket lusuh, ada bekas luka di tangan kiri, tatapan malas
  Kata kunci watak: (3-5 buah, harus ada sisi yang bertentangan)
    Contoh: mulut pedas hati lembut, tampak dingin tapi sangat melindungi orang dekat, impulsif tapi punya prinsip
  Tujuan inti: (apa yang ingin dicapai di titik akhir seluruh buku)
  Motif inti: (alasan yang membuatnya harus tercapai - didorong emosi, bukan didorong rasionalitas)
  Kelemahan fatal: (cacat watak yang membuat tokoh berbuat salah, bukan cacat kemampuan)
  Ucapan khas/gerakan penanda: (label yang membuat pembaca langsung mengenalinya)
  ```

  ### Poin Perancangan

  - Motif harus berada di tataran emosi - "membalaskan kematian ibu" lebih baik daripada "ingin menjadi yang terkuat"
  - Kelemahan harus benar-benar membuat tokoh utama berbuat salah pada alur cerita kunci, kalau tidak, itu bukan kelemahan
  - Ciri fisik dan ucapan khas adalah jangkar ingatan pembaca, wajib ditulis

  ## Bagian 2: Kartu Tokoh Pendukung

  ### Templat Isian

  ```
  Nama:
  Jenis kelamin:
  Fungsi tokoh: (mentor/sekutu/sumber informasi/korban/cermin pembanding)
  Hubungan dengan tokoh utama:
  Ciri inti: (1-2 kata kunci)
  Ciri penanda: (satu kalimat yang membuat pembaca mengingatnya)
  Cara keluar panggung: (kapan/bagaimana keluar dari cerita)
  ```

  ### Poin Perancangan

  - Setiap tokoh pendukung harus punya fungsi yang jelas - tokoh tanpa fungsi jangan dimunculkan
  - Keluarnya tokoh pendukung harus direncanakan aktif, jangan sampai lupa di tengah penulisan
  - Dalam satu adegan, tokoh pendukung yang punya dialog tidak lebih dari 3

  ### Perancangan Fungsionalisasi Tokoh Pendukung

  1. Kemampuan dan ciri tokoh pendukung harus terkait erat dengan alur cerita
  2. Tokoh pendukung ditulis untuk menampilkan tokoh utama - kemampuan tokoh pendukung dipakai tokoh utama, tokoh pendukung lepas dari kesulitan berkat bantuan tokoh utama

  #### Tokoh Pendukung Majemuk - Tokoh Sarung Tangan Putih

  | Fungsi | Penjelasan |
  |------|------|
  | Bicara mewakili tokoh utama | Segala ucapan yang tidak pantas dikatakan tokoh utama, dia yang mengatakan |
  | Bertindak keras mewakili tokoh utama | Segala tindakan keras yang tidak pantas dilakukan tokoh utama, dia yang melakukan |
  | Pembelaan mutlak | Membalas tegas siapa pun yang melanggar kepentingan tokoh utama |
  | Kasar tapi cermat | Merekam persekongkolan antagonis lalu memutarnya, sehingga memperoleh dukungan publik |
  | Melucu pada waktu yang tepat | Terus mengeluarkan umpan balik positif, meredakan ketegangan |

  **Prinsip perancangan**: auranya sedikit di bawah tokoh utama, tidak mencuri panggung; kemunculan yang mengesankan; keraguan terhadap tokoh utama langsung dibantah saat itu juga.

  #### Tokoh Berdimensi vs Tokoh Datar

  1. Tidak semua tokoh harus dibuat berdimensi, lihat dulu fungsinya
  2. Tokoh datar menjaga misterinya, justru terasa lebih menakutkan/lebih kuat
  3. "Pemutihan citra melemahkan tiga bagian, penggelapan citra menguatkan tiga kali" - jagoan yang dibuat berdimensi justru jadi lemah
  4. Rancang alat sesuai kebutuhan, jangan membuat semua tokoh berdimensi

  #### Metode Kontras Watak Tokoh Enam Dimensi

  | Pasangan kontras | Cara kerja |
  |--------|------|
  | Watak permukaan vs watak batin | Harimau bermuka senyum/mulut tajam hati tahu |
  | Citra fisik vs watak permukaan | Tampak bengis padahal lembut |
  | Citra fisik vs watak batin | Tampak lembut padahal kejam |
  | Identitas vs gaya hidup | Anak keluarga konglomerat tinggal di ruang bawah tanah |
  | Identitas vs hobi dan keahlian | Pembunuh bayaran mahir merangkai bunga |
  | Identitas vs watak batin | Tentara berjiwa seniman |

  ### Instruksi Eksekusi

  1. Saat merancang tokoh pendukung, tetapkan dulu fungsinya (bicara mewakili tokoh utama/bertindak keras/melucu/memberi informasi)
  2. Pilih 1-2 dimensi dari enam dimensi kontras untuk memberi label pada tokoh pendukung
  3. Kendalikan aura tokoh pendukung, jangan melebihi tokoh utama
  4. Tokoh pendukung fungsional jangan dipaksa jadi berdimensi

  #### Logika Watak Tokoh Pendukung

  1. "Adegan positif ditulis terbalik" - di balik perilaku yang tampak positif ada motif antagonis
  2. Cangkang pelindung emosi tokoh pendukung: tampak dingin tanpa perasaan, padahal ada dorongan emosi yang mendalam
  3. Hindari watak tokoh runtuh: pilihan perilaku tokoh harus sesuai logika watak tokoh yang sudah dibangun
  4. Pakai dulu "tokoh berlabel" dari genrenya secara langsung - tokoh berwatak dalam genre yang sudah matang semuanya sudah lulus uji pasar

  #### Metode Penulisan Ansambel

  1. Setiap kemunculan tokoh harus punya fungsi, tanpa isian kosong - tokoh yang fungsinya tidak jelas jangan dimunculkan
  2. Hubungan antartokoh harus berlapis (penunjuk jalan, lawan, rekan, penghalang)
  3. Tokoh yang berbeda harus punya gaya bicara dan ciri perilaku yang berbeda
  4. Tampilkan ciri tokoh lewat perilaku, bukan lewat narasi

  ##### Penggambaran Tokoh Pendukung Secara Bertipe

  1. Tangkap 1-2 ciri paling mencolok sebagai label yang tegas (ucapan khas/gerakan penanda/watak ekstrem)
  2. Pelabelan membuat pembaca cepat mengingat, tanpa memakan banyak porsi tulisan
  3. Tokoh pendukung fungsional harus punya fungsi jelas: mendorong alur cerita, menonjolkan tokoh utama, memberi informasi

  ##### Ritme Pemakaian Tokoh

  1. Frekuensi kemunculan tokoh yang populer sebaiknya dijaga sekali setiap 3-5 bab, supaya rasa penantian terjaga tanpa kejenuhan. Setiap kemunculan harus membawa informasi baru atau fungsi baru
  2. Tokoh yang tidak menarik bagi pembaca, buang saja saat memang perlu dibuang, biarkan "turun panggung" secara wajar
  3. Pakai "tokoh membawa tokoh" untuk memperkenalkan tokoh baru - rasa suka berlanjut

  ##### Metode Merajut Kolam Tokoh

  1. Tokoh membawa tokoh: tokoh utama perempuan disukai -> tulis orang tua/kakak/sahabat perempuannya -> rasa suka berlanjut ke tokoh baru
  2. Rajut terus seperti jaring -> segera terbentuk kolam tokoh yang tak habis-habis
  3. Setiap tokoh baru diberi satu label, masing-masing tegas

  ## Bagian 3: Perancangan Tokoh Antagonis

  ### 3.1 Tabel Tingkatan Antagonis

  Pilih tingkatan yang sesuai berdasarkan porsi kemunculan antagonis, lalu rancang menurut ketentuan tabel.

  #### Antagonis Kecil (1-5 bab)

  | Dimensi | Ketentuan |
  |------|------|
  | Fungsi | Penghalang dalam satu busur kecil |
  | Perancangan | Cukup 1-2 ciri yang tegas (congkak/mata duitan/menindas yang lemah dan takut yang kuat) |
  | Keluar panggung | Dikalahkan atau dibongkar, tegas dan tuntas |

  #### Antagonis Menengah (10-30 bab)

  | Dimensi | Ketentuan |
  |------|------|
  | Fungsi | Lawan utama dalam satu volume |
  | Motif | Mengapa dia berseberangan dengan tokoh utama (tidak boleh sekadar "jahat murni") |
  | Cara | Kekerasan/intrik kekuasaan/sumber daya |
  | Wibawa | Setidaknya sekali mengalahkan tokoh utama, sampai pembaca geram menahan benci |
  | Keluar panggung | Dikalahkan tokoh utama secara langsung, harus terasa memuaskan |

  #### Bos Busur Besar (satu volume atau beberapa volume)

  | Dimensi | Ketentuan |
  |------|------|
  | Fungsi | Mewakili konflik inti satu tahap |
  | Busur tokoh | Busur tokoh yang utuh, punya tujuan dan logika sendiri |
  | Konflik | Punya konflik prinsip dengan tokoh utama (bukan hanya konflik kepentingan) |
  | Duel | Setidaknya satu pertarungan yang menjerumuskan tokoh utama ke jalan buntu |
  | Sisi lain | Ada satu sisi yang membuat pembaca "tidak sanggup membencinya" |
  | Keluar panggung | Pertarungan penutup yang terasa khidmat + akhir yang meninggalkan kesan |

  #### Bos Terakhir (seluruh buku)

  | Dimensi | Ketentuan |
  |------|------|
  | Fungsi | Perwujudan konkret konflik inti seluruh buku |
  | Petunjuk awal | Sudah ada sejak bab pertama |
  | Pertentangan | Berlawanan langsung dengan tujuan/motif tokoh utama, mewakili sisi berlawanan dari tema cerita |
  | Kekuatan | Menindas tokoh utama, tokoh utama harus bermetamorfosis dulu supaya bisa menang |
  | Keyakinan | Punya keyakinan, bukan orang gila/monster murni |

  ### 3.2 Hukum Besi Perancangan Antagonis

  - Kecerdasan/kekuatan antagonis menentukan bobot tokoh utama - antagonis lemah = kemenangan tokoh utama tidak bermakna
  - Perilaku antagonis harus punya logika internal (masuk akal dari sudut pandangnya)
  - Jangan membuat antagonis mendadak bodoh demi menghadiahkan kemenangan pada tokoh utama

  ### 3.3 Empat Unsur Pembangun Antagonis

  Kerjakan berurutan, tidak boleh ada yang hilang:

  1. **Peragaan kekuatan** - begitu muncul, langsung peragakan kekuatan atau caranya
  2. **Motif yang meyakinkan** - dari sudut pandang antagonis, perilakunya masuk akal
  3. **Ancaman nyata** - setidaknya sekali mengalahkan tokoh utama
  4. **Waktu pengungkapan niat pamungkas** - tujuan sebenarnya disimpan sampai titik balik kunci

  ### 3.4 Empat Langkah Penetapan Watak Antagonis

  | Langkah | Cara kerja |
  |------|------|
  | 1. Antagonis juga punya mimpi | Di matanya sendiri, dia adalah tokoh utama dari ceritanya sendiri |
  | 2. Gali masa lalu yang traumatis | Siapa yang membesarkannya? Siapa yang mencintainya? Siapa yang melukainya? Penderitaan apa yang dia hindari? |
  | 3. Asah cacat wataknya | Saat menghadapi kesulitan, dia tidak menggerakkan sifat positif, melainkan mengasah cacatnya - "keunggulan" itu sendiri justru cacat yang fatal |
  | 4. Antagonis adalah cermin tokoh utama | Kelebihan antagonis mencerminkan kelemahan tokoh utama, keduanya berlawanan total = setiap pertemuan pasti menimbulkan friksi |

  ### 3.5 Kunci Bobot Penggarapan Antagonis

  - Penghalang muncul dari watak tokoh antagonis, bukan sengaja dibuat untuk menyusahkan tokoh utama
  - Rumus penggarapan antagonis: motif yang jelas -> motif mendorong perilaku -> perilaku membentuk penghalang -> kekuatan penghalang berasal dari bobot antagonis
  - Saat antagonis luar biasa dominan, cara tokoh utama menembusnya harus "kelas tinggi", "cerdas", "tak terduga"

  ## Bagian 4: Perancangan Motif

  ### 4.1 Templat Rantai Motif

  ```
  Sebab (Cause)         -> apa yang dialami tokoh
  Niat (Intent)         -> apa yang ingin dilakukan tokoh
  Kendala (Constraint)  -> apa yang menghalanginya
  Risiko (Risk)         -> apa harga dari kegagalan
  ```

  **Contoh**:
  ```
  Sebab: ibunya dibunuh oleh musuh keluarga
  Niat: menemukan pembunuhnya dan membalaskannya
  Kendala: pembunuhnya adalah pejabat berkuasa di istana, tokoh utama hanya rakyat biasa
  Risiko: pembalasan yang gagal berarti seluruh keluarganya dihabisi, pembalasan yang berhasil berarti kehilangan seluruh kehidupannya yang sekarang
  ```

  ### 4.2 Poin Perancangan Rantai Motif

  - Sebab harus konkret - "ditindas" tidak cukup, "ditampar di depan mata semua orang" baru memadai
  - Kendala harus kuat - kalau tidak, tokoh utama menindas terus tanpa ketegangan
  - Risiko harus nyata - pembaca harus percaya tokoh utama benar-benar mungkin kehilangan sesuatu yang penting
  - Motif boleh berkembang seiring alur cerita, tapi tidak boleh berubah begitu saja

  ### 4.3 Jenis Konflik Motif

  Saat tokoh perlu bergulat dalam batin, pilih satu jenis konflik dari tabel berikut:

  | Jenis | Definisi | Contoh |
  |------|------|------|
  | Tujuan vs moral | Yang ingin dilakukan berbenturan dengan yang seharusnya dilakukan | Balas dendam tapi tidak ingin melukai orang tak bersalah |
  | Emosi vs kepentingan | Tarik-menarik antara perasaan dan rasionalitas | Tahu lawan tidak bisa diandalkan tapi tak bisa melepaskannya |
  | Jangka pendek vs jangka panjang | Pertentangan antara keuntungan sesaat dan tujuan besar | Berkompromi demi nyawa vs berpegang pada prinsip dan bertaruh pada masa depan |
  | Diri vs orang lain | Konflik antara kebutuhan pribadi dan harapan orang lain | Ingin hidup tenang tapi memikul misi keluarga |

  ## Bagian 5: Rujukan Cepat Metode Pembentukan Tokoh

  ### 5.1 Prinsip Inti Pembentukan Tokoh

  **Tiga keharusan perilaku tokoh utama**:
  1. **Harus bisa dipahami** - pembaca harus memahami mengapa tokoh utama berbuat demikian
  2. **Harus bisa menimbulkan resonansi** - pembaca harus bisa masuk ke dalam pemikiran tokoh utama
  3. **Harus bisa diterima** - pandangan hidup tokoh utama harus bisa diterima pembaca

  **Menunjukkan lebih baik daripada memberi tahu**:
  - Tujuan tokoh -> ditunjukkan lewat perilaku, bukan dijelaskan lewat narasi
  - Tindakan tokoh -> gerakan dan keputusan yang konkret, bukan tumpukan kata sifat
  - Sikap tokoh -> tercermin lewat dialog dan reaksi, bukan monolog batin

  ### 5.2 Metode Menunjukkan Ciri Tokoh

  | Metode | Cara kerja | Contoh |
  |------|------|------|
  | Kepekaan | Sentuh kelemahannya, lihat cara dia bereaksi | Panik/buru-buru lari/mengalihkan perhatian = watak yang berbeda |
  | Penghindaran | Tampilkan perilaku menghindar yang mengisyaratkan kelemahan | "Apa yang tidak dilakukan" tokoh lebih menyingkap watak terdalam daripada "apa yang dilakukan" |
  | Positif dulu, cacat kemudian | Tampilkan dulu ciri yang memikat, baru singkapkan cacatnya | Pembaca menyukai tokoh lebih dulu, baru bisa menoleransi cacatnya |

  ### 5.3 Empat Atribut Watak

  | Kategori atribut | Definisi | Poin perancangan |
  |---------|------|---------|
  | Atribut moral | Keyakinan benar dan salah | Memengaruhi pembentukan watak yang lain |
  | Atribut pencapaian | Mendorong tercapainya tujuan | Sejalan dengan atribut moral, melayani tujuan |
  | Atribut interaksi | Cara berkomunikasi dengan orang | Sifat positif dengan jumlah terbanyak |
  | Atribut identitas | Rasa pengenalan diri | Komponen dasar yang mendefinisikan kepribadian |

  Teknik pemilihan: jadikan salah satu ciri sebagai ciri utama, sisanya sebagai pendukung.

  ### 5.4 Metode Empat Lapis Pembentukan Tokoh

  | Lapisan | Metode |
  |------|------|
  | Empati | Jangan terlalu banyak tokoh di bagian awal, biarkan pembaca mengenal tokoh utama dulu dan menumbuhkan penantian |
  | Ciri minimum (label) | Tokoh utama dibentuk dari dalam ke luar, tokoh pendukung dibentuk dari luar ke dalam (pemberian label) |
  | Ketidakjujuran tokoh | Yang diucapkan tidak sama dengan yang dipikirkan, tindakan tidak sama dengan sikap; kehidupan sehari-hari dan kematian tokoh adalah dua kutub pendalaman tokoh |
  | Lampu sorot tokoh | Tokoh pendukung harus punya keterkaitan kuat dengan tokoh utama; saat tokoh pendukung mengalahkan tokoh utama, bentuk tokoh pendukung baru untuk merebut auranya |

  ### 5.5 Pembentukan Tokoh dan Kebenaran Tokoh

  | Tataran | Definisi | Contoh |
  |------|------|------|
  | Pembentukan tokoh (tampak) | Ciri yang dilihat pembaca pada pandangan pertama | Gadis kecil berwajah muda dan menggemaskan |
  | Kebenaran tokoh (tersembunyi) | Wujud sejati batin tokoh | Sebenarnya seorang pembunuh berdarah dingin |
  | Orientasi nilai (terselubung) | Nilai yang menentukan saat pilihan kunci muncul | Memilih ambisi di antara kebenaran dan ambisi |

  Poin pengerjaan: orientasi nilai tidak perlu disingkapkan sejak awal, biarkan terbuka secara wajar pada saat pengambilan keputusan kunci; makin lambat kebenaran tokoh disingkapkan, makin kuat ketegangan dramatiknya.

  ### 5.6 Metode Penyajian Watak Tokoh Berlapis

  | Lapisan | Cara kerja |
  |------|------|
  | Lapis pertama | Beri tahu pembaca model tipenya (gadis kecil/wanita dewasa dominan/ibu muda) |
  | Lapis kedua | Tempelkan label ciri (dada besar/kaki panjang/kulit sawo matang) |
  | Lapis ketiga | Cari sebab wataknya (keluarga/dorongan batin) |
  | Lapis keempat | Pecahkan - si polos yang menggemaskan sebenarnya tahu segalanya, watak tokoh langsung terangkat |

  Mendalamkan ingatan: jangan pelit mengulang kosakata. Merasa terlalu murahan? Sebenarnya itu sedang mendalamkan ingatan.

  ### 5.7 Metode Tiga Garis Waktu Pengalaman Tokoh

  | Garis waktu | Isi |
  |--------|------|
  | Masa lalu | Latar belakang asal-usul, musibah yang dialami, sebab terbentuknya watak |
  | Masa kini | Posisi hubungan dengan tokoh utama, pola interaksi saat ini |
  | Masa depan | Membuat dorongan untuk menjadi lebih kuat atau membuat krisis (guru disandera/tokoh utama perempuan ditangkap/antagonis membongkar rahasia) |

  ### 5.8 Metode Penetapan Obsesi Tokoh Pendukung

  - Beri tokoh satu obsesi -> semua perilaku/hobi/watak berkembang di sekeliling obsesi itu
  - Tidak perlu selalu menempel pada obsesi, cukup jangan menulis hal yang berbenturan dengan obsesinya, singkapkan pada saat kunci
  - Obsesi yang terlalu ekstrem -> tambahkan detail kecil yang "membumi" -> memudahkan pembaca menerimanya
  - Cocok untuk: tokoh pendukung alur samping, tidak cocok untuk tokoh pendukung utama yang sering muncul

  ### 5.9 Perancangan Titik Pengulangan Perilaku Tokoh

  - Tangkap satu ciri perilaku tokoh dan tulis berulang-ulang
  - Cara membangunnya: tentukan tipe apa yang disukai pembaca -> konkretkan menjadi perilaku -> ulangi di adegan yang berbeda
  - Daya tarik tokoh + daya tarik inti = kesan berlapis, keduanya berputar dan menghasilkan diferensiasi
  - Antagonis/tokoh pendukung juga butuh daya tarik yang berulang; antagonis yang bisa dicintai akan menambah kesegaran bagi pembaca

  ### 5.10 Menulis Perilaku di Sekeliling Watak Tokoh

  Perilaku, bahasa, dan pola pikir semuanya harus berkembang di sekeliling kepribadian. Kalau demi alur cerita kamu harus membuat tokoh berperilaku tidak sesuai wataknya -> ubah dulu alur ceritanya, jangan ubah watak tokohnya.

  ### 5.11 Tokoh Mendorong Peristiwa vs Peristiwa Mendorong Tokoh

  | Cara penggerak | Ciri |
  |---------|------|
  | Tokoh mendorong peristiwa | Alur cerita adalah hasil wajar dari watak/motif/pilihan tokoh, mendalamkan busur perkembangan tokoh |
  | Peristiwa mendorong tokoh | Peristiwa luar mematahkan keseimbangan, memaksa diri yang sejati tersingkap |

  Saat mentok menulis -> cari arah dari motif tokoh, jangan memaksa mengarang alur cerita.

  ## Bagian 6: Masalah Khusus Tokoh Utama

  ### 6.1 Wibawa Tokoh Utama

  - Tokoh utama harus punya wibawa - ini dasar rasa keterlibatan pembaca
  - Jangan menulis terlalu banyak adegan batin yang membodohkan dan umpatan kasar
  - Tokoh utama boleh tidak sempurna, tapi tidak boleh sampai dipandang rendah

  ### 6.2 Pertumbuhan Tokoh Utama

  - Pertumbuhan tidak hanya tercermin pada kekuatan, lebih-lebih tercermin pada kematangan pikiran dan pilihan
  - Setiap pertumbuhan harus punya peristiwa pemicu dan perenungan batin
  - Pertumbuhan tokoh utama novel daring tidak wajib: orang normal yang pandangan hidupnya sudah utuh sejak awal lebih mudah dijadikan tempat masuk pembaca, watak tokoh yang stabil itu sendiri sudah menjadi daya tarik

  ### 6.3 Garis Merah Tokoh Utama

  Jenis tokoh utama berikut sama sekali jangan ditulis:

  | Larangan | Alasan |
  |------|------|
  | Tokoh utama tipe santa | Pembaca ingin kepuasan, bukan ceramah moral |
  | Mesin pertarungan tanpa otak | Sulit menimbulkan resonansi emosi |
  | Berinti jahat | Pembaca tidak bisa masuk ke dalamnya |
  | Berbuat salah karena bodoh/kesantaan | Pembaca tidak bisa memaafkan |
  | Putus asa dan menyerah pada diri sendiri | Lebih dibenci pembaca daripada ditindas |

  ### 6.4 Bagaimana Kalau Nada Tokoh Utama Terlalu Tinggi Sejak Awal

  **Tanda bahaya**:
  - Kehilangan ruang pertumbuhan - kemampuan/kedudukan/sumber daya sudah menyentuh langit-langit
  - Alur cerita kurang ketegangan - terjebak dalam putaran berulang "menebas semudah memotong labu"
  - Pembaca kehilangan dorongan untuk mengikuti kelanjutan

  **Cara mengatasinya**:
  - **Tekan kewibawaannya, jangan tekan orangnya** - turunkan aura dan penantian, tapi jangan menekan kemampuan dan harga diri tokoh utama itu sendiri
  - **Sisakan jarak dimensi** - meski sangat kuat di satu sisi, selalu ada dimensi lain yang menjadi titik lemah
  - **Metode perolehan berlebih** - tampak memperoleh banyak, setelah tokoh utama menghitungnya ternyata malah lebih besar lagi

  ### 6.5 Menegakkan Watak Tokoh Utama di Bab Pembuka

  - Watak tokoh dibangun lewat pilihan, di bab pembuka tokoh utama harus dibuat mengambil pilihan
  - Pembukaan bertipe pertarungan akal lebih mudah menegakkan watak tokoh daripada pembukaan bertipe kekerasan
  - Pembaca lebih mudah masuk ke dalam tokoh utama yang "cerdas tapi biasa" daripada tokoh utama yang "langsung tak terkalahkan sejak awal"

  ### 6.6 Dua Identitas dan Dua Keunggulan Bawaan Tokoh Utama

  | Dimensi | Definisi | Kegunaan |
  |------|------|------|
  | Identitas tampak | Identitas sosial/pekerjaan + status | Mengumpulkan konflik tahap awal, harus terus naik tingkat atau berganti |
  | Identitas tersembunyi | Asal-usul yang luar biasa | Mengumpulkan konflik tahap menengah dan akhir |
  | Keunggulan bawaan tampak | Sistem/giok gantung/ingatan reinkarnasi | Diperoleh sejak pembukaan dan menembus seluruh buku |
  | Keunggulan bawaan tersembunyi | Watak tokoh utama | Yang membuat tokoh utama berbeda dari yang lain itulah keunggulan bawaannya |

  **Cara penulisan terbaik**: tahap awal bergaya dengan keunggulan bawaan -> seiring alur cerita bergerak, watak tokoh perlahan diperjelas
  **Watak tokoh dan aura seluruh buku**: watak tokoh utama harus selaras dengan nada dasar dunianya, empat hal harus sangat menyatu: identitas sosial + asal-usul + keunggulan bawaan + watak

  ### 6.7 Tokoh Utama Bercacat Watak Tunggal + Sistem Rekan Hewan

  Kalau watak tokoh utama sengaja dibuat tunggal -> menurunkan penolakan pembaca untuk masuk ke dalamnya -> makin sedikit bertindak makin sedikit salah -> rasa keterlibatan naik semaksimal mungkin.

  **Masalah**: watak terlalu tunggal -> memengaruhi tingkat keseruan -> sulit mendorong cerita
  **Solusi**: bekali tokoh utama yang dingin itu dengan 3-5 rekan hewan, masing-masing berwatak berbeda.

  | Tipe rekan | Fungsi |
  |---------|------|
  | Tipe lugu-menggemaskan dan bertingkah bodoh | Bertugas melucu; tokoh utama tidak pantas dipermalukan, tapi hewan boleh |
  | Tipe cerdas bermulut pedas | Bertugas jadi juru bicara; ucapan yang tak pantas dari tokoh utama, dia yang mengatakan, sehingga wibawa tokoh utama terjaga |
  | Tipe terus terang dan bodoh | Bertugas menjadi kontras yang menggemaskan |
  | Tipe berkemampuan aneh tapi penakut | Bertugas melengkapi kemampuan |

  ### 6.8 Keseimbangan Emosi Inti dan Hasrat Berekspresi

  - Inti dari kebutuhan tidak berubah, yang berubah hanya bentuknya
  - Setelah selesai menulis satu bagian alur cerita, telaah dari sudut pandang pembaca apakah sudah menyimpang dari gimik inti
  - Kalau tokoh utama tampil hebat, dia harus memperoleh sesuatu, tidak boleh hanya memberi tanpa balasan
  - Saat hasrat berekspresi sedang meluap adalah saat paling mudah menyimpang - harus diperiksa secara aktif

  ### 6.9 Tekan Kewibawaan Bukan Orangnya: Sumber Konflik yang Benar

  **Cara yang salah**: membuat antagonis menyerang tokoh utama tanpa sebab yang jelas, logika di belakangnya tidak berpijak.

  **Cara yang benar**: antagonis punya tujuannya sendiri, tindakannya secara objektif membuat tokoh utama terhimpit, tapi bukan sengaja mengincar tokoh utama secara pribadi.

  **Rantai konflik**: tujuan antagonis -> menindas kelompok tempat tokoh utama berada (menekan kewibawaan) -> tokoh utama menjungkalkannya -> lapisan bawah tetap tumpul -> tokoh utama mengubah jalannya -> konflik baru muncul secara wajar

  Intinya: semua orang digerakkan oleh kepentingan yang mereka inginkan, di belakangnya ada perbedaan pandangan hidup, lebih dalam lagi lingkungan tempat mereka tumbuh, dan paling dalam adalah latar dunia.

  ## Bagian 7: Pendalaman Pembentukan Antagonis

  ### 7.1 Prinsip Inti Pembentukan Antagonis

  - Antagonis klasik pasti punya latar dunia yang utuh dan pandangan hidup yang konsisten secara logika
  - Peristiwa luar yang sama, kalau terjadi pada orang yang berbeda, menimbulkan perubahan yang berbeda - faktor luar dan faktor dalam beresonansi
  - Pembentukan antagonis tidak boleh hanya berisi peristiwa luar tanpa pandangan hidup dan logika batin

  ### 7.2 Cara Menulis Watak Antagonis Seperti Tokoh Utama

  **Masalah lazim**: setelah pindah peta, antagonis lama tidak mampu mengikuti ritme -> antagonis baru diperkenalkan secara bertipe datar

  **Solusi**:
  - Tulis antagonis seolah dia tokoh utama
  - Di atas dasar "tokoh pendukung menonjolkan tokoh utama" tambahkan "tokoh pendukung menonjolkan tokoh pendukung"
  - Penanganan pindah peta yang benar: pakai peta baru untuk menonjolkan bobot tokoh lama, bukan memakai tokoh lama secara tak berdaya untuk menonjolkan tingkat kesulitan peta baru

  ## Metode Tambahan: Kontras, Keterkaitan, dan Tahap Hubungan

  ### Metode Watak Tokoh Kontras Tiga Lapis Label

  | Tingkat | Nama | Makna | Contoh |
  |------|------|------|------|
  | Lapis pertama | Label identitas | Identitas yang dilihat dunia luar | Menantu terbuang keluarga konglomerat |
  | Lapis kedua | Label penampilan | Perilaku yang ditunjukkan tokoh kepada dunia luar | Menahan diri, menerima perlakuan buruk tanpa membalas |
  | Lapis ketiga | Label inti | Isi batin tokoh yang sebenarnya | Tenang, punya rencana, melangkah setapak demi setapak |

  1. Isikan tiga lapis label untuk tokoh, di antara ketiganya harus tercipta kontras - kontras = dimensi
  2. Label identitas dan label penampilan boleh mirip (memperkuat kesan stereotip), tapi label inti harus berbalik
  3. Makin besar kontrasnya, makin mengguncang "saat kartu dibuka" oleh tokoh
  4. Setiap tokoh penting sebaiknya punya setidaknya satu lapis kontras
  5. Wujudkan kontras lewat perbandingan perilaku, jangan digambarkan langsung:

  ```
  Label identitas: menantu terbuang keluarga konglomerat
  Perilaku penampilan: dimaki tidak membalas, diusir tidak melawan
  Perilaku inti: diam-diam merekam, mengumpulkan bukti, memindahkan harta lebih dulu
  ```

  ### Tahap Lanjut Kontras Perilaku Tiga Lapis Label

  Setelah hubungan memasuki lapis ketiga (hubungan intim), perilaku yang bisa dilakukan tokoh pada lapis hubungan pertama dan kedua justru jadi tidak bisa dilakukan lagi.

  | Tahap hubungan | Perilaku yang bisa dilakukan | Perilaku yang tidak bisa dilakukan |
  |----------|---------|-----------|
  | Masa label identitas (asing) | Menggoda, dingin, menjaga jarak | - |
  | Masa label penampilan (mulai akrab) | Melanjutkan pola perilaku sebelumnya | - |
  | Masa label inti (intim) | Menampakkan diri yang sejati | Godaan/sikap dingin sebelumnya justru jadi tidak bisa dilakukan lagi |

  1. Periksa tokoh sedang berada di tahap hubungan yang mana
  2. Kontras perilaku itu sendiri bagian dari watak tokoh, wajib ditulis ke dalam alur cerita
  3. Ciptakan ketegangan dengan "kemunduran perilaku = pendalaman perasaan" - gadis berani yang suka menggoda tokoh utama pada masa label identitas, setelah masuk hubungan intim justru tidak berani menyatakan perasaan
  4. Jangan biarkan tokoh tetap mempertahankan perilaku awalnya pada tahap intim, kalau tidak kontrasnya jadi tidak berfungsi

  ### Pelapisan Keterkaitan Watak Tokoh (keterkaitan kuat/sedang/lemah)

  | Tingkat | Definisi | Fungsi | Ketentuan jumlah |
  |------|------|------|---------|
  | Keterkaitan kuat | Latar yang langsung memengaruhi arah alur cerita dan titik kepuasan bergaya pada gimik inti | Mendorong benturan antartokoh dan gerak alur cerita | Setiap tokoh minimal 3 buah |
  | Keterkaitan sedang | Latar keterkaitan kuat milik tokoh pendukung, tidak boleh mencuri panggung tokoh utama | Memberi fungsi dan daya kenal bagi tokoh pendukung | Secukupnya |
  | Keterkaitan lemah | Latar preferensi pribadi yang memperkaya ketebalan tokoh | Menambah kenyataan dan daya ingat tokoh | Tak dibatasi |

  1. Golongkan kekuatan, uang, jaringan relasi, latar belakang, dan atribut lain milik tokoh utama yang memengaruhi arah alur cerita sebagai keterkaitan kuat
  2. Periksa apakah keterkaitan kuat sudah mencapai minimal 3 buah per tokoh
  3. Golongkan hal seperti "suka makan kue" dan "hobi melihat perempuan cantik" sebagai keterkaitan lemah, hanya untuk memperkaya watak tokoh
  4. Pastikan keterkaitan lemah tidak mengambil alih perhatian dari yang utama - keterkaitan kuatlah inti yang memperpanjang alur cerita

  ### Aturan Pelaksanaan Watak Tokoh

  Watak tokoh bukan tabel data tokoh.

  - Tabel data tokoh = tumpukan informasi tinggi badan, penampilan, latar belakang keluarga, dan sejenisnya (informasi luar)
  - Watak tokoh = perancangan fungsional yang berkembang di sekeliling "jiwa/kepribadian khusus" tokoh
  - Misi watak tokoh: melayani ketegangan dramatik dan tarik-menarik emosi, menggerakkan perilaku lewat kepribadian, bukan didorong paksa oleh alur cerita

  **Pemeriksaan**: kalau data tokoh yang kamu tulis hanya berisi tinggi, berat, dan hobi, tanpa perancangan fungsional untuk "jiwa/kepribadian khusus", kerjakan ulang.

  ### Metode Menonjolkan Watak Tokoh

  1. Tangkap titik terangnya - temukan ciri paling mencolok pada tokoh, tampilkan dengan memusatkan seluruh tenaga
  2. Tampilkan watak tokoh lewat tindakan, jangan lewat gambaran narasi (misalnya setelah keluar dari penjara tidak merendah dan tidak angkuh, memperjuangkan kepentingannya, menampakkan kematangan)
  3. Ciptakan ketegangan lewat benturan kontras
  4. Kontras yang menarik ketegangan akan menyaring pembaca, kendalikan kadarnya - kontras yang terlalu besar akan membuat sebagian pembaca mundur

  ### Cara Menulis Adegan Kecerdasan Emosional Tinggi/Orang Cerdas

  1. Kecerdasan emosional tinggi diwujudkan lewat penampilan dalam alur cerita yang konkret, jangan dipuji lewat narasi
  2. Tulis adegan konkret tentang membaca situasi, tanggap di lapangan, dan mengendalikan situasi saat menyambung ucapan
  3. Penampilan kecerdasan emosional tinggi sebaiknya merujuk pola kasus sukses dalam novel daring klasik; setiap adegan setidaknya berisi satu balikan berupa "pembaca menduga akan canggung tapi tokoh utama menyelesaikannya"
  4. Setiap adegan setidaknya punya satu "balikan" - pembaca menyangka akan canggung, ternyata tokoh utama menyelesaikannya dengan sempurna

  ### Memakai Tokoh Pendukung sebagai Simpul Penantian (kancing tokoh)

  1. Pilih satu tokoh pendukung sebagai "markas misi" - satu tokoh sekaligus memikul beberapa penantian jangka pendek dan jangka panjang
  2. Setiap kali tokoh utama menyelesaikan suatu peristiwa dan selesai bergaya, dia menemui tokoh tersebut, lalu babak bergaya yang baru dimulai
  3. Setelah setiap unit alur cerita berakhir, manfaatkan tokoh yang sama untuk membuka alur cerita baru
  4. Saat tokoh itu turun panggung, hadirkan keuntungan yang lebih besar, pakai "salah sasaran tapi malah memperoleh lebih banyak" untuk mengubah psikologi "keengganan akan kehilangan" pada pembaca

  ### Metode Pendalaman ke Arah Watak Tokoh

  Tentukan dulu apakah proyek saat ini cocok untuk "pendalaman cerita" atau "pendalaman watak tokoh":

  | Syarat | Arah prioritas | Tindakan pelaksanaan |
  |------|------|------|
  | Alur utama sudah rumit, banyak faksi, banyak balikan | Pendalaman ke arah watak tokoh | Jaga struktur cerita tetap sederhana, ciptakan kesegaran pada hasrat, kontras, dan interaksi hubungan antartokoh |
  | Alur utama terlalu lurus, tokoh sudah tegas tapi peristiwa kurang | Pendalaman ke arah cerita | Tambahkan penghalang, perubahan tujuan, kesenjangan informasi, atau harga yang harus dibayar; jangan menambah tokoh tanpa fungsi |
  | Panjang pendek/ringan | Pendalaman ke arah watak tokoh | Gerakkan konflik dengan 1-2 label watak tokoh yang kuat, jangan membentangkan latar dunia yang besar |
  | Volume kunci/volume klimaks pada karya panjang | Gabungan keduanya | Cerita naik satu dimensi, sekaligus buat hubungan antartokoh kunci berubah secara terlihat |

  #### Langkah Pelaksanaan

  1. Ambil satu struktur cerita yang sederhana bahkan klise
  2. Tambahkan "sifat dramatik" pada tokoh - latar yang membuat pembaca sasaran menemukan keasyikan
  3. Hasilkan alur cerita yang berkelanjutan lewat putaran interaksi beberapa tokoh

  #### Cara Penulisan Berputar (satu alur sederhana bisa ditulis lebih dari 5 bab)

  - Bab 1: tokoh utama bergaya -> saudara seperguruan senior makin mendesak
  - Bab 2: senior itu menekan si gadis -> kekasihnya turut memaksa dan membujuk
  - Bab 3: si gadis mendekati tokoh utama -> kekasihnya bersenang-senang diam-diam
  - Bab 4: si gadis kembali dan mengadu sambil menangis -> kekasihnya berpura-pura menghibur sambil diam-diam bersenang hati
  - Bab 5: melapor dan menerima hadiah -> si gadis mendapati kekasihnya tidak begitu gembira atas hadiah itu

  ### Teknik Pembentukan Tokoh

  #### Pembentukan Tokoh Perempuan (kanal pembaca pria)

  1. Yang disukai pembaca adalah label tokoh utama perempuan (mulia dan elegan, kulit putih dan kaki jenjang), bukan penggambaran fisiknya
  2. Manfaatkan kesan stereotip: vampir = mulia dan elegan + berpenampilan menonjol, tanpa digambarkan khusus pembaca sudah tahu
  3. Dalam novel daring, kecantikan adalah sumber daya paling murah - jangan menghabiskan banyak tulisan untuk penampilan
  4. Penetapan watak boleh dibuat ekstrem: gengsi manja sampai puncaknya, mencintai tokoh utama sangat mendalam, tidak memikirkan kepentingan dirinya
  5. Jaga konsistensi watak: setelah ditetapkan, ucapan dan tindakannya selalu sesuai

  #### Tokoh Utama Boleh Berbuat Salah tapi Kadarnya Harus Dijaga

  | Bisa dimaafkan | Tidak bisa dimaafkan |
  |--------|---------|
  | Kesalahan akibat keadaan yang tak terelakkan atau kesenjangan informasi | Kesalahan akibat kebodohan atau hati kesantaan yang meluap |
  | - | Kesalahan yang tidak sepadan dengan kekuatannya (pendekar sekelas kaisar bertarung berbuat bodoh karena orang kecil) |

  #### Kontras Luar dan Dalam Watak Tokoh Utama

  1. Boleh dirancang kontras antara permukaan dan batin (misalnya di permukaan mata keranjang, sebenarnya batinnya kesepian)
  2. Rasa kontras menambah kedalaman dan keasyikan tokoh, serta memberi banyak kemungkinan konflik alur cerita

  #### Hakikat Tokoh Antagonis

  Antagonis = orang yang posisinya berbeda dan kepentingannya berlawanan dengan tokoh utama. Berikan antagonis pemikiran dan pengejaran miliknya sendiri, jangan menulis kejahatan yang murni.

  #### Cara Menulis Watak Tokoh Bejat

  1. Sejak awal sampaikan watak tokoh utama dengan jelas, tetap konsisten sebelum dan sesudah berpindah dunia
  2. Hindari "sok suci padahal tidak" - kalau di depan tidak digambarkan bahwa tokoh utama mata keranjang lalu belakangan tiba-tiba mengejar perempuan, pembaca akan tidak suka
  3. Watak tokoh yang jelas = menyaring pembaca yang menerima orang macam ini = pengelolaan ekspektasi

  ### Metode Titik Ingatan Tokoh

  1. Setiap tokoh setidaknya punya satu sisi watak yang sangat mencolok
  2. Hanya dengan membuat satu ciri sangat mencolok, barulah ada titik ingatan
  3. Tujuannya: bahkan kalau alur cerita tidak bergerak, saat beberapa tokoh duduk bersama dan mengobrol, pembaca tetap membacanya dengan asyik

  ### Metode Keunggulan Bawaan Menyandera Watak Tokoh

  1. Keunggulan bawaan bukan hanya memberi tokoh utama kekuatan super, tujuannya membuat watak tokoh utama menjadi wajar
  2. Sandera perilaku dengan aturan keunggulan bawaan -> reaksi tokoh pendukung secara wajar membentuk citranya -> tidak perlu menggambarkan langsung kepribadian tokoh utama
  3. Kejar kepuasan moral (kepuasan tingkat tertinggi): jadikan tokoh utama "orang suci hidup" yang membuat pembaca tunduk kagum pada tataran perilaku

  ### Pembentukan Watak Tokoh Berpusat pada Gimik

  1. Label tunggal seperti "tegas dan tanpa ampun" atau "berdarah panas" terlalu kabur -> bangun tokoh dengan gimik yang konkret -> pembaca mendapat titik ingatan yang kuat
  2. Contoh: setiap kali tokoh pendukung melihat tokoh utama berhasil -> iri, cemburu, benci -> "kamu memang pantas mati" -> titik ingatan kuat + keasyikan
  3. Watak tokoh yang bagus + keunggulan bawaan yang biasa-biasa saja + pola yang klise -> juga bisa memancarkan daya tarik yang tak terduga

  ### Kerangka Watak Tokoh Sembilan Dimensi

  | Dimensi | Isi | Poin penting |
  |------|------|------|
  | Informasi dasar | Kehidupan sebelumnya dan sekarang/ciri penampilan | Bangun rasa penantian jangka panjang mulai dari tokoh |
  | Watak | Watak tokoh yang kontras | Menyiapkan landasan bagi busur pertumbuhan |
  | Hobi dan kebiasaan | Mata duitan/gemar perempuan/mendoakan arwah setelah membunuh | Jadikan titik ingatan kuat dan tekankan berulang-ulang |
  | Hubungan antarpribadi | Makin rumit jaringan hubungan, makin mampu menciptakan konflik | Tokoh penting yang terlibat masing-masing punya kekuatan dan latar belakang |
  | Latar belakang | Keluarga/asal-usul/lingkungan tumbuh | - |
  | Busur pertumbuhan | Lihat tiga tahap di bawah | - |
  | Perbandingan dan kontras | Orang jahat vs orang baik/dokter yang menyelamatkan nyawa -> memikul senapan membunuh | - |
  | Nilai dan sikap | Identitas dan kedudukan berbeda, pandangannya berbeda | Sikap = tujuan tindakan |
  | Biografi ringkas tokoh | Cerita khas yang penting | Riwayat hidup yang dipadatkan |

  #### Busur Pertumbuhan Tokoh (tiga tahap)

  | Tahap | Inti | Berpadanan dengan |
  |------|------|------|
  | Aku kecil (masa kanak) | Mengarang diri sendiri, ingin menjadi aku dalam pandangan orang lain | Motif |
  | Aku sejati (masa muda) | Diri yang sebenarnya, tersiksa terjepit di antara keduanya | Sikap |
  | Aku milik orang lain (kematangan) | Diri dalam pandangan orang lain itulah tujuan yang dikejar | Nilai |

  Rumus emosi: terpuaskan (pengakuan) -> terpukul (simpati) -> ragu (resonansi) -> hati teriris (empati)

  ### Label Empat Tahap Hubungan Watak Tokoh

  | Tahap | Tingkat pemahaman | Penampilan |
  |------|---------|------|
  | Bertemu (orang asing) | Hanya tahu penampilan luar | Waspada/menjaga jarak/berjaga-jaga |
  | Berkenalan (orang yang lewat) | Paham awal tapi tidak tahu batasnya | Membaca situasi/menjilat |
  | Saling mengenal (sahabat dekat/teman perempuan terdekat) | Tahu tabiat dan batasnya | Bercanda nakal/menumpahkan isi hati/mengeluhkan kegelisahan |
  | Bercinta (kekasih) | Paham luka di dalam hatinya | Rasa memiliki kuat/berbicara tak henti/rela bersusah payah |

  ### Memahami Struktur Hubungan Novel Daring dengan Pola Pikir Dunia Kerja

  Hakikat novel daring: puas total di satu "dunia kerja", lalu pindah ke "dunia kerja" berikutnya.

  | Dimensi kesamaan | Penjelasan |
  |---------|------|
  | Tingkatan | Di lingkungan mana pun ada hubungan atasan dan bawahan |
  | Saling membantu | Kerja sama dan saling menguntungkan di antara yang setingkat |
  | Saling merugikan | Persaingan dan saling menjatuhkan di antara yang setingkat |

  | Dimensi perbedaan | Penjelasan |
  |---------|------|
  | Cara kerja sama | Pola kerja sama berbeda di lingkungan yang berbeda |
  | Jenis sumber daya | Sumber daya yang diperebutkan berbeda di lingkungan yang berbeda |
  | Kemampuan individu | Keunggulan unik tokoh utama |

  #### Langkah Pelaksanaan

  1. Rancang satu "lingkungan dunia kerja" untuk tokoh utama (sekolah/sekte/perusahaan/militer)
  2. Tetapkan hubungan tingkatan (atasan/setingkat/bawahan/lawan)
  3. Manfaatkan hubungan tingkatan untuk memunculkan konflik dan pertentangan secara wajar
  4. Setelah tokoh utama puas total di lingkungan ini, pindahkan ke "dunia kerja" yang lebih besar

  ### Metode Pembangunan Rasa Keterlibatan

  - Aturan menjaga rasa keterlibatan: ritme dan rantai emosi tidak boleh terputus. Tanda keterputusan = pembaca mulai menilai alur cerita dengan logika kenyataan
  - Begitu pembaca mulai menilai dengan logika kenyataan = ada masalah pada ritmenya
  - Intinya rantai emosi tidak terputus

  | Metode | Cara kerja | Efek |
  |------|------|------|
  | Titik masuk empati | Pakai peristiwa yang lazim dalam kehidupan sehari-hari | Seketika mendekatkan jarak |
  | Kenyataan pada detail | Isi dengan detail yang membumi | Memperkuat kenyataan dunianya |
  | Alur menyelamatkan kucing | Satu alur di bagian awal yang menegaskan salah satu sisi watak tokoh utama | Pembaca cepat mengenal dan masuk ke dalamnya |
  | Prasyarat empati | Biarkan tokoh menyingkapkan sisi sejatinya (kelemahan/kesulitan) | Pembaca tumbuh keinginan melindungi |
  | Titik kekhawatiran yang wajar | Kesulitan yang dipahami siapa pun seperti "kekurangan uang" | Empati yang alami |

  #### Tiga Tingkat Empati

  1. **Empati permukaan**: pengalaman yang serupa
  2. **Empati mendalam**: emosi yang serupa
  3. **Rasa sepaham**: nilai yang sejalan

  #### Perilaku yang Merusak Rasa Keterlibatan (hindari)

  - Tokoh mengambil pilihan yang tidak bisa dipahami pembaca
  - Penjelasan latar yang panjang memotong penceritaan
  - Ritme yang berlarut-larut sampai rantai emosi terputus
  - Pandangan hidup tokoh utama menyimpang jauh dari pembaca sasaran

  ### Pengendalian Rasa Aman dan Emosi Inti

  1. Kebutuhan rasa aman pembaca berbeda menurut genrenya, pastikan dulu genrenya
  2. Genre bernuansa ketegangan seperti aliran jalan ekstrem: rasa aman dinaikkan sampai puncak = rasa krisis hilang = emosi inti bergeser - jangan mencarikan tokoh utama pelindung yang terlalu kuat
  3. Dilarang menyediakan pelindung kuat bagi tokoh utama yang bisa menyelesaikan krisis kapan saja - keberadaan pelindung tidak boleh melemahkan rasa terdesak. Saat aturan ini dilanggar, tandai sebagai "pelindung berlebihan"
  4. Saat tenaga terbatas, alur cerita selalu yang pertama, latar dunia hanya nilai tambah

  ## Daftar Periksa Mutu

  Setelah selesai merancang tokoh, periksa butir per butir:

  ### Pemeriksaan Tokoh Utama

  - [ ] Motifnya berada di tataran emosi (bukan omongan kosong semacam "ingin menjadi yang terkuat")
  - [ ] Punya kelemahan fatal, dan kelemahan itu akan menyebabkan kesalahan pada alur cerita kunci
  - [ ] Penampilannya punya titik ingatan (3-5 kata kunci)
  - [ ] Punya ucapan khas atau gerakan penanda
  - [ ] Wibawanya terjaga - tidak akan dipandang rendah pembaca
  - [ ] Tidak menyentuh garis merah (kesantaan/mesin pertarungan tanpa otak/berinti jahat/berbuat salah karena bodoh/putus asa menyerah pada diri sendiri)
  - [ ] Tujuan intinya sejajar dengan alur utama seluruh buku

  ### Pemeriksaan Tokoh Pendukung

  - [ ] Punya fungsi yang jelas (mentor/sekutu/sumber informasi/korban/cermin pembanding)
  - [ ] Ciri intinya bisa dirangkum dalam 1-2 kata kunci
  - [ ] Punya ciri penanda yang membuat pembaca mengingatnya
  - [ ] Cara keluar panggungnya sudah direncanakan
  - [ ] Dalam satu adegan tidak lebih dari 3 tokoh pendukung yang punya dialog

  ### Pemeriksaan Tokoh Antagonis

  - [ ] Dirancang menurut tabel tingkatan, porsi tulisan sepadan dengan tingkatannya
  - [ ] Saat muncul sudah memperagakan kekuatan atau caranya
  - [ ] Motifnya masuk akal dari sudut pandang antagonis
  - [ ] Setidaknya sekali mengalahkan tokoh utama (antagonis menengah dan di atasnya)
  - [ ] Tidak ada kemenangan yang dihadiahkan karena antagonis mendadak bodoh
  - [ ] Bos busur besar punya konflik prinsip (bukan hanya konflik kepentingan)
  - [ ] Bos terakhir sudah punya petunjuk awal sejak bab pertama

  ### Pemeriksaan Motif

  - [ ] Sebabnya konkret (bukan ungkapan kabur semacam "ditindas")
  - [ ] Kendalanya kuat (tokoh utama tidak boleh menindas terus sepanjang jalan)
  - [ ] Risikonya nyata (pembaca percaya tokoh utama mungkin kehilangan sesuatu yang penting)
  - [ ] Perkembangan motifnya berlandasan, tidak berubah begitu saja

  ### Pemeriksaan Pembentukan

  - [ ] Tujuan tokoh ditunjukkan lewat perilaku, bukan dijelaskan lewat narasi
  - [ ] Perilaku/bahasa/pola pikir berkembang di sekeliling watak tokoh, tidak ada watak tokoh yang diubah demi alur cerita
  - [ ] Tokoh utama punya titik pengulangan perilaku, menjaga konsistensi pada karya panjang
  - [ ] Tokoh pendukung punya keterkaitan jelas dengan tokoh utama, tidak mencuri panggung tokoh utama
  - [ ] Kebenaran tokoh/orientasi nilai tersingkap secara wajar pada saat pengambilan keputusan kunci

  ### Pemeriksaan Menyeluruh

  - [ ] Apakah tokoh punya tiga lapis label (identitas/penampilan/inti), dan setidaknya ada satu lapis kontras
  - [ ] Apakah latar keterkaitan kuat sudah mencapai lebih dari 3 buah
  - [ ] Apakah watak tokoh berupa perancangan fungsional atau hanya tumpukan informasi penampilan
  - [ ] Apakah tokoh pendukung punya fungsi yang jelas, apakah mencuri panggung tokoh utama
  - [ ] Apakah setiap tokoh punya setidaknya satu titik ingatan
  - [ ] Apakah setiap kemunculan tokoh pendukung punya fungsi, tanpa isian kosong yang tak berguna
  - [ ] Apakah tokoh yang berbeda punya gaya bicara dan ciri perilaku yang berbeda
  - [ ] Apakah kesalahan tokoh utama masih dalam batas yang bisa dimaafkan
  - [ ] Apakah antagonis punya logika dan pengejaran miliknya sendiri, bukan kejahatan murni
  - [ ] Apakah ucapan dan tindakan sesuai watak tokoh dari awal sampai akhir, apakah ada watak tokoh yang runtuh
  - [ ] Apakah rantai emosi rasa keterlibatan berkesinambungan, apakah terpotong oleh penjelasan latar
  - [ ] Apakah rasa aman sepadan dengan tuntutan genre (genre bernuansa ketegangan tidak boleh memberi tokoh utama pelindung yang terlalu kuat)
  - [ ] Apakah adegan kecerdasan emosional tinggi ditampilkan lewat alur cerita yang konkret, bukan lewat pujian narasi

