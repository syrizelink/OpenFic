  - name: Daftar periksa telaah kontrak
    content: |
      - Apakah bagian ini menyerahkan janji genre, dan bukan merosot jadi peningkatan atau prosedur generik.
      - Apakah tokoh utama memegang hak menilai, memilih, memberi mandat, atau menyelesaikan kausalitas kunci.
      - Apakah imbal hasil inti, pengakuan, dan kekuasaan kembali kepada pemilik yang dijanjikan.
      - Apakah biaya tindakan nyata dan berkaitan dengan imbal hasil, bukan hukuman yang dibuat-buat demi menciptakan "biaya".
      - Apakah aset inti punya pertukaran yang terlihat, dan apakah aset itu diambil alih institusi atau tokoh pendukung yang tak relevan.
      - Apakah utang ekspektasi sudah dilunasi, ditunda dengan bunga yang dibayar, atau justru ditelan penjelasan dan prosedur.
      - Apakah kebenaran babak akhir, musuh terakhir, batas atas kemampuan, atau titik akhir jati diri dihabiskan sebelum waktunya.
      - Apakah peta baru, institusi baru, kemampuan baru, dan misteri baru sudah membayar utang ganti buku.
  - name: Penilaian risiko
    content: |
      - Kontrak aman: janji, hak agensi tokoh utama, kepemilikan imbal hasil, dan batas tahap sudah jelas.
      - Perlu penguatan: arahnya benar, tetapi masih perlu menambah pertukaran, persiapan, biaya, atau imbal hasil yang terlihat.
      - Kontrak rusak: kenikmatan inti ditukar, tokoh utama dirampas kausalitas kuncinya, atau sumber daya garis panjang dihabiskan sebelum waktunya; wajib memperbaiki kerangka.
  - name: Batas kontrak asli dan studi kasus
    content: |
      # Tambahan asli kontrak pembaca

      Referensi ini dipakai untuk memeriksa kontrak pembaca, hak agensi tokoh utama (daya gerak dan dominasi naratif), keamanan kepentingan, dan laju antar tahap. Penilaian terkait berasal dari sampel utas pertanyaan dan utas penghindaran jebakan, bersifat konsensus non-statistik, dan tidak bisa menggantikan penilaian atas genre, platform, serta buku pembanding yang spesifik. Dilarang membawa data privat situs sumber, kredensial akses, cookies, tokens, tanda tangan permintaan, pengenal privat, atau informasi yang bisa dipakai menelusuri balik akun privat ke dalam runtime.

      ## Tambahan konsep inti

      - Hak agensi tokoh utama pertama-tama dilihat dari hak kausalitas dan hak penyelesaian, bukan durasi kemunculan, dan tidak menuntut tokoh utama selalu bertindak sendiri atau memonopoli setiap sorotan.
      - Dalam cerita pemuas langsung, tokoh utama yang bertindak sendiri dan menghancurkan lawan di depan mata pembaca itu sendiri sudah merupakan penuntasan kontrak; hanya genre penataan rencana, intrik kekuasaan, pengelolaan usaha, potret kolektif, dan mentor yang secara baku mengizinkan pengaturan dari balik layar dan penuntasan melalui perantara.
      - Genre potret kolektif, mentor, dan kerja sama kelembagaan boleh memberikan kepemilikan ekspektasi secara eksplisit kepada anggota tim, murid, atau tokoh institusi; kuncinya adalah janji di awal dan penyelesaian sesuai perjanjian, bukan penjelasan setelah kejadian untuk membenarkan perampasan sorotan.
      - Biaya bisa berupa waktu, hubungan, keterbukaan jati diri, sumber daya yang terpakai, atau permusuhan baru; bab bertekanan rendah, bab transisi, dan bab hadiah murni tidak wajib dibebani harga tambahan.

      ## Penjelasan institusi dan utang rasionalisasi

      Biaya penjelasan dipakai untuk menerangkan mengapa respons atau pengambilalihan institusi, kerahasiaan, mobilisasi sumber daya, penegakan lintas wilayah, dan kolaborasi organisasi itu masuk akal. Telaah apakah penjelasan tersebut melayani emosi inti; kalau penjelasan menelan titik pemuas, rasa keterlibatan, atau momen puncak tokoh utama, penjelasan harus dipendekkan, diubah menjadi pertukaran yang terlihat, atau reaksi institusi diturunkan derajatnya menjadi penonton, penghambat, atau antarmuka sumber daya.

      ## Pengecualian khas

      - Kontrak potret kolektif: setiap POV punya tujuan dan pelunasannya sendiri, dan kontrak volume menuliskan dengan jelas siapa pemilik momen puncak di volume itu.
      - Kontrak mentor: momen puncak tokoh utama bertipe mentor terletak pada merancang pelatihan, membaca kebuntuan, menjadi penopang di saat kritis, dan menanggung harga di lapisan yang lebih tinggi, bukan memanen hasil dengan tangan sendiri setiap kali.
      - Kontrak kerja sama kelembagaan: pembuka langsung menjanjikan kolaborasi dengan negara atau institusi, dan tokoh utama memperoleh kekuasaan serta imbal hasil yang jelas sebagai ahli, komandan, pemilik sumber daya kunci, atau pelaksana tak tergantikan.
      - Tragedi, misteri, dan perang berpotret kolektif boleh membiarkan orang lain menuntaskan sebagian aksi, tetapi tokoh utama harus mendapat tugas inti baru, harga baru, atau kemajuan pemahaman.

      ## Risiko sambungan

      Utang ganti buku: memasukkan peta baru, institusi baru, kemampuan baru, musuh baru, atau misteri baru menuntut pembayaran biaya persiapan yang diperlukan sekaligus menambah utang ekspektasi baru; unsur segar tidak boleh dipakai untuk melarikan diri dari janji lama. Dalam cerita pemuas berbasis pemenuhan janji atau fantasi kemampuan, tokoh utama yang berulang kali menciptakan bencana karena kebodohan atau ketidakmampuan yang bisa dihindari, lalu dibereskan orang lain, akan terus merusak hak kausalitas, rasa kendali, dan kepercayaan pada penyelesaian; ini risiko tinggi yang dinilai menurut kontrak genre, bukan larangan mutlak untuk semua cerita.
