id: builtin-skill--reader-contract
name: Telaah kontrak pembaca dan laju alur cerita
summary: Memeriksa janji inti pembacaan, hak agensi tokoh utama, kepemilikan ekspektasi, pertukaran imbal hasil, cadangan babak akhir, dan risiko laju alur cerita.
is_enabled: true
content: |
  # Kontrak pembaca dan cadangan babak akhir

  Kontrak pembaca adalah kenikmatan membaca yang dijanjikan bersama oleh pembuka, genre, konfigurasi tokoh utama, dan nada penceritaan. Sebelum memakai Skill ini, pastikan dulu apa yang sebenarnya dicari pembaca: tokoh utama yang menyelesaikan masalah, potret kolektif satu tim, mentor yang mengangkat generasi muda, kerja sama kelembagaan dan pembangunan, atau janji lain yang sudah jelas. Adegan yang sama punya tingkat risiko berbeda di bawah kontrak yang berbeda.

  ## 1. Hak agensi tokoh utama: hak kausalitas dan hak penyelesaian

  - Hak kausalitas: tokoh utama menentukan mengapa suatu hal terjadi, bagaimana hal itu dimulai, dan ke mana arahnya berubah, melalui keputusan, penataan rencana, pemberian mandat, informasi atau sumber daya yang tak tergantikan, atau pilihan aktif atas konsekuensi kunci.
  - Hak penyelesaian: imbal hasil inti, pengakuan, kekuasaan, atau konsekuensi kunci kembali kepada pihak yang berhak sesuai janji yang sudah ada.
  - Hak agensi tidak berarti tokoh utama harus selalu bertindak sendiri, dan tidak menuntut tokoh utama memonopoli setiap sorotan. Ia boleh membentuk tim, diselamatkan, menerima bimbingan, atau menyerahkan sebagian aksi kepada orang lain, selama kausalitas dan penyelesaiannya tidak dirampas tanpa suara.
  - Cerita pemuas langsung biasanya menuntut tokoh utama bertindak dan menuntaskan sendiri di depan mata pembaca; genre penataan rencana, intrik kekuasaan, pengelolaan usaha, potret kolektif, dan mentor boleh membiarkan tokoh utama mengatur dari balik layar, tetapi kontribusi tak tergantikan dari tokoh utama harus jelas.

  ## 2. Kepemilikan ekspektasi dan empat pertanyaan di titik kunci

  Momen puncak yang sudah dijanjikan adalah milik tokoh utama atau pemilik lain yang sudah dijanjikan pada volume ini atau unit alur cerita ini. Tokoh pendukung boleh mengeksekusi sebagian aksi, tetapi tidak boleh merampas kepemilikan ekspektasi tanpa suara. Genre potret kolektif, mentor, atau kerja sama kelembagaan boleh memberikan momen puncak secara eksplisit kepada anggota tim, murid, atau institusi, asalkan dijanjikan lebih dulu dan diselesaikan sesuai perjanjian.

  Setiap kali menemui titik kunci, tanyakan hal yang sama:
  1. Siapa yang menentukan mengapa hal itu terjadi atau bagaimana hal itu dimulai?
  2. Siapa yang membuat pilihan kunci yang tak tergantikan?
  3. Siapa yang menanggung atau memilih konsekuensi kuncinya?
  4. Kepada siapa imbal hasil inti, pengakuan, dan kekuasaan akhirnya diselesaikan?

  ## 3. Keamanan kepentingan dan utang ekspektasi

  - Keamanan kepentingan: pembaca yakin daya tarik inti yang ia ikuti tidak akan dirampas, diencerkan, dihadiahkan kepada orang lain, atau diserahkan kepada tokoh tak relevan untuk dicerna.
  - Siapa yang menanam persiapan, siapa yang menahan tekanan, siapa yang memilih, dialah yang seharusnya mendapat imbalan emosional utama; reaksi penonton dan tokoh pendukung boleh memperbesar titik pemuas, tetapi tidak boleh menggantikan penuntasan intinya.
  - Anugerah emas, sumber daya kunci, kartu identitas rahasia, teknologi eksklusif, dan bukti kunci tidak boleh diserahkan, dibongkar, atau diambil alih tanpa pertukaran. Kalau memang harus diserahkan, harus ada pertukaran yang terlihat: kekuasaan, perlindungan, sumber daya, jalur akses, status resmi, hak tagih, informasi, kemenangan tahap, atau inisiatif yang lebih besar.
  - Setiap janji menghasilkan utang ekspektasi: tokoh utama akan membalas, sumber daya akan naik kelas, jati diri akan terbuka, hubungan akan maju. Menunda boleh, tetapi bunganya harus dibayar: kemajuan bertahap, informasi baru, perubahan situasi, pelepasan emosi, atau tujuan berikutnya yang lebih jernih.
  - Menunda penuntasan dengan penjelasan, latar, atau prosedur kelembagaan akan menambah utang rasionalisasi.

  ## 4. Cadangan babak akhir dan irama laju

  ### Kartu pamungkas babak akhir
  Musuh bebuyutan nomor satu, kebenaran terakhir atau asal-usul, batas atas anugerah emas, titik akhir jati diri atau kedudukan, dan kepastian akhir hubungan emosional semuanya termasuk sumber daya babak akhir yang sekali pakai. Rancang pembukaannya secara bertahap; satu volume biasanya hanya membuka satu tonggak besar babak akhir, dan tidak boleh dibakar habis lebih awal.

  ### Tangga peningkatan
  Tingkatan kultivasi, level, peta wilayah, lapisan faksi, dan musuh sasaran harus punya barisan cadangan. Kurangnya tangga dalam sistem adalah masalah rancangan, bukan sesuatu yang diselesaikan dengan menahan-nahan jumlah kata setiap bab; musuh, peta, dan sasaran dibuka bertahap, dan dilarang membantai musuh puncak atau menyelesaikan tujuan akhir sebelum waktunya.

  ### Kerapatan tiap unit
  Setiap unit alur cerita punya satu garis pendorong utama, misalnya kekuatan tempur, sumber daya, jati diri, hubungan, informasi, peta, kelembagaan, faksi, karier, atau kepastian emosi; garis lain boleh menghasilkan buah kemenangan secara wajar. Satu kemenangan besar yang sekaligus menembus tingkatan, merampas rampasan, menguasai faksi, menaikkan reputasi, atau memajukan hubungan itu diperbolehkan, selama tidak ada yang melampaui batas tahapnya.

  Karya berirama cepat mempertahankan peristiwa atau kemajuan titik pemuas yang terlihat di setiap bab; karya berirama lambat, bertema membangun kehidupan, dan bertema emosi cukup mengubah salah satu dari tujuan, risiko, informasi, hubungan, sumber daya, jati diri, atau sikap emosional. Bab bertekanan rendah disambung dengan perubahan kecil yang tetap terlihat, tanpa memaksakan klimaks di setiap bab. Setelah klimaks boleh ada jeda bertekanan rendah, biarkan pembaca menerima hadiah kecil yang terlihat sebelum masuk ke putaran tekanan berikutnya.

  ### Dua pertanyaan penarikan berlebih
  1. Apakah kartu pamungkas babak akhir yang belum boleh dibuka pada tahap ini sudah dipakai?
  2. Apakah salah satu garis peningkatan sudah didesak mendekati batas atas, sehingga tidak ada tangga lanjutan setelahnya?

  Kalau salah satu jawabannya "ya", itu peringatan penarikan berlebih, dan perlu dikembalikan atau kerangkanya diubah; kalau keduanya "tidak", kenaikan beberapa garis sekaligus biasanya boleh diloloskan. Ini penilaian berbasis pengalaman, disesuaikan menurut genre, platform, dan tonggak buku ini, bukan ambang keras yang kaku.

  ## 5. Institusi dan penonton

  Pemerintah, kantor pusat, organisasi, perusahaan, dan institusi berlapis tinggi lainnya tidak otomatis beracun, tetapi begitu muncul mereka bisa membuka garis alur cerita kelembagaan dan wilayah pengaruh faksi. Kalau pembuka sudah menjanjikan kerja sama kelembagaan, tokoh utama boleh berperan sebagai ahli, komandan, pemilik sumber daya kunci, atau pelaksana tak tergantikan, dan memperoleh kekuasaan, perlindungan, sumber daya, imbal hasil, atau wewenang bertindak yang jelas.

  Penonton cocok mengurus keterkejutan, salah menilai, penyebaran opini, penawaran harga sumber daya, pemilihan pihak, dan menjadi saksi atas pilihan tokoh utama. Jangan biarkan penonton membalaskan dendam tokoh utama, mengambil keputusan akhir sebagai gantinya, atau mengambil imbal hasil inti.

  ## 6. Tingkat risiko

  | Tingkat | Definisi | Penanganan |
  |---|---|---|
  | Kontrak aman | Sejalan dengan genre pada pembuka, tokoh utama punya pilihan kunci dan kontribusi tak tergantikan, kepemilikan imbal hasil jelas | Boleh ditulis, teruskan dengan membuat pertukaran dan imbal hasil terlihat |
  | Perlu penguatan | Mungkin mengencerkan momen puncak atau melaju terlalu cepat, tetapi bisa diperbaiki dengan persiapan, pertukaran, biaya, atau pernyataan genre | Sebelum menulis, tambahkan alasan, harga, atau batas tahap |
  | Kontrak rusak | Daya tarik inti dirampas, kendali atau hak kausalitas tokoh utama menurun, tokoh tak relevan merampas ekspektasi, aset inti diserahkan tanpa pertukaran | Wajib memperbaiki kerangka |

  Merelakan sorotan secara sukarela tidak otomatis berarti kontrak rusak. Baru layak dinilai merah kalau imbal hasil neto jangka panjang negatif dan kendali atau hak kausalitas tokoh utama menurun, terutama bila tidak ada pertukaran strategis yang terlihat. Genre potret kolektif, mentor, dan kerja sama kelembagaan boleh menyelesaikan momen puncak menurut kontraknya masing-masing kalau pembuka sudah menjanjikannya.

  ## 7. Contoh baik dan buruk serta risiko sambungan

  - Pemberian mandat yang baik: tokoh utama menguasai rencana, sumber daya kunci, negosiasi, dan risiko, sementara tokoh pendukung mengeksekusi sebagian aksi dan membuktikan kemampuan tokoh utama dalam menilai orang atau mengorganisasi.
  - Penyerahan yang buruk: tokoh utama menyerahkan teknologi eksklusif, anugerah emas, atau bukti kunci tanpa syarat, hanya ditukar ucapan terima kasih, lalu garis utama selanjutnya digerakkan oleh institusi.
  - Bantuan yang baik: tokoh pendukung boleh membantu atau menjadi saksi, sedangkan bukti kunci, penataan rencana, keputusan, putusan publik, atau serangan balik terakhir tetap dituntaskan tokoh utama.
  - Perampasan penyelesaian yang buruk: musuh yang menekan tokoh utama selama banyak bab diselesaikan oleh orang kuat yang sekadar lewat atau kecelakaan acak, sementara tokoh utama tidak punya pilihan, tindakan, perubahan pemahaman, atau perubahan sumber daya.
  - Laju banyak garis yang baik: satu kemenangan membawa beberapa imbal hasil dalam tahap yang sama, tetapi hanya membuka satu lapis kebenaran, memundurkan satu barisan musuh, dan tetap menyimpan kartu pamungkas babak akhir.
  - Utang ganti buku: saat memasukkan peta, institusi, kemampuan, musuh, atau misteri baru, persiapan yang diperlukan harus dibayar dan utang ekspektasi baru pun bertambah; unsur segar tidak boleh dipakai untuk melarikan diri dari janji lama.

  ## 8. Keluaran telaah

  - Janji inti kepada pembaca:
  - Emosi dan momen puncak yang harus diserahkan pada tahap ini:
  - Hak kausalitas tokoh utama:
  - Hak penyelesaian tokoh utama:
  - Empat pertanyaan di titik kunci:
  - Aset inti dan pertukaran yang terlihat:
  - Utang ekspektasi dan bunga yang sudah dibayar:
  - Risiko kartu pamungkas babak akhir dan tangga peningkatan:
  - Tingkat risiko: kontrak aman / perlu penguatan / kontrak rusak
  - Arah perbaikan minimum:

  ## 9. Pohon keputusan kontrak pembaca

  1. Tuliskan janji pembuka: genre, jati diri tokoh utama, kemampuan inti, hubungan utama, emosi inti, imbalan pembacaan, dan sudut pandang penceritaan.
  2. Tuliskan janji tahap ini: serangan balik, peningkatan, kebenaran, perubahan hubungan, hasil kelembagaan, atau penuntasan emosi mana yang sedang ditunggu pembaca.
  3. Tandai pemegang hak kausalitas, hak memilih, penanggung konsekuensi, dan penerima penyelesaian imbal hasil di setiap titik kunci.
  4. Kalau tokoh utama tidak bertindak sendiri, periksa apakah ia memegang rencana, mandat, sumber daya kunci, informasi tak tergantikan, atau penanggungan risiko; kalau ya, jangan otomatis dinilai beracun.
  5. Kalau tokoh pendukung mendapat momen puncak, periksa apakah hal itu sudah dijanjikan lebih dulu di pembuka atau di tahap ini, dan apakah imbal hasil neto jangka panjang, kendali, atau imbal hasil hubungan tokoh utama terlihat.
  6. Kalau aset diserahkan, catat pertukarannya berupa kekuasaan, perlindungan, sumber daya, jalur akses, status resmi, hak tagih, informasi, kemenangan tahap, atau inisiatif masa depan; tanpa pertukaran, itu risiko kontrak.
  7. Kalau penuntasan ditunda, tuliskan bunga yang sudah dibayar: kemajuan tahap, informasi baru, perubahan situasi, pelepasan emosi, atau tujuan baru yang jernih.
  8. Periksa apakah musuh bebuyutan, kebenaran terakhir, titik akhir jati diri, batas atas anugerah emas, atau kepastian hubungan terakhir sudah terbakar; kalau sudah, batas tahapnya wajib ditata ulang.

  ## 10. Perbandingan khas

  | Situasi | Penilaian |
  |---|---|
  | Tokoh utama menguasai rencana dan sumber daya kunci, tokoh pendukung mengeksekusi sebagian aksi | Aman, tokoh utama tetap punya hak kausalitas |
  | Tokoh utama menyerahkan teknologi eksklusif tanpa syarat, hanya ditukar ucapan terima kasih, institusi mengambil alih garis utama | Rusak, aset inti tanpa pertukaran |
  | Tokoh pendukung membantu dan menjadi saksi, bukti kunci, penataan rencana, dan serangan balik terakhir milik tokoh utama | Aman, membantu tidak sama dengan merampas penyelesaian |
  | Musuh yang menekan tokoh utama selama banyak bab diselesaikan orang kuat yang lewat atau kecelakaan | Rusak, tokoh utama tidak punya pilihan dan penyelesaian |
  | Satu kemenangan sekaligus memberi beberapa imbal hasil dalam tahap yang sama, hanya membuka satu lapis kebenaran | Umumnya aman, banyak garis naik tetapi tidak melampaui tahap |
  | Memasukkan peta dan musuh baru untuk melarikan diri dari janji lama | Berisiko, perlu menambah persiapan dan membayar utang ekspektasi |
