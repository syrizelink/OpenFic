summary: Menelaah bab, potongan, rencana alur cerita, atau latar cerita yang diberikan pengguna berdasarkan Rubric lengkap dan daftar pemeriksaan, lalu mengeluarkan PASS/WARN/FAIL, Findings S1-S4, ambang penerbitan, dan arah perbaikan yang dapat dijalankan.
is_enabled: true
content: |
  # Rubric Telaah Konten Novel Daring Umum dan Daftar Pemeriksaan Lengkap

  Dipakai untuk menelaah teks cerita, bab, potongan, rencana alur cerita, atau latar yang diberikan pengguna pada sesi berjalan. Objek penilaiannya adalah kualitas teks cerita, bukan kualitas penerapan Skill atau pengaya. Keluarkan hanya masalah yang didukung bukti dari teks asli atau materi pengguna; hal yang buktinya tidak memadai dimasukkan ke "bukti tidak memadai" dan tidak boleh dianggap finding. Telaah bukan penulisan ulang, dan kecuali pengguna meminta secara tegas, jangan langsung menulis ulang isi utama untuk pengguna.

  ## Satu, Alur Telaah

  1. Pastikan lingkupnya: bab, potongan, rencana alur cerita, atau latar; serta apakah sasarannya efek cerita, kesinambungan, tokoh, olah kata, format, kontrak pembaca, atau kesesuaian platform.
  2. Baca keseluruhannya lebih dahulu, lalu periksa menurut daya jual inti, laju konflik, titik hambat tugas, kurva emosi, pengait, motif tokoh, dialog, latar, sebab-akibat, format, hubungan, dan petunjuk awal.
  3. Periksa dengan saksama siklus alur cerita terkecil: tujuan -> penghalang -> tindakan -> umpan balik/harga yang dibayar -> harapan baru.
  4. Periksa apakah puncaknya menuntaskan penimbunan tenaga, kemenangan palsu atau penambahan tekanan, keruntuhan, dan titik balik/penuntasan; kekurangan berupa penyajian datar dan langsung, tanpa harga yang dibayar, atau tanpa titik pendaratan emosi harus ditandai.
  5. Setiap finding wajib memuat `severity`, `category`, `location`, `evidence`, `issue`, `fix`; daftarkan S1/S2 lebih dahulu, lalu S3/S4.
  6. Saran wajib konkret sampai ke peristiwa, urutan, pilihan tokoh, penyajian informasi, atau fungsi kalimat, jangan menulis basa-basi kosong seperti "diperkuat" atau "dibuat lebih wajar".
  7. Untuk masalah fakta atau keselarasan, fix hanya berisi penyeragaman fakta, garis waktu, atribut tokoh, atau arah sebab-akibat, jangan memanfaatkan kesempatan itu untuk mengajukan saran penulisan sastra yang tidak berkaitan.
  8. Jika lingkungan saat ini menyediakan skrip atau alat pemeriksaan yang dapat dijalankan, itu boleh dipakai; jika tidak tersedia, beralih ke pemeriksaan manual mengikuti daftar ini, jangan melewatkan pemeriksaan hanya karena alatnya tidak tersedia, dan jangan pula melaporkan hasil skrip secara palsu.

  ## Dua, Rubric PASS / WARN / FAIL

  Tandai setiap butir dengan PASS/WARN/FAIL, lalu ubah WARN/FAIL menjadi Findings Schema: yang berdampak pada alur utama, motif tokoh, aturan dunia, atau kepercayaan pembaca adalah S1; yang jelas memengaruhi retensi, ritme, efek bab, atau kredibilitas tokoh adalah S2; masalah kualitas setempat, format, pilihan kata, atau ritme ringan adalah S3; saran gaya atau penguatan opsional adalah S4.

  | Dimensi | PASS | WARN | FAIL |
  |---|---|---|---|
  | Daya jual inti | Bab bergerak di sekeliling daya jual yang jelas, pembaca tahu mengapa harus terus membaca | Daya jualnya ada tetapi diungkapkan lemah atau diencerkan oleh alur sampingan | Tidak terlihat bab ini melayani daya jual atau alur utama yang mana |
  | Laju konflik | Ada konflik, penghalang, pilihan, atau harga yang dibayar yang jelas | Konfliknya cukup ringan, rasa lajunya kurang | Sebagian besar berupa penjelasan, obrolan santai, dan rangkuman, tanpa laju yang nyata |
  | Titik hambat tugas | Tokoh tersendat saat mengurus sesuatu, dan hambatan itu memunculkan perubahan informasi, hubungan, harga yang dibayar, pilihan, atau petunjuk awal | Ada titik hambat tetapi perubahannya condong lemah dan dapat dipadatkan | Titik hambatnya hanya detail prosedur, dihapus pun tidak memengaruhi cerita |
  | Kurva emosi | Ada pelandasan, penghangatan, pelepasan, atau titik balik | Emosinya berubah tetapi simpulnya tidak jelas | Emosinya datar atau berbelok secara mendadak |
  | Pengait dan harapan | Bagian awal atau akhir membangun sedikitnya satu harapan | Pengaitnya lemah tetapi masih ada pertanyaan lanjutan | Tidak ada misteri, tujuan, atau harapan yang belum tuntas |
  | Motif tokoh | Perilakunya sesuai dengan tujuan, watak, keadaan, dan tekanan hubungan | Sebagian perilaku kurang landasan | Tokoh menjadi tidak jujur pada dirinya demi mendorong alur cerita |
  | Kualitas dialog | Ada makna tersirat, pengendalian informasi, dan pembeda antartokoh | Ada penumpukan informasi atau suara antartokoh sedikit seragam | Terasa seperti buku petunjuk, semua orang bernada sama |
  | Keselarasan latar | Tidak melanggar aturan, garis waktu, dan atribut yang sudah ada | Ada titik kabur ringan yang perlu ditambahi bukti | Bertabrakan dengan latar yang telah ditulis atau fakta bagian sebelumnya |
  | Kewajaran olah kata | Konkret, terasa, dan tindakan mengangkut informasi | Kadang muncul kalimat basi atau rangkuman abstrak | Nada AI, ungkapan klise, dan gaya merangkum terlihat jelas |
  | Keterbacaan format | Terpotong secara wajar mengikuti unit dramatik/bidikan kamera, dialog berdiri sendiri, tanpa baris kosong berlebih, ritme subjek terasa wajar | Sebagian terlalu panjang, terlalu terserak, atau subjeknya berulang | Bertumpuk dalam blok panjang, terpotong secara mekanis, dialog/penuturan sukar dibaca |
  | Siklus alur cerita | Tujuan -> penghalang -> tindakan -> harga yang dibayar/umpan balik -> harapan baru tertutup dengan jelas | Siklusnya ada tetapi satu mata rantai hilang atau umpan baliknya condong lemah | Tanpa tujuan, tanpa penghalang, atau tanpa umpan balik, keadaan tidak berubah |
  | Pembangunan puncak | Penimbunan tenaga -> kemenangan palsu -> keruntuhan -> titik balik/penuntasan tersusun berlapis | Ada titik ledak tetapi penimbunan tenaga atau penuntasannya kurang | Datar dan langsung, tanpa harga yang dibayar, tanpa penuntasan, atau emosinya jatuh sia-sia |
  | Kemajuan hubungan | Skala interaksi sesuai dengan tahap hubungan, pelampauan batas berlandasan | Sebagian lajunya sedikit terlalu cepat tetapi masih bisa ditambahi bukti | Keintiman, kepercayaan, atau permusuhan muncul mendadak, hubungannya melompat |
  | Status petunjuk awal | Penanaman, status, dan jalur penuntasannya dapat dilacak | Petunjuk awal condong terlalu rapat atau terlalu jarang tetapi tidak mengganggu pemahaman | Bertabrakan dengan latar, terputus, atau menimbulkan kekacauan pada alur utama |

  ## Tiga, S1-S4, Findings Schema, dan Ambang Penerbitan

  ### Tingkat keparahan

  | Tingkat keparahan | Definisi | Dampak khas |
  |---|---|---|
  | S1 | Merusak alur utama, motif tokoh, aturan dunia, atau kepercayaan pembaca | Sebab-akibat inti runtuh, pilihan inti dirampas dari tokoh utama, latar bertabrakan |
  | S2 | Jelas memengaruhi retensi, ritme, efek bab, atau kredibilitas tokoh | Tidak ada laju di dalam bab, puncak tanpa penuntasan, pengait tidak berfungsi, motif tanpa landasan |
  | S3 | Masalah kualitas setempat, format, pilihan kata, ritme ringan, atau penataan informasi | Masalah pola kalimat, paragraf, dan urutan informasi yang dapat ditunjuk letaknya |
  | S4 | Butir preferensi atau penyetelan gaya yang boleh diubah maupun tidak | Penguatan opsional, tidak boleh menghambat penerbitan |

  ### Findings Schema

  ```yaml
  severity: S1 | S2 | S3 | S4
  category: struktur | tokoh | olah kata | latar | sebab-akibat | format | hubungan | kontrak pembaca | petunjuk awal
  location: posisi pada teks asli, bab, paragraf, atau kalimat
  evidence: kutipan pendek dari teks asli atau fakta materi yang tegas sebagai penopang penilaian
  issue: uraian konkret tentang apa yang terjadi dan akibat baca apa yang ditimbulkannya
  fix: penyesuaian konkret dan dapat dijalankan atas peristiwa, urutan, pilihan tokoh, penyajian informasi, atau fungsi kalimat
  ```

  Findings wajib diurutkan menurut S1, S2, S3, S4; penilaian tanpa bukti tidak masuk ke Findings. Untuk masalah golongan `consistency`/`factual`, fix hanya berisi "menyeragamkan fakta, atribut, garis waktu, atau sebab-akibat", bukan saran sastra yang serba umum.

  | Keadaan menyeluruh | Verdict |
  |---|---|
  | Tanpa S1/S2, dan S3 dapat ditangani cepat | APPROVE |
  | Ada S2, atau jumlah S3 banyak dan mengganggu pembacaan | CONCERNS |
  | Ada S1, atau daya jual inti, motif, dan aturan runtuh | REJECT |

  ### Tiga pertanyaan emas

  1. Mengapa pembaca membuka halaman berikutnya? Jika tidak terjawab, sedikitnya S2.
  2. Apa yang diubah bab ini? Sedikitnya satu di antara alur cerita, tujuan, risiko, informasi, hubungan, sumber daya, identitas, atau sikap emosional harus berubah; jika tidak terjawab, sedikitnya S2.
  3. Bukti mana yang menopang penilaian? Finding tanpa bukti dari teks asli tidak dikeluarkan, dan diubah menjadi "bukti tidak memadai".

  ## Empat, Daftar Pemeriksaan Umum

  ### Struktur bab

  - [ ] Bagian awal memiliki pengait, bukan pembuka berisi cuaca, pemandangan, atau kegiatan sehari-hari tanpa fungsi.
  - [ ] Bagian tengah memiliki laju; genre berirama cepat memiliki peristiwa yang terlihat, sementara genre yang menghangat perlahan cukup memiliki perubahan keadaan yang terlihat.
  - [ ] Keadaan berubah, dan setelah selesai dibaca, dunia, hubungan, informasi, atau risikonya berbeda.
  - [ ] Bagian akhir mendarat pada perubahan, bukan pada rangkuman.

  ### Pemeriksaan pembuka: 300-500 kata pertama

  - [ ] Ada pengait yang mampu merebut perhatian.
  - [ ] Tidak dimulai dari cuaca, pemandangan, atau kegiatan sehari-hari, kecuali kegiatan sehari-hari itu sendiri merupakan daya jual atau hal yang menyimpang.
  - [ ] Tokoh utama tampil dengan cepat, atau konflik perwakilan yang jelas dengan cepat membangun masalah tokoh utama.
  - [ ] Daya jual atau krisisnya terlihat.

  ### Laju bab

  - [ ] Bab ini sedikitnya mengubah satu di antara tujuan, risiko, informasi, hubungan, sumber daya, identitas, dan sikap emosional.
  - [ ] Cerita berirama cepat/cerita kepuasan memiliki peristiwa atau titik kepuasan yang terlihat; cerita yang menghangat perlahan/cerita perasaan boleh memenuhi syarat dengan perubahan kecil bertekanan rendah, tanpa memaksakan puncak pada setiap bab.
  - [ ] Bukan penggelembungan jumlah kata: jika bab ini dihapus, perubahan keadaan mana yang hilang? Jika tidak terjawab, baru perlu dipadatkan.
  - [ ] Titik hambat tugas berguna: setelah tersendat, ia membawa perubahan tujuan, risiko, informasi, hubungan, sumber daya, identitas, atau emosi.
  - [ ] Kuat lemahnya laju sesuai dengan genre, ritme penuntasan, dan pembanding yang sudah ditetapkan buku ini, jangan menerapkan patokan jumlah kata umum yang kaku.

  ### Penyampaian informasi

  - [ ] Tidak ada blok panjang teks penjelasan latar.
  - [ ] Informasi mengikuti konflik, dan latar disampaikan melalui peristiwa, pilihan, akibat, atau dialog.
  - [ ] Satu bab umumnya tidak lebih dari 3 konsep baru; jika melebihi, periksa apakah ada pencernaan, contoh, dan jangkar konflik.

  ### Pemeriksaan adegan

  - [ ] Adegan memiliki tujuan: apa yang diinginkan tokoh.
  - [ ] Adegan memiliki penghalang: apa yang menghadang tokoh.
  - [ ] Adegan memiliki perubahan: setelah berakhir berbeda dari saat dimulai.
  - [ ] Tokoh sedang mengerjakan sesuatu, bukan hanya merasakan sesuatu.
  - [ ] Tidak ada paragraf yang dapat dihapus tanpa memengaruhi tujuan, konflik, informasi, hubungan, atau emosi.

  ### Akhir bab

  - [ ] Bagian akhir mendarat pada perubahan.
  - [ ] Sedikitnya ada satu di antara krisis, keputusan, penemuan, dan titik balik.
  - [ ] Bukan akhir bergaya rangkuman.
  - [ ] Menahan pembaca agar membuka halaman berikutnya; bab bertekanan rendah boleh memakai tujuan tahap atau pengait kecil, tanpa memaksakan misteri yang kuat.

  ### Bahasa dan format

  - [ ] Tidak ada paragraf ungkapan perasaan yang kosong.
  - [ ] Tidak ada beberapa paragraf berurutan dengan emosi yang sama tanpa perubahan.
  - [ ] Dialog sesuai dengan identitas tokoh, dan cara bicara tokoh yang berbeda tidak sama.
  - [ ] Ritme tanda baca sesuai dengan nada dan suara tokoh, tidak seluruh teks berakhir dengan titik, dan tidak pula menumpuk tanda tanya/tanda seru secara acak.
  - [ ] Isi utama tidak menyisakan elipsis atau tanda pisah yang tidak diperlukan; keraguan dan pemotongan bicara sudah diangkut oleh tindakan, kalimat pendek, koma, atau titik.
  - [ ] Emosi mendarat melalui tindakan, pilihan, dan akibat, tidak langsung menulis "dia sangat sedih" sebagai satu-satunya bukti.
  - [ ] Di luar baris judul tidak ada meta-informasi bab/penulisan: tidak boleh muncul kata meta seperti "Bab X", "bab sebelumnya", "bab ini", "bagian sebelumnya", "bagian selanjutnya", "petunjuk awal", "kerangka rinci", atau "pembaca", kecuali konsep itu memang sedang dibicarakan di dalam cerita.

  ### Kesinambungan serial

  - [ ] Tidak melupakan janji atau petunjuk awal sebelumnya.
  - [ ] Tidak menyisipkan latar baru dalam jumlah besar secara mendadak.
  - [ ] Petunjuk awal memiliki jalur pengembangan, pembuktian, penyesatan, atau penuntasan.
  - [ ] Mesin cerita masih berjalan.

  ### Deteksi teks bertele-tele

  - [ ] Dialog sepanjang bab memuat informasi baru, pilihan, perubahan hubungan, atau akibat emosi.
  - [ ] Emosi yang sama tidak diulang lebih dari 3 paragraf berurutan hanya dengan mengganti cara pengucapan.
  - [ ] Ketika penggambaran adegan melebihi 500 kata, ia tetap mendorong alur cerita, informasi, hubungan, atau sasaran suasana.
  - [ ] Mengenang peristiwa lama membawa sudut pandang, bukti, atau perubahan pemahaman yang baru.
  - [ ] Ketika 2 bab berurutan atau lebih tanpa konflik, pastikan apakah itu bab jeda bernapas yang berfungsi; garis merahnya adalah dua bab berurutan dengan tingkat tekanan <=1 atau emosi bab berdampingan yang menyeragam.
  - [ ] Menghapus detail prosedur atau titik hambat tugas akan menghilangkan perubahan keadaan; jika tidak, padatkan atau hapus.

  ## Lima, Bagian Khusus Cerita Panjang

  ### Pemeriksaan tiga bab emas

  - [ ] 500 kata pertama bab pertama memiliki pengait.
  - [ ] Tokoh utama tampil di bab pertama, atau konflik perwakilan inti langsung mengarah kepada tokoh utama.
  - [ ] Bab pertama memiliki peristiwa, bukan pelandasan belaka.
  - [ ] Bab kedua memiliki peningkatan, pertentangan makin dalam atau harga yang dibayar makin besar.
  - [ ] Bab ketiga memberikan alasan untuk terus mengikuti bacaan.
  - [ ] Tiga bab pertama memuat sedikitnya 2 titik kepuasan atau sentuhan emosi yang dapat dikenali.
  - [ ] Latar dunia tidak disampaikan dalam blok panjang teks penjelasan.
  - [ ] Akhir setiap bab memiliki alasan untuk membaca lebih jauh; bab bertekanan rendah/bab peralihan boleh berupa pengait lemah atau tujuan tahap.

  ### Pemeriksaan ritme

  - [ ] 5 bab terakhir memiliki kemajuan yang jelas.
  - [ ] Jarak antartitik kepuasan pada bab bertekanan tinggi/bab pendorong tidak melebihi sekitar 5000 kata; bab bertekanan rendah, bab hubungan, atau bab penataan informasi dinilai terpisah.
  - [ ] Tidak ada 2 bab berurutan atau lebih tanpa konflik; bab jeda bernapas itu wajar, tetapi dua bab berurutan dengan tingkat tekanan <=1 atau emosi yang menyeragam perlu ditandai.
  - [ ] Satu volume memiliki lapisan tinggi rendah pada penempatan babnya, tidak berkekuatan sama sepanjang jalan.
  - [ ] Bab bertekanan rendah dan bab peralihan secara keseluruhan ditahan, acuannya tidak lebih dari sekitar 15%, dan pastikan setiap bab masih memiliki perubahan kecil.

  ### Pemeriksaan tokoh

  - [ ] Perilaku tokoh utama sesuai dengan karakterisasi, tujuan, dan keadaan yang telah ditetapkan.
  - [ ] Tokoh pendukung memiliki fungsi, pilihan, atau emosi yang mandiri, bukan sekadar tokoh alat.
  - [ ] Wibawa tokoh antagonis sepadan dengan tahap saat ini, dan kemampuan maupun kegagalannya memiliki sebab-akibat.

  ### Penilaian lima dimensi

  Setiap butir bernilai 0-100, dan tuliskan bukti beserta strategi penghalusan, jangan menulis "bagus sekali/biasa saja":

  1. Tingkat keselarasan inti: konflik kunci, tindakan kunci, dan motif tokoh selaras dari awal ke akhir.
  2. Tingkat penulisan ulang permukaan: pola kalimat dan pilihan kata cukup orisinal, hindari ungkapan yang terformula.
  3. Tingkat keselarasan format: unit dramatik, bidikan kamera, subjek, nama tokoh, dialog, dan format bab tersatukan secara wajar.
  4. Keterbacaan: apakah pertele-telean, nada AI, rangkuman kosong, retorika berformula, tumpukan kiasan, dan penjelasan batin berlebihan.
  5. Kesinambungan logika: apakah kalimat dan paragraf, latar, garis waktu, atribut tokoh, dan rantai sebab-akibat selaras.

  #### Tabel masalah dan perbaikan lima dimensi

  | Dimensi | Masalah | Acuan tingkat keparahan | Arah perbaikan |
  |---|---|---|---|
  | Tingkat keselarasan inti | Motif berubah mendadak tanpa landasan | S1/S2 | Tambahkan peristiwa pemicu atau seragamkan tindakan dengan motif |
  | Tingkat keselarasan inti | Konflik inti tidak selaras dari awal ke akhir | S1 | Telusuri balik dan seragamkan latar konfliknya |
  | Tingkat keselarasan inti | Tindakan kunci bertentangan dengan watak | S2 | Sesuaikan tindakannya atau tambahkan dasar pilihan yang terlihat |
  | Tingkat keselarasan inti | Pertentangan sekunder terlupakan | S3 | Tuntaskan atau perlemahkan secara tegas |
  | Tingkat penulisan ulang permukaan | Menyalin kalimat asli sehingga nadanya tidak wajar | S3 | Tulis ulang hanya jika memang bermasalah, kalimat asli yang wajar jangan diubah |
  | Tingkat penulisan ulang permukaan | Banyak kata penanda AI | S2/S3 | Ganti dengan tindakan, benda, suara, dan akibat yang konkret |
  | Tingkat penulisan ulang permukaan | Pola kalimat yang sama berulang | S3 | Ubah cara pengungkapannya, pertahankan fungsi informasinya |
  | Tingkat penulisan ulang permukaan | Penggambaran terlalu bergaya sastra | S3 | Ubah menjadi bergaya percakapan atau berbasis tindakan |
  | Tingkat keselarasan format | Paragraf dipotong mekanis menurut jumlah kata, subjek terlalu rapat | S3 | Tata ulang menurut unit dramatik, sebut nama di awal paragraf, gunakan kata ganti/pelesapan di tengah, sebut nama lagi saat berbalik arah |
  | Tingkat keselarasan format | Jumlah kata bab menyimpang dari sasaran | S2 | Saat menulis/menyusun kerangka, kembali ke kerangka rinci untuk menambah titik alur cerita; pada isi utama yang sudah ada, penghilangan nuansa AI tidak boleh menambah alur cerita baru |
  | Tingkat keselarasan format | Format dialog/penggambaran kacau | S3 | Seragamkan formatnya |
  | Keterbacaan | Rangkuman kosong | S3 | Hapus, gantikan dengan tindakan atau akibat |
  | Keterbacaan | Kiasan berformula | S3 | Hapus atau ganti dengan penggambaran konkret |
  | Keterbacaan | Tumpukan kiasan | S3 | Sisakan sedikit kiasan yang berfungsi menuturkan, sisanya ubah menjadi tindakan, benda, suara, atau akibat |
  | Keterbacaan | Label emosi | S3 | Ubah menjadi perwujudan perilaku |
  | Keterbacaan | Monolog batin lebih dari 3 kalimat berurutan | S3 | Padatkan menjadi 1 kalimat atau alihkan menjadi dialog/tindakan |
  | Kesinambungan logika | Latar bertentangan dari awal ke akhir | S1 | Cari dan seragamkan latarnya |
  | Kesinambungan logika | Garis waktu salah | S1/S2 | Tandai garis waktunya dan perbaiki |
  | Kesinambungan logika | Informasi tokoh tidak selaras | S2 | Bangun berkas tokoh sebagai pembanding lalu seragamkan |
  | Kesinambungan logika | Rantai sebab-akibat terputus | S2/S3 | Tambahkan peristiwa, pilihan, atau bukti peralihan |

  Strategi penghalusan: tingkat keselarasan inti yang rendah memakai `rewrite`; masalah jumlah kata atau titik hambat tanpa makna memakai `compress`; nada AI yang berat memakai `de_ai`; masalah setempat yang banyak memakai `polish`. Strategi wajib ditopang bukti dari Findings.

  ## Enam, Telaah Dua Arah Kontrak Pembaca dan Cadangan Babak Akhir

  Saat menelaah, tanyakan lebih dahulu "apakah tidak beracun", lalu "apakah menarik". Tidak adanya pelanggaran kontrak tidak berarti penuntasan emosinya memadai. Risiko dibagi menjadi kontrak aman, perlu diperkuat, dan kontrak dilanggar:

  - [ ] Bab/volume ini menuntaskan janji pembuka, dan tidak menyerahkan daya jual inti kepada lembaga, tokoh pendukung, atau kebetulan.
  - [ ] Hak keagenan tokoh utama ditelaah menurut hak sebab-akibat + hak penyelesaian, bukan menurut lamanya kemunculan: siapa yang menentukan mengapa sesuatu terjadi, siapa yang mengambil pilihan yang tak tergantikan, siapa yang menanggung atau memilih akibat kunci, dan kepada siapa manfaat/pengakuan/kekuasaan inti diselesaikan.
  - [ ] Tokoh pendukung boleh menjalankan tindakan setempat, tetapi tidak boleh merampas kepemilikan harapan tanpa suara.
  - [ ] Utang harapan dilunasi, atau ditunda dengan pembayaran bunga, dan tidak tertelan oleh penjelasan, prosedur, atau latar.
  - [ ] Unit ini tidak memakai lebih awal musuh bebuyutan, kebenaran, identitas, atau batas atas kekuatan istimewa yang seharusnya belum terbuka pada tahap ini.
  - [ ] Tidak membiarkan alur peningkatan mendekati langit-langitnya sehingga tidak ada undakan lanjutan sesudahnya.
  - [ ] Setelah puncak/penuntasan, tekanan rendah singkat dan perolehan kecil yang terlihat diizinkan, tanpa menambahkan krisis baru secara mekanis dan seketika.
  - [ ] Unsur baru membayar utang penggantian buku, dan tidak melarikan diri dari janji lama.
  - [ ] Pada cerita kepuasan pemenuhan janji/fantasi kemampuan, tokoh utama tidak berulang kali menciptakan bencana melalui kebodohan yang dapat dihindari lalu dibereskan orang lain.
  - [ ] Penyerahan secara sukarela hanya menyalakan lampu merah ketika "keuntungan bersih jangka panjang negatif + hak kendali/sebab-akibat menurun" muncul bersamaan; pengalahan strategis seharusnya menunjukkan kendali yang lebih besar, keuntungan masa depan, kekuasaan, atau pertukaran informasi.
  - [ ] Jika setelah penjelasan yang aman dihapus emosinya justru lebih kuat, utamakan mempertahankan peristiwa dan hasilnya; alur cerita berisiko yang dipertahankan harus membawa harapan, harga yang dibayar, atau titik kepuasan yang lebih kuat.
  - [ ] Kontrak, hak keagenan, utang harapan, dan cadangan babak akhir saling menopang, bukan hanya sampai pada tahap "tidak beracun".

  ## Tujuh, Bagian Khusus Cerita Pendek

  ### Ritme penyiksaan dan kepuasan

  Sebaran ideal: `siksa1 -> siksa2 -> siksa3 -> puas1 (kecil) -> siksa4 -> puas2 (besar)`.

  Sebaran terlarang: penyiksaan berurutan tanpa titik kepuasan menyebabkan pembaca berguguran; kepuasan berurutan tanpa pelandasan menyebabkan kelelahan rasa puas. Periksa bahwa setiap 300 kata memuat sedikitnya satu konflik kecil, jarak antartitik penyiksaan tidak melebihi 30% seluruh teks, titik kepuasan terbesar berada pada 70%-85% seluruh teks, dan bagian akhir wajib memiliki titik pendaratan emosi.

  ### Kerapatan dialog

  | Indikator | Standar lulus | Garis waspada |
  |---|---|---|
  | Proporsi dialog terhadap seluruh teks | 45%-65% | <30% terlalu kering, >75% terlalu bertele-tele |
  | Jumlah baris dialog | 12-18 baris/seribu kata | <8 baris kurang interaksi, >25 baris jadi terserak |
  | Dialog yang melukai | Cerita penyiksaan 35%-45%, cerita kepuasan 20%-30% | Cerita penyiksaan <20% kurang menyakitkan, cerita kepuasan >40% terlalu menekan |

  ### Tingkat ketenangan tokoh utama pada cerita tamparan balik/balas dendam

  - [ ] Tokoh utama memiliki tindakan ketenangan yang menjadi cirinya, misalnya menggenggam cangkir air, merapikan pakaian, memutar pena; ini wajib berupa tindakan yang terlihat di dalam teks, jangan menuntutnya tanpa dasar.
  - [ ] Pada cerita balas dendam, tokoh utama kehilangan kendali emosi paling banyak 1 kali dan berada di 30% bagian awal, kecuali teks telah membangun kontrak lain.
  - [ ] Tokoh antagonis lebih histeris daripada tokoh utama, dan kontras itu melayani rasa puas.
  - [ ] Dialog tokoh utama rata-rata sekitar 30%-50% lebih pendek daripada tokoh antagonis, karena kependekan adalah efek kekuatan, bukan aturan kaku.
  - [ ] Sedikitnya 2 tempat berisi dialog bergaya pengadilan: tokoh utama mengajukan pertanyaan, pihak lain membongkar dirinya sendiri; jika tidak ada, tandai sebagai bukti tidak memadai atau sebagai kekurangan yang bersangkutan.

  ### Rantai bukti pada cerita balas dendam/tamparan balik

  - [ ] Bukti diungkap sedikitnya dalam 3 tahap, tidak boleh diberikan sekaligus.
  - [ ] Setiap bukti memiliki landasan pada bagian sebelumnya.
  - [ ] Tokoh antagonis berbangga diri lebih dahulu lalu ditampar balik, membentuk pola diangkat dahulu lalu ditekan.
  - [ ] Bukti terakhir paling mematikan dan mengubah pemahaman atas keseluruhan keadaan.
  - [ ] Sedikitnya ada 1 bukti "bom waktu" yang disiapkan tokoh utama lebih dahulu; jika genrenya tidak sesuai, tandai sebagai tidak berlaku daripada memaksakannya.

  ### Rujukan cepat titik beracun, keterlibatan, keterkejutan, pembuka, penutup, dan harapan pada cerita pendek

  | Butir pemeriksaan | Standar |
  |---|---|
  | Cerita kepuasan tidak memuaskan | Efek kekuatan istimewa atau pameran kemampuan tokoh utama jelas |
  | Penekanan tanpa tujuan | Setiap penekanan melayani ledakan sesudahnya |
  | Akhir tokoh antagonis tak berkaitan dengan tokoh utama | Akhir tokoh antagonis harus disebabkan tindakan atau pilihan tokoh utama, kecuali kontrak teks jelas merancangnya lain |
  | Ekonomi/kekuatan tempur runtuh | Latarnya selaras dari awal ke akhir, berjangkar pada orang biasa atau tolok ukur yang sudah ditetapkan |
  | Tokoh utama/pendukung perempuan dibuat bodoh | Karakterisasi yang wajar boleh ditulis, hindari memaksakan penurunan kecerdasan demi formula |
  | Harapan lama tidak terpenuhi | Penuhi pada waktu yang tepat atau masukkan harapan baru yang berharga |
  | Perilaku tokoh utama tak dapat dipahami | Tambahkan peristiwa, informasi, atau dasar pilihan, pastikan dapat dipahami dan menimbulkan resonansi |
  | Suasana rusak oleh lelucon yang mendadak | Suasana lebih diutamakan daripada lelucon mendadak, kecuali cerita bergenre hiburan ringan |
  | Pengait tidak dituntaskan | Tandai sebagai ruang kosong yang disengaja atau kelalaian, karena bisa menjadi risiko akhir cerita yang buruk |
  | Pelapisan keterkejutan | Titik -> jaring -> kedalaman, tidak boleh hanya menulis keterkejutan satu titik |
  | Undakan keterkejutan | Menanjak bertahap, bukan tumpukan garis lurus |
  | Keluasan keterkejutan | Jaringan hubungan memberi reaksi yang sepadan, bukan hanya tokoh utama yang mengetahuinya sendiri |
  | 50 kata pertama | Ada konflik atau kejanggalan, tidak boleh hanya pelandasan latar belakang |
  | 100 kata pertama | Pembaca mengetahui pertentangan intinya |
  | Intensitas emosi pembuka | Acuan >=7/10, dikoreksi menurut genre |
  | Penutup konkret | Tindakan, dialog, atau citra, dilarang merangkum/merenung |
  | Gema sisa penutup | Setelah pembaca beranjak, emosi atau pertanyaannya masih tertinggal |
  | Intensitas penutup | Penyiksaan >=8, kepuasan >=7, penyembuhan >=6 |
  | Pelepasan emosi yang setara | Sebanyak apa disiksa, sebanyak itu ditebus, dan akhir tokoh antagonis berkaitan dengan tindakan tokoh utama |
  | Pengelolaan harapan | Dua panjang satu pendek tanpa terputus, dan daya jual inti menembus seluruh cerita |

  ## Delapan, Templat Keluaran Akhir

  - Lingkup telaah:
  - Sasaran telaah dan penempatan genre:
  - Cara pemeriksaan: pemeriksaan otomatis tersedia / pemeriksaan manual (jelaskan butir yang tidak tersedia)
  - Status setiap dimensi: PASS / WARN / FAIL
  - Kesimpulan menyeluruh: APPROVE / CONCERNS / REJECT
  - Findings:
    - severity: S1 / S2 / S3 / S4
    - category: struktur / tokoh / olah kata / latar / sebab-akibat / format / hubungan / kontrak pembaca / petunjuk awal
    - location:
    - evidence:
    - issue:
    - fix:
  - Bukti tidak memadai:
  - Butir pemeriksaan yang tidak berlaku beserta alasannya:
  - Hasil bagian khusus cerita panjang/pendek:
  - Urutan prioritas perbaikan: S1 lebih dahulu, lalu S2, lalu S3 berimbal hasil tinggi, dan S4 paling akhir
references:
  - name: Standar Telaah Umum dan Penilaian Lima Dimensi
    content: |
      Tiga pertanyaan emas: mengapa pembaca membuka halaman berikutnya? Apa yang diubah bab ini? Bukti mana yang menopang penilaian? Jika dua pertanyaan pertama tidak terjawab, sedikitnya S2, dan jika pertanyaan ketiga tidak terjawab, ubah menjadi bukti tidak memadai.

      Bab sedikitnya mengubah satu di antara tujuan, risiko, informasi, hubungan, sumber daya, identitas, atau sikap emosional; genre berirama cepat seharusnya memiliki peristiwa yang terlihat, sementara genre yang menghangat perlahan boleh memakai perubahan bertekanan rendah. Jumlah latar terkendali, satu bab umumnya tidak lebih dari 3 konsep baru; informasi mengikuti konflik. Adegan wajib memiliki tujuan, penghalang, dan perubahan, dan tokoh sedang mengerjakan sesuatu bukan hanya merasakan. Bagian akhir mendarat pada perubahan, krisis, keputusan, penemuan, atau titik balik, bukan pada rangkuman.

      Tiga bab pertama cerita panjang seharusnya menuntaskan pengait, tokoh utama, peristiwa, peningkatan, dan alasan untuk terus mengikuti bacaan; bab bertekanan rendah boleh memakai pengait lemah berupa tujuan tahap. Jumlah kata bab, jarak antartitik kepuasan, dan tingkat tekanan dinilai menurut penempatan dan pembanding buku ini, jangan menerapkan patokan yang kaku. Pemeriksaan olah kata menyasar rangkuman kosong, kiasan berformula, tumpukan kiasan, label emosi, blok panjang batin, dan meta-informasi bab. Setiap finding diberi bukti, tingkat keparahan, dan arah perbaikan; finding latar atau fakta hanya diberi arah penyeragaman fakta.
  - name: Tingkat Keparahan dan Ambang Penerbitan
    content: |
      S1: akan merusak alur utama, motif tokoh, aturan dunia, atau kepercayaan pembaca.
      S2: jelas memengaruhi retensi, ritme, kredibilitas tokoh, atau penuntasan emosi.
      S3: masalah pilihan kata, format, ritme, atau penataan informasi yang bersifat setempat.
      S4: butir preferensi atau penyetelan gaya yang boleh diubah maupun tidak.

      APPROVE: tanpa S1/S2, dan S3 dapat ditangani cepat.
      CONCERNS: ada S2, atau jumlah S3 banyak dan mengganggu pembacaan.
      REJECT: ada S1, atau daya jual inti, motif, dan aturan runtuh.

      Findings Schema: setiap butir wajib memuat severity, category, location, evidence, issue, fix; daftarkan S1/S2 lebih dahulu, lalu S3/S4. Tanpa bukti, finding tidak dikeluarkan. Untuk golongan consistency/factual, fix hanya berisi arah penyeragaman fakta.
  - name: Daftar Pemeriksaan Kualitas Novel Daring
    content: |
      ### Pemeriksaan umum

      Struktur bab: bagian awal memiliki pengait; bagian tengah memiliki laju; keadaan berubah; bagian akhir mendarat pada perubahan.

      300-500 kata pertama pembuka: ada pengait; tidak dimulai dari cuaca/pemandangan/kegiatan sehari-hari; tokoh utama tampil cepat; daya jual atau krisis terlihat.

      Laju bab: sedikitnya mengubah satu di antara tujuan/risiko/informasi/hubungan/sumber daya/identitas/sikap emosional; bukan penggelembungan jumlah kata; titik hambat tugas membawa perubahan keadaan; lajunya sesuai dengan genre, ritme penuntasan, dan pembanding buku ini.

      Informasi: tidak ada blok panjang penjelasan latar; informasi mengikuti konflik; satu bab tidak lebih dari 3 konsep baru.

      Adegan: memiliki tujuan, penghalang, dan perubahan; tokoh sedang mengerjakan sesuatu; tidak ada paragraf yang dapat dihapus.

      Akhir bab: mendarat pada perubahan; memiliki sedikitnya satu di antara krisis/keputusan/penemuan/titik balik; bukan rangkuman; menahan pembaca ke halaman berikutnya.

      Bahasa: tidak ada ungkapan perasaan yang kosong; tidak ada emosi sama yang berurutan; dialog sesuai identitas dan memiliki pembeda suara; tanda baca sesuai nada; tindakan mengangkut emosi; di luar baris judul tidak ada meta-informasi bab/penulisan, kecuali memang konteks nyata di dalam cerita.

      Kesinambungan serial: tidak melupakan janji/petunjuk awal; tidak menyisipkan latar dalam jumlah besar secara mendadak; petunjuk awal berkembang; mesin cerita berjalan.

      Tanda teks bertele-tele: dialog sepanjang bab tanpa informasi baru; emosi yang sama ditulis lebih dari 3 paragraf; adegan melebihi 500 kata tanpa mendorong apa pun; kenangan tanpa sudut pandang baru; 2 bab berurutan tanpa konflik; prosedur yang dapat dihapus tanpa menghilangkan perubahan keadaan.

      ### Bagian khusus cerita panjang

      Tiga bab emas: 500 kata pertama bab pertama memiliki pengait; tokoh utama tampil di bab pertama; bab pertama memiliki peristiwa; bab kedua meningkat; bab ketiga memberi alasan untuk terus mengikuti; tiga bab pertama memuat sedikitnya 2 titik kepuasan atau sentuhan; tanpa blok panjang penjelasan; akhir setiap bab memiliki alasan untuk melanjutkan.

      Ritme: 5 bab terakhir memiliki kemajuan; jarak antartitik kepuasan pada bab bertekanan tinggi/bab pendorong tidak melebihi sekitar 5000 kata; tidak ada 2 bab berurutan tanpa konflik; satu volume memiliki lapisan tinggi rendah; bab bertekanan rendah dan bab peralihan secara keseluruhan ditahan, acuannya tidak lebih dari sekitar 15%.

      Tokoh: tokoh utama sesuai karakterisasinya; tokoh pendukung memiliki kehadiran; wibawa tokoh antagonis sepadan dengan tahapnya.

      Lima dimensi: tingkat keselarasan inti memeriksa konflik, tindakan, dan motif; tingkat penulisan ulang permukaan memeriksa pola kalimat, pilihan kata, dan kata penanda AI; tingkat keselarasan format memeriksa paragraf, subjek, dialog, serta bagian awal dan akhir; keterbacaan memeriksa pertele-telean, rangkuman, retorika berformula, tumpukan kiasan, label emosi, dan blok panjang batin; kesinambungan logika memeriksa latar, garis waktu, informasi tokoh, dan rantai sebab-akibat.

      Kontrak pembaca: apakah janji pembuka dituntaskan; apakah tokoh utama tetap memegang hak sebab-akibat dan hak penyelesaian; apakah utang harapan dilunasi atau ditunda dengan bunga; apakah kartu andalan babak akhir dipakai lebih awal; apakah kepemilikan manfaat dan pengakuan jelas; apakah pengalahan strategis menunjukkan kendali yang lebih besar, keuntungan masa depan, kekuasaan, atau pertukaran informasi; apakah tekanan rendah singkat dan perolehan kecil diizinkan setelah puncak; apakah emosinya lebih kuat setelah penjelasan yang aman dihapus.

      ### Bagian khusus cerita pendek

      Ritme ideal: siksa1 -> siksa2 -> siksa3 -> puas1 (kecil) -> siksa4 -> puas2 (besar). Yang terlarang adalah penyiksaan berurutan tanpa kepuasan atau kepuasan berurutan tanpa pelandasan. Setiap 300 kata sedikitnya 1 konflik kecil; jarak antartitik penyiksaan tidak melebihi 30% seluruh teks; titik kepuasan terbesar pada 70%-85%; bagian akhir memiliki titik pendaratan emosi.

      Proporsi dialog 45%-65%, dan 12-18 baris per seribu kata; dialog yang melukai pada cerita penyiksaan 35%-45%, pada cerita kepuasan 20%-30%. Pada cerita tamparan balik/balas dendam, periksa tindakan ketenangan, jumlah kehilangan kendali, kehisterisan tokoh antagonis, panjang dialog tokoh utama, dan sedikitnya 2 tempat dialog bergaya pengadilan. Bukti diungkap sedikitnya dalam 3 tahap, memiliki landasan, tokoh antagonis diangkat dahulu lalu ditekan, bukti terakhir mengubah pemahaman atas keseluruhan keadaan, dan sedapat mungkin ada 1 bukti yang disiapkan tokoh utama lebih dahulu.

      Rujukan cepat: efek kekuatan istimewa jelas; penekanan melayani ledakan; akhir tokoh antagonis berkaitan dengan tindakan tokoh utama; ekonomi/kekuatan tempur selaras; tokoh tidak dibuat bodoh demi formula; harapan dipenuhi atau ditingkatkan pada waktunya; perilaku tokoh utama dapat dipahami; suasana tidak dirusak lelucon mendadak; pengait dituntaskan; keterkejutan menanjak dari titik -> jaringan hubungan -> pemahaman mendalam; 50 kata pertama ada konflik/kejanggalan; 100 kata pertama pembaca mengetahui pertentangan inti; intensitas pembuka acuannya >=7; penutup konkret dan bergema; penutup penyiksaan >=8, kepuasan >=7, penyembuhan >=6; daya jual inti terus menembus seluruh cerita.
