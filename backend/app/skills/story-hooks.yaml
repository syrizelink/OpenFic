name: Pengait Cerita dan Desain Misteri
summary: Merancang pengait dan misteri pada tingkat paragraf, bab, maupun antar bab; mengendalikan kesenjangan informasi, rantai ekspektasi, dan tempo penunaian.
is_enabled: true
content: |
  # Pengait Cerita dan Desain Misteri

  Skill ini digunakan untuk merancang secara lengkap pengait tingkat paragraf, pengait awal dan akhir bab, serta misteri lintas bab. Tentukan dahulu lapisan yang dibutuhkan saat ini lewat rute keputusan, lalu pilih jenis yang konkret, atur urutan informasi, dan terakhir jalankan pemeriksaan penunaian serta kesinambungan.

  ## Satu: Rute Keputusan

  | Tugas saat ini | Gunakan lebih dulu |
  |---|---|
  | Merancang awal atau akhir bab | Jenis pengait tingkat bab dan kekuatan per tahap |
  | Merancang pengait mikro di dalam paragraf | Jenis pengait tingkat paragraf dan aturan kombinasi |
  | Merancang sistem misteri yang lengkap | Siklus misteri, tingkat kekuatan, dan estafet ekspektasi |
  | Merancang ekspektasi sebelum titik kepuasan | Kesenjangan informasi, penempatan awal kartu pamungkas, dan pelapisan keterkejutan |

  ## Dua: Prinsip Dasar

  1. Tuliskan lebih dahulu dengan jelas apa yang kini diketahui pembaca, apa yang kini diketahui tokoh, dan apa yang paling ingin mereka ketahui berikutnya.
  2. Pengait wajib memikul fungsi yang konkret: memancing rasa penasaran, menaikkan risiko, mendorong tindakan, mengubah pemahaman, membangkitkan emosi, atau menyambung unit alur cerita berikutnya.
  3. Jangan mencampuradukkan misteri dan petunjuk awal: misteri membuat pembaca menduga apa yang akan terjadi selanjutnya dan biasanya terungkap dalam jangka pendek; petunjuk awal menyediakan jejak untuk pengungkapan yang jauh lebih lambat, dan saat diungkap menimbulkan keterkejutan atau rasa "oh, begitu".
  4. Urutan informasi wajib melayani ekspektasi. Isyarat palsu harus cukup meyakinkan, titik balik harus punya jejak pada teks sebelumnya, dan tidak boleh bergantung pada penulis yang sengaja menyembunyikan fakta penting.
  5. Setiap penunaian harus meninggalkan pertanyaan baru yang wajar, tetapi tidak boleh memakai latar baru yang dipaksakan untuk lari dari janji lama.
  6. Bab bertekanan rendah atau bab transisi boleh memakai pengait lemah, sasaran tahapan, atau sisa gaung emosi; tidak setiap bab dituntut menciptakan krisis berkekuatan tertinggi.

  ## Tiga: Urutan Informasi Misteri

  | Jenis | Urutan informasi | Situasi penggunaan |
  |---|---|---|
  | Alur cerita lugas | Ajukan pertanyaan -> umumkan jawaban | Penceritaan dasar |
  | Alur cerita penjelajahan | Ajukan pertanyaan -> isyarat normal -> umumkan jawaban | Unit alur cerita pembangun landasan |
  | Alur cerita tak terduga | Ajukan pertanyaan -> isyarat palsu -> umumkan jawaban | Unit alur cerita titik balik |
  | Tak terduga plus titik balik | Ajukan pertanyaan -> isyarat palsu satu -> isyarat palsu dua yang berlawanan -> umumkan jawaban | Unit alur cerita puncak |

  Setelah memilih templat, atur informasi sesuai urutannya. Isyarat palsu hanya boleh menuntun pembaca ke kesimpulan keliru yang masuk akal, dan tidak boleh bertabrakan dengan fakta yang sudah diketahui.

  ## Empat: Kekuatan Misteri

  | Tingkat | Nama | Efek pembacaan | Posisi umum |
  |---|---|---|---|
  | 1 | Misteri mikro | Penasaran | Bab transisi |
  | 2 | Misteri kecil | Ingin membaca unit berikutnya | Bab isi utama |
  | 3 | Misteri sedang | Ingin membaca bab berikutnya | Bab kunci |
  | 4 | Misteri besar | Sulit ditinggalkan sejenak | Bab ledakan |
  | 5 | Misteri ekstrem | Dorongan kuat mengikuti kelanjutan | Akhir volume atau puncak tahapan |

  Bab transisi minimal punya tingkat satu, bab isi utama minimal tingkat dua, bab kunci minimal tingkat tiga. Kekuatan datang dari kekonkretan pertanyaan, risiko, dan kesenjangan informasi, bukan dari pilihan kata yang berlebihan.

  ## Lima: Misteri Multijalur dan Estafet Ekspektasi

  - Busur pendek biasanya membentang 2-3 bab, cocok untuk satu konflik, satu penyelidikan, atau satu sasaran langsung.
  - Busur sedang biasanya membentang 5-8 bab, cocok untuk satu perubahan hubungan, teka-teki kecil, atau musuh tahapan.
  - Busur panjang bisa menembus satu volume atau seluruh naskah, cocok untuk rahasia terakhir, titik balik besar jalur utama, dan sasaran akhir.
  - Saat menjalankan busur panjang, sedang, dan pendek sekaligus, jaga minimal dua jalur ekspektasi tetap hidup pada tiap saat; untuk naskah pendek, minimal ada satu misteri utama dan satu misteri sampingan.
  - Setiap akhir bab minimal meninggalkan satu pertanyaan tak terjawab, tindakan tak selesai, atau ekspektasi yang belum tercapai.
  - Saat ekspektasi lama hampir ditunaikan, tanam lebih awal ekspektasi berikutnya sehingga terbentuk estafet "diajukan -> dinaikkan -> ditunaikan -> diajukan lagi".
  - Ketegangan ekspektasi biasanya paling tinggi ketika tokoh utama hampir mendapatkan sesuatu tetapi belum mendapatkannya; jangan mengakhiri ekspektasi tanpa alasan sebelum ditunaikan.

  ## Enam: Pengait Tiga Bagian dalam Satu Bab

  1. Tanam: 30% awal menanam benih pengait, memberikan keanehan, sasaran, batas waktu, atau kesenjangan informasi.
  2. Rawat: 50% bagian tengah menambah tekanan bertahap, membuat pembaca sadar bahwa persoalannya lebih rumit dari dugaan awal.
  3. Tuai: 20% akhir meledakkan atau menunda ledakan. Saat ledakan ditunda, wajib memberi informasi baru yang cukup untuk menopang bab berikutnya.

  ## Tujuh: Daya Dorong dan Titik Kepuasan

  Siklus intinya adalah: memunculkan tuntutan -> memberi harapan -> berupaya menyelesaikan -> memperoleh yang diinginkan.

  - Memunculkan tuntutan: pakai posisi rendah, keterhimpitan, ancaman, ketidakadilan, atau sesuatu yang belum pernah dimiliki untuk menciptakan rasa "seharusnya tidak seperti ini".
  - Memberi harapan: tunjukkan kemampuan, sumber daya, jejak, atau peluang mengubah keadaan.
  - Berupaya menyelesaikan: buat keterhimpitan berlapis dan menanjak, atau setelah satu masalah selesai, munculkan masalah baru yang berlapis lebih tinggi.
  - Memperoleh yang diinginkan: selesaikan penunaian emosi atau keuntungan yang terlihat, lalu tinggalkan sasaran untuk putaran berikutnya.

  Titik kepuasan lahir dari jarak antara logika orang banyak dan logika tokoh utama: lawan tampak tak terkalahkan, sementara tokoh utama menguasai informasi, persiapan, atau kemampuan yang berbeda. Semakin konkret landasan yang dipasang lebih awal, semakin kuat penunaiannya. Identitas dan bobot sasaran tamparan balik menentukan tingkat kepuasan; reaksi orang biasa yang lewat tidak bisa menggantikan perubahan sikap tokoh kunci.

  ## Delapan: Pengait Pemicu Empat Lapis

  1. Tunjukkan hasil awal, sertakan reaksi awal orang-orang di sekitar.
  2. Ungkap bahwa ini belum hasil akhir, naikkan ekspektasi.
  3. Tunjukkan unsur yang melampaui dugaan, ciptakan keterkejutan.
  4. Isyaratkan tokoh utama masih bisa naik lagi atau segera menghadapi masalah lebih besar, lalu buka unit berikutnya.

  Setiap lapis butuh reaksi tokoh untuk membuktikan kekuatannya. Tanpa reaksi di dalam adegan, misteri mudah berubah menjadi penulis yang berbicara sendiri.

  ## Sembilan: Keluaran Setelah Selesai

  - Posisi dan lapisan pengait:
  - Fungsi utama:
  - Informasi yang sudah diketahui pembaca:
  - Informasi yang sudah diketahui tokoh:
  - Pertanyaan yang belum terjawab saat ini:
  - Jenis atau kombinasi yang dipakai:
  - Urutan informasi:
  - Titik penunaian yang diperkirakan:
  - Ekspektasi baru setelah penunaian:
  - Risiko tidak tertunaikan:

  Jenis rinci, templat, dan butir pemeriksaan ada pada dokumen rujukan di bawah.
