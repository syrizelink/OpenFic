      | Larangan | Keterangan |
      |------|------|
      | Misteri palsu | Ancamannya tidak ada atau langsung sirna; pembaca yang sekali tertipu takkan percaya lagi |
      | Dewa turun secara mekanis | Krisis dilempar di akhir bab, lalu diselesaikan dengan kebetulan di awal bab berikutnya |
