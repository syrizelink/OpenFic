    content: |
      # Pengait tingkat bab: pemilihan dan penulisan pengait awal/akhir bab

      ## Rute keputusan

      ### Pengait akhir bab: pilih jenis berdasarkan emosi bab ini

      | Emosi/tahap bab ini | Pengait yang disarankan | Alasannya |
      |-------------|---------|-------|
      | Misteri/ketidaktahuan | Pengungkapan mendadak / benda misterius / ruang kosong | Memancing rasa penasaran |
      | Mendesak/krisis | Krisis darurat / hitungan mundur / tindakan tak selesai | Menciptakan kecemasan |
      | Titik balik/kebenaran | Titik balik identitas / makna tersembunyi / gaung | Menjungkirkan pemahaman |
      | Perasaan/hubungan | Pilihan dilematis / janji-ancaman / titik balik perasaan | Menarik-ulur emosi |
      | Khas naskah bersistem | Sistem menyala / bertipe pilihan | Ekspektasi akan kemampuan atau imbalan |
      | Suasana/keseharian | Pengait citraan / hilang secara ganjil / kesenjangan informasi | Arus bawah bergerak |

      ### Pengait awal bab: pilih jenis berdasarkan strategi pembuka

      | Strategi pembuka | Pengait yang disarankan | Alasannya |
      |---------|---------|-------|
      | Hantaman langsung | Pembuka tindakan tak selesai / pembuka hitungan mundur | Rasa mendesak seketika |
      | Memancing penasaran | Dialog bermisteri / serpihan kilas depan / monolog misterius | Digerakkan kesenjangan informasi |
      | Hantaman kontras | Adegan berkontras / citraan pertanda | Kontras yang memikat |

      ### Tahap bab dan kekuatan pengait

      | Tahap cerita | Jenis yang disarankan | Kekuatan |
      |----------|---------|------|
      | Bab 1 | Sistem menyala / pemotongan / krisis meningkat | Wajib kuat |
      | Bab 2-3 | Pilihan / kesenjangan informasi / titik balik perasaan | Kuat |
      | Keseharian paruh tengah | Misteri dalam dialog / kesenjangan informasi / identitas hampir terbongkar | Sedang |
      | Sebelum puncak | Krisis meningkat / pertanda misteri | Kuat |
      | Penutup besar | Lompatan waktu / titik balik perasaan | Merangkum |

      ## 13 pola pengait akhir bab

      | # | Nama | Rumus | Contoh |
      |---|------|------|------|
      | 1 | Pengungkapan mendadak | Melempar informasi yang mengubah seluruh keadaan | "Tanggal pada surat itu adalah hari ketujuh setelah kematiannya." |
      | 2 | Krisis darurat | Ancaman mendesak yang wajib ditanggapi pada bab berikutnya | "Celahnya melebar, batu roh masih kurang tiga butir." |
      | 3 | Tindakan tak selesai | Tindakan terputus oleh variabel baru | "Baru saja ia mengulurkan tangan, pergelangannya tiba-tiba dicengkeram. 'Jangan bergerak.' Sebuah suara datang dari belakangnya." |
      | 4 | Titik balik identitas | Kebenaran identitas menyimpang dari dugaan pembaca | "Namanya Lin Xiaoyue. Tetapi yang tertulis di arsip adalah: Lin Xiaoyue, telah meninggal." |
      | 5 | Pilihan dilematis | Dipaksa memilih satu dari dua pilihan buruk | "Kalau dokumen ini ditandatangani, perusahaan selamat, tapi ia harus masuk bui." |
      | 6 | Benda misterius | Benda penting yang maknanya belum diketahui | "Di dalam bungkusan itu ada sebuah kunci, disertai secarik kertas: 'Kau berutang padaku.'" |
      | 7 | Hitungan mundur | Waktu tidak cukup | "Dokter bilang masih ada tiga bulan. Itu perkataan dua bulan yang lalu." |
      | 8 | Janji/ancaman | Seseorang mengumumkan niat bertindak | "Sebelum jam dua belas malam ini, aku akan memberi tahu semua orang apa yang kau lakukan." |
      | 9 | Hilang secara ganjil | Kehilangan yang mustahil | "Belenggunya masih ada, orangnya tidak. Seluruh ruangan hanya punya satu pintu, dan pintu itu tak pernah terbuka." |
      | 10 | Makna tersembunyi | Permukaan tampak normal, sesungguhnya menyimpan informasi | "Ia berkata: 'Kau mirip sekali dengan adikmu.' Padahal ia anak tunggal." |
      | 11 | Pengait citraan | Citraan yang muncul berulang mengalami perubahan | "Pot melati di ambang jendela yang sudah sebulan kering itu tiba-tiba memunculkan kuncup." |
      | 12 | Pengait gaung | Kalimat akhir bab menggaungkan pembuka, tetapi detail kuncinya berubah | Pembuka: "Ia berkata takkan pernah memaafkannya." Penutup: "Ia berkata takkan pernah memaafkannya. Tetapi tangannya, mengepal lebih kencang." |
      | 13 | Pengait ruang kosong | Hanya menunjukkan reaksi, tanpa mengungkap apa yang terjadi | "Ia membaca surat itu. Wajahnya berubah. Tak berkata apa pun, ia melipat surat itu dan memasukkannya ke saku." |

      ## 7 pola pengait awal bab

      | # | Nama | Rumus | Contoh |
      |---|------|------|------|
      | 1 | Pembuka dialog bermisteri | Langsung mulai dari dialog yang penuh makna | "Kau yakin mau melakukan ini? / Yakin. / Kalau begitu jangan menyesal." |
      | 2 | Serpihan kilas depan | Beri serpihan hasil lebih dulu, lalu kembali ke penceritaan normal | "Baru kemudian ia tahu, panggilan telepon itu mengubah segalanya. Tetapi saat ini ia masih tak tahu apa-apa." |
      | 3 | Pembuka hitungan mundur | Membangun rasa mendesak sejak kalimat awal | "Sisa 72 jam sebelum kontrak berakhir." |
      | 4 | Monolog misterius | Monolog batin yang ganjil dalam sudut pandang orang pertama | "Aku terus berpikir, kalau hari itu aku tidak menoleh, apakah semuanya akan berbeda." |
      | 5 | Adegan berkontras | Dua adegan yang sangat berbeda disandingkan | "Di satu sisi ada pesta pernikahan, menara sampanye ditumpuk tinggi. Di sisi lain, lampu koridor rumah sakit berkedip." |
      | 6 | Pembuka tindakan tak selesai | Tindakan yang sedang berjalan lalu dipotong | "Baru saja ia menyelipkan kunci ke lubangnya, dari dalam pintu terdengar bunyi lirih." |
      | 7 | Citraan pertanda | Memakai citraan lingkungan untuk mengisyaratkan yang akan terjadi | "Ufuk terbakar merah, seperti ada sesuatu yang menyala. Ia mengangkat kepala sekilas, lalu terus berjalan." |

      ## Templat praktis akhir bab

      ### Bertipe sistem menyala
      ```
      Tepat ketika {tokoh utama} {berada dalam keadaan paling terpuruk}.
      {satu deskripsi indrawi}.
      Ting!
      [{nama sistem}, resmi diaktifkan.]
      ```

      ### Bertipe pertanda misteri
      ```
      {Tokoh utama} {dengan tenang/dingin} menatap {perilaku congkak pihak lawan}.
      {satu kalimat pendek: teruskan saja/perlahan saja/tidak perlu buru-buru}.
      {Umumkan titik balik yang akan datang, tanpa membocorkan detail}.
      ```

      ### Bertipe pemotongan
      ```
      {satu gerakan kecil}.
      {reaksi hebat}.
      {Keterkejutan/pertanyaan. Bab berakhir, jawaban tidak diberikan}
      ```

      ### Bertipe pilihan
      ```
      [Pilihan satu: {opsi menggoda}] Imbalan: {sangat menggoda} Harga: {risiko tersirat}
      [Pilihan dua: {opsi lain}] Imbalan: {godaan jenis lain} Harga: {risiko jenis lain}
      ```
      Bab berakhir, hasil pilihan tidak diberikan.

      ### Bertipe krisis meningkat
      ```
      {bunyi/gerakan mendadak}!
      {ancaman baru muncul}.
      {reaksi ketakutan/kepanikan tokoh utama}.
      ```

      ### Bertipe identitas hampir terbongkar
      ```
      {seorang pengamat} tiba-tiba {mengajukan pertanyaan/menemukan jejak}.
      "{ucapan yang mengisyaratkan identitas sejati tokoh utama}"
      {Orang lain tidak menghiraukan, tokoh utama diam-diam menegang}.
      ```

      ### Bertipe titik balik perasaan
      ```
      Tepat saat itu, {ekspresi/sikap} {tokoh} tiba-tiba {berubah drastis}.
      {satu tindakan melunak/permintaan yang tak terduga}.
      "{ucapan yang menusuk titik lemah tokoh utama}"
      ```

      ### Bertipe kesenjangan informasi
      ```
      {keraguan diri/keluh batin tokoh utama}.
      {satu citraan/kiasan}.
      {Isyaratkan akan ada perubahan, tanpa menyatakannya terang-terangan}.
      ```

      ### Bertipe misteri dalam dialog
      ```
      "{paruh pertama pengajuan permintaan}"
      "{tanggapan pihak lawan}"
      "{paruh kedua yang tak terduga, bukan yang diperkirakan pembaca}"
      ```

      ### Bertipe lompatan waktu
      ```
      {penanda waktu yang persis/kabur}.
      {hasil yang tak terduga}.
      {satu kalimat yang mengisyaratkan prosesnya}.
      ```

      ## Pemeriksaan titik kepuasan dan akhir bab

      Titik kepuasan = konflik antara logika orang banyak dan logika tokoh utama. Lawan yang tak terkalahkan menghadirkan rasa takut atau putus asa, sementara tokoh utama menguasai informasi, persiapan, atau kemampuan yang berbeda; semakin besar jaraknya, semakin kuat pelepasannya.

      - Kerumunan penonton mengangkat gengsi lawan melalui gunjingan, lalu memperbesar tamparan balik lewat reaksi terkejut mereka.
      - Lawan wajib congkak sampai pembaca punya emosi yang jelas, baru tamparan baliknya punya bobot.
      - Tokoh utama boleh berlaku rendah hati saat memasang landasan, tetapi harus tegas saat melepaskan.
      - Sebelum tamparan balik, wajib ada ketakterkalahan kecil yang dipasang lebih awal: benda, tokoh, kekuatan, atau informasi harus sudah siap.
      - Landasan lebih penting daripada tamparan baliknya, dan reaksi tokoh berbobot lebih efektif daripada orang biasa yang lewat.
      - 100 kata pertama bab punya pengait, akhir bab punya alasan untuk terus membaca, dua bab berurutan tidak memakai pengait yang sama, dan pengait cukup disentuh lalu dilepas.
  - name: Buku Panduan Lengkap Pengait Tingkat Paragraf
    content: |
      # Teknik pengait tingkat paragraf

      ## 11 jenis pengait tingkat paragraf

      | # | Nama | Rumus | Contoh | Keefektifan |
      |---|------|------|------|--------|
      | 1 | Kesenjangan informasi | Pembaca tahu informasi kunci, tokoh tidak tahu | "Ia menerima kopi itu dengan tersenyum, tanpa tahu perempuan itu baru saja menaruh sebutir obat tidur di dalamnya." | *5 |
      | 2 | Hitungan mundur | Memasang tekanan waktu yang jelas | "Masa jeda perceraian tinggal tiga hari terakhir. Setelah tiga hari, ia tanda tangan atau tidak sudah tak ada bedanya." | *4 |
      | 3 | Titik balik | Dugaan pembaca tiba-tiba dipatahkan | "Ia membuka surat wasiat itu, kolom pewaris kosong. Halaman berikutnya menindih surat keterangan kematian ibunya." | *5 |
      | 4 | Kartu tertutup | Tokoh utama menyimpan satu kartu tanpa memainkannya, pembaca menunggu kartu dibuka | "Ibu mertua mengomel sepuluh menit penuh. Aku tak mengucapkan sepatah kata pun. Perekam suara di ponsel masih berjalan." | *4 |
      | 5 | Tamparan balik | Tokoh sedang berbangga, pembaca tahu ia segera ditampar | "'Kau? Juga mau bersaing denganku?' Ia terbahak sampai terguncang. Aku tidak berkata apa-apa. Aku hanya mengeluarkan laporan tes DNA itu dari tas." | *5 |
      | 6 | Harga | Mengisyaratkan tokoh utama akan kehilangan sesuatu atau pilihannya menuntut bayaran | "Aku tahu apa artinya melaporkan dia. Kalau dia dilaporkan, aku juga habis. Tapi aku tetap menekan tombol kirim." | *4 |
      | 7 | Yang lemah/anak | Memperkenalkan pihak lemah yang butuh dilindungi, membangkitkan dorongan melindungi | "Putrinya bersembunyi di balik pintu, menutup kedua telinganya. Ia baru empat tahun, belum mengerti apa-apa. Tetapi ia tahu tidak boleh bersuara." | *4 |
      | 8 | Arwah yang mengamati | Tokoh utama sudah mati, bercerita dari sudut pandang arwah, serba tahu tetapi tak berdaya mengubah | "Arwahku pelan-pelan melayang naik, menatap wajah ibu yang membiru. Maafkan aku, Bu, aku tak sanggup berdiri tegak." | *5 |
      | 9 | Benda ganjil | Benda yang seharusnya tidak ada memicu seluruh keadaan | "Tanggal pada kondom itu tiba-tiba berbeda, bahkan rasanya berubah menjadi mangga yang dulu membuatku alergi. Aku mengangguk dengan tersenyum." | *5 |
      | 10 | Kepatuhan berpura-pura | Tokoh utama justru menyerahkan benda yang di kehidupan sebelumnya ia lindungi sekuat tenaga, lawan menyangka ia gila | "'Kalau kau memang menginginkannya, ambil saja semuanya.' Toh siapa pun yang mendapat warisan ini akan tertimpa malapetaka besar." | *4 |
      | 11 | Penemuan dingin | Setelah menemukan keganjilan ia tetap sangat tenang, dan ketenangan itu sendiri menciptakan misteri | "Pada gantungan kunci itu tercetak 'VIP Pusat Perawatan Pascamelahirkan Yue'an'. Padahal kami tidak punya anak. Aku mengangguk dengan tersenyum." | *5 |

      ### Butir penting penggunaan
      - Kesenjangan informasi tidak boleh berlarut terlalu lama; setelah melewati rentang yang cukup panjang, tambahkan informasi baru atau ubah arahnya.
      - Begitu hitungan mundur dipasang, ia wajib ditunaikan saat jatuh tempo, tidak boleh dibiarkan menggantung.
      - Titik balik wajib punya landasan; titik balik tanpa landasan adalah kecurangan.
      - Kartu tertutup tidak boleh disimpan terlalu lama; pada naskah pendek paling lama sekitar 30% panjang naskah.
      - Tamparan balik harus tegas dan ringkas; satu kalimat dialog yang tepat sering lebih unggul daripada satu paragraf penjelasan.
      - Harga wajib nyata; kalau pada akhirnya tokoh utama tidak kehilangan apa pun, pengait harga menjadi tak berfungsi.
      - Pihak lemah tidak boleh hanya jadi alat; ia harus punya jalur tindakannya sendiri.
      - Batasan sudut pandang arwah wajib dipatuhi dengan ketat.

      ## Kombinasi pengait

      | Kombinasi | Efek | Genre yang cocok |
      |---|---|---|
      | Kesenjangan informasi + kartu tertutup | Pembaca tahu tokoh utama sedang menahan jurus besar | Balas dendam, kehidupan sosial |
      | Hitungan mundur + harga | Waktu mendesak dan apa pun yang dipilih tetap merugi | Misteri kriminal, pernikahan dan percintaan |
      | Titik balik + tamparan balik | Roller coaster emosi | Naskah pendek berorientasi kepuasan |
      | Yang lemah + harga | Empati diperkuat | Mengejar kembali kekasih, kehidupan sosial, tragedi |
      | Kartu tertutup + tamparan balik | Penghimpunan rasa kepuasan paling kuat | Balas dendam, kebangkitan dari bawah |
      | Benda ganjil + penemuan dingin | Misteri dalam keseharian dan penggilasan kecerdasan | Misteri kriminal |
      | Arwah yang mengamati + yang lemah | Tragedi dan dorongan melindungi | Genre tragedi |
      | Kepatuhan berpura-pura + kartu tertutup | Kesenjangan informasi berlapis tiga dan penghimpunan rasa kepuasan | Balas dendam |

      Teknik melayani penyampaian; jangan memakai teknik hanya demi memakai teknik. Teknik boleh dicampur, kalau tidak berguna dibuang, dan alur cerita tidak boleh dipaksa lahir dari tekniknya sendiri.

      ## Larangan pengait
      - Misteri palsu: ancamannya tidak ada atau langsung sirna.
      - Dewa turun secara mekanis: krisis dilempar di akhir bab, lalu diselesaikan dengan kebetulan pada bab berikutnya.
      - Ruang kosong berlebihan: beberapa bab berurutan tidak mengungkap informasi apa pun.
      - Pengait berisiko rendah: memakai hal sepele untuk menciptakan misteri.
      - Pemakaian jenis yang sama berturut-turut: memakai satu jenis pengait selama tiga bab atau lebih.

      ## Lima tingkat penaikan emosi dialog
      | Tingkat | Jenis | Kekuatan |
      |---|---|---|
      | 1 | Menyatakan fakta secara objektif | Paling lemah |
      | 2 | Menyatakan secara objektif sekaligus mengajukan saran | Sopan tetapi berbobot |
      | 3 | Tuduhan subjektif | Mulai terasa konflik |
      | 4 | Tuduhan subjektif sekaligus perintah paksa | Emosi kuat |
      | 5 | Tuduhan subjektif sambil meninggikan diri lewat kepedulian atau dalih demi kebaikanmu | Paling kuat |

      ## Pengait cedera yang tidak adil
      Cedera yang tidak adil = ketidakadilan atas tokoh utama yang tak bersalah + cedera fisik atau batin. Cedera batin biasanya lebih mampu menggerakkan emosi pembaca.

      | Jenis | Motif | Perilaku | Sikap |
      |---|---|---|---|
      | Bertipe pengalihan keuntungan | Tokoh antagonis tak mau menanggung harga | Merampas, memerintah, memaksa | Merasa itu sudah semestinya |
      | Bertipe pelemparan kerugian | Tokoh antagonis melimpahkan hukuman kepada tokoh utama | Menyusun jebakan, memaksa jadi kambing hitam | Tersembunyi dan keji |
      | Bertipe berhadapan langsung | Tokoh utama mematahkan tatanan tokoh antagonis | Menjebak, memperhitungkan, mencederai | Tak memberi jalan hidup |

      Cara menekan yang benar: sebisa mungkin ganti kerugian jangka panjang yang benar-benar dialami tokoh utama dengan "penyangkalan oleh orang lain, tamparan balik oleh tokoh utama"; alasan penyangkalan harus sesuai informasi yang tersedia saat itu; cara menyangkal dari tokoh yang berbeda harus berbeda; tekanan hanya dipusatkan pada puncak yang kunci.

      ## Lapisan kualitas penonton
      | Lapisan | Sasaran | Ciri |
      |---|---|---|
      | Kualitas rendah | Pemain latar, tukang serabutan, pemagang | Murni reaksi emosi, tanpa kelanjutan |
      | Kualitas sedang | Praktisi yang paham bidangnya, tangan kanan | Mampu membandingkan secara profesional, ada perubahan sikap |
      | Kualitas tinggi | Puncak industri, tokoh kunci | Reaksinya disertai penyingkapan informasi, kemajuan hubungan, dan ekspektasi baru |

      Saat melapisi penonton, utamakan menambah ragam tokoh, tingkatan tokoh, kedalaman hubungan, dan perbedaan reaksi; jangan hanya menambah "semua orang terkejut".
  - name: Buku Panduan Lengkap Penataan Misteri
    content: |
      # Buku panduan operasional penataan misteri

      Hakikat misteri adalah pembaca menghadapi dua arah kemungkinan atau lebih dan menganggap semuanya mungkin terjadi. Bedanya misteri dengan petunjuk awal: misteri biasanya terungkap dalam jangka pendek dan menciptakan ketegangan, rasa penasaran, atau ekspektasi; petunjuk awal menanam jejak untuk jangka panjang dan saat diungkap menciptakan keterkejutan serta rasa menoleh ke belakang.

      ## Siklus misteri multijalur
      | Panjang busur | Rentang | Contoh |
      |---|---|---|
      | Busur pendek | 2-3 bab | Satu pertarungan, satu konflik |
      | Busur sedang | 5-8 bab | Satu perubahan hubungan, satu teka-teki kecil |
      | Busur panjang | Satu volume penuh atau seluruh buku | Rahasia terakhir, titik balik besar jalur utama |

      Saat merencanakan, pasang busur dengan panjang berbeda secara bersamaan, dan pastikan pada tiap saat minimal ada dua jalur misteri yang berjalan. Setiap akhir bab wajib punya pertanyaan tak terjawab atau ekspektasi yang belum tercapai; ekspektasi bekerja dalam tiga lapis, yaitu jangka pendek, jangka menengah, dan jangka jauh.

      ## Estafet ekspektasi
      1. Buat pembaca selalu memegang tiga titik penasaran di kepalanya: dua jalur jangka panjang dan satu jalur jangka pendek.
      2. Saat ekspektasi panjang hampir ditarik kembali, ubah ia menjadi ledakan jangka pendek, sekaligus tanam lebih awal ekspektasi jangka panjang yang baru.
      3. Ketika tokoh utama hampir mendapatkan sesuatu tetapi belum mendapatkannya, jangan akhiri ekspektasi yang sedang berjalan; pasang dulu pengait berikutnya sebelum penunaian.
      4. Ekspektasi besar dan kecil bergerak maju bergantian, dan pada tiap saat jangan biarkan semua pertanyaan tertutup bersamaan.

      ## Garis lipat emosi dan penghimpunan tenaga
      `landasan menanjak -> kemunduran menurun -> landasan menanjak lagi -> kemunduran menurun lagi -> ledakan menanjak`.

      Bagian menanjak boleh lebih banyak, bagian menurun harus dikendalikan dengan presisi. Penurunan yang terlalu tajam membuat pembaca meninggalkan buku, terlalu ringan membuatnya tidak berbunyi. Pada novel daring, penurunan sebaiknya memakai kemunduran kecil dan riak kecil, hindari tokoh utama yang benar-benar tertekan dalam jangka panjang; penghimpunan tenaga yang terlalu lama membuat lelah, yang kurang membuat rasa kepuasan tak memadai, dan setelah pelepasan, titik kepuasan berikutnya harus menguat bertahap.

      ## Templat ekspektasi delapan langkah untuk memamerkan benda atau kemampuan
      1. Tunjukkan bahwa benda pusaka atau kemampuannya kuat.
      2. Tokoh pendamping menganggapnya tak berguna karena informasinya kurang.
      3. Tunjukkan satu tokoh antagonis atau keterhimpitan yang justru dapat ditaklukkan olehnya.
      4. Tokoh pendamping memakai perlengkapan lebih kuat tetapi gagal.
      5. Tokoh utama menyusun rencana yang tepat sasaran.
      6. Tokoh utama turun ke gelanggang, semua orang meragukannya.
      7. Tokoh utama menuntaskan penguasaan, semua orang terkejut, benda yang dianggap tak berguna berubah menjadi senjata sakti.
      8. Muncul perolehan baru dan ekspektasi baru.

      ## Pelapisan keterkejutan
      - Keterkejutan titik: satu orang bereaksi, paling lemah.
      - Keterkejutan jaring: beberapa orang di dalam jaringan hubungan menunjukkan reaksi yang berbeda.
      - Keterkejutan mendalam: pencapaian satu, pencapaian dua, pencapaian tiga naik lapis demi lapis.

      Sasaran keterkejutan harus sepadan dengan porsi adegan setelahnya: orang tak dikenal hanya memberi emosi lemah, orang yang dikenal bisa memunculkan perubahan sikap, dan keterkejutan tokoh penting serta pemegang posisi tinggi harus disertai informasi, hubungan, atau ekspektasi baru. Perubahan visual dan fisik pada suatu benda biasanya lebih berbobot daripada "ia terkejut".

      ## Teknik lazim untuk menarik ekspektasi
      - Terus menyamar sambil menanti terbongkar.
      - Memamerkan kemampuan yang tidak lazim.
      - Perilaku yang melanggar dugaan atas watak tokoh.
      - Menunjukkan sebagian kekuatan sambil menahan kartu pamungkas.
      - Kejadian tak terduga yang mendadak memecah ketenangan.
      - Menghimpun tenaga secara diam-diam sambil menanti momen.
      - Mencari keuntungan di tengah risiko tinggi.
      - Bermanuver di tengah kekacauan.
      - Merangkai tokoh dari lintas kubu kekuatan.
      - Beberapa kubu kekuatan bereaksi berbeda atas peristiwa yang sama.
      - Nama yang menyebar memancing perhatian baru.
      - Tokoh penting terancam sambil menanti tokoh utama bertindak.
      - Mendekati sasaran langkah demi langkah, tiap langkah memunculkan ekspektasi baru.
      - Ancaman tersembunyi yang muncul perlahan ke permukaan.
      - Setelah satu masalah selesai, muncul masalah yang lebih besar.
      - Memperoleh sumber daya langka lalu mengisyaratkan kegunaannya.
      - Mengubah barang tak berguna menjadi bernilai dengan cara yang khas.
      - Peta baru, aturan baru, kombinasi kemampuan baru, atau lapisan lebih dalam dari informasi yang sudah diketahui.
      - Titik terang muncul di jalan yang tampak buntu.
      - Jalur peningkatan, efek kemampuan baru, dan penunaian setelah peningkatan.
      - Tokoh penting berkorban, atau tokoh utama menata jebakan secara diam-diam sambil menanti waktu menarik jala.

      Semua teknik melayani penyampaian, bukan daftar yang wajib diisi penuh.

      ## Tiga lapis mematahkan lawan kuat
      | Lapisan | Cara |
      |---|---|
      | Bentur keras lawan keras | Menggilas dengan kekuatan, sederhana dan langsung |
      | Menduga lebih dulu lalu membalas | Tokoh antagonis mengeluarkan A, tokoh utama sudah menyiapkan B untuk menaklukkan A |
      | Melawan dugaan | Tokoh antagonis menyasar A, tokoh utama memanfaatkan A untuk memasang jebakan yang menuntun tokoh antagonis jatuh ke B |

      Titik kepuasan intinya adalah pemikiran, persiapan, dan daya kendali tokoh utama pada lapisan yang lebih tinggi, bukan tokoh antagonis yang tiba-tiba menjadi bodoh.

      ## Model kecanduan Hook
      Pemicu -> tindakan -> imbalan -> penanaman. Pemicu mengingatkan hasrat, tindakan menurunkan ambang pemahaman dan keterlibatan, imbalan harus dapat diperkirakan sekaligus menyimpan kejutan, dan penanaman membuat pembaca peduli pada perlengkapan, peringkat, hubungan, dan hasil yang sudah terhimpun. Perolehan tidak boleh hanya berupa "pengalaman dan uang", tetapi juga bisa berupa hasil tambahan yang tak terduga namun masuk akal.

      ## Mekanisme mendalam
      - Kejadian tak terduga seperti bom yang meledak mendadak, misteri seperti mendengar pengatur waktu berdetak; misteri biasanya punya daya tahan yang lebih panjang.
      - Di akhir bab, buat tokoh menghadapi bahaya atau pilihan yang belum terselesaikan.
      - Pakai kunci waktu untuk memampatkan ruang bertindak, lalu berikan kemajuan pada jarak tertentu.
      - Ekspektasi lebih penting daripada titik kepuasan; kepuasan adalah proses pelepasan, bukan keseluruhan emosinya.
      - Setelah masalah selesai, wajib muncul masalah, sasaran, atau perubahan hubungan yang baru; mesin cerita tidak boleh berhenti.

      ## Pemeriksaan mutu lengkap
      - Apakah tingkat misteri sesuai dengan posisi bab.
      - Apakah rantai ekspektasi punya minimal satu jalur tak terjawab yang berjalan.
      - Apakah setiap titik misteri punya reaksi tokoh.
      - Apakah ada kesenjangan informasi yang efektif antara pembaca dan tokoh.
      - Apakah akhir bab punya masalah tak terselesaikan atau ekspektasi yang belum tercapai.
      - Apakah bagian menurun terkendali dalam rentang riak yang masih tertahankan.
      - Apakah keterkejutan punya lapisan titik, jaring, dan kedalaman.
      - Apakah penanjakan punya perubahan visual atau fisik.
      - Apakah rasa kepuasan menguat dari kali ke kali.
      - Apakah masalahnya tidak menghilang begitu saja.
      - Apakah paralelisme multijalur tetap terjaga.
      - Setelah kartu pamungkas dibuka, apakah tokoh antagonis menerima penguasaan yang sepadan.
  - name: Tambahan Praktis Pengait Versi Asal
    content: |
      # Tambahan praktis pengait tingkat bab versi asal

      ## Contoh templat praktis akhir bab

      ### Bertipe sistem menyala
      ```
      Tepat ketika {tokoh utama} {berada dalam keadaan paling terpuruk}.
      {satu deskripsi indrawi}.
      Ting!
      [{nama sistem}, resmi diaktifkan.]
      ```
      Contoh: Tepat ketika seluruh harapannya telah runtuh. Sebuah suara mesin yang dingin tiba-tiba berbunyi di dalam kepalanya. Ting! [Sistem Muda dan Congkak, resmi diaktifkan.]

      ### Bertipe pertanda misteri
      ```
      {Tokoh utama} {dengan tenang/dingin} menatap {perilaku congkak pihak lawan}.
      {satu kalimat pendek: teruskan saja/perlahan saja/tidak perlu buru-buru}.
      {Umumkan titik balik yang akan datang, tanpa membocorkan detail}.
      ```
      Contoh: Aku menatap dingin orang yang terbahak sampai terguncang itu. Tertawalah. Tertawa sedikit lebih lama. Setelah hari ini lewat, kalian takkan bisa tertawa lagi.

      ### Bertipe pemotongan
      ```
      {satu gerakan kecil}.
      {reaksi hebat}.
      {Keterkejutan/pertanyaan. Bab berakhir, jawaban tidak diberikan}.
      ```
      Contoh: Hanya satu suapan! Pupil matanya mengerut mendadak sampai setajam ujung jarum. Buum! Segumpal arus panas yang mengerikan sampai sukar digambarkan seketika meledak di dalam perutnya! Bubur ini ada yang tidak wajar! Sebenarnya apa yang dicampurkan ke dalamnya?

      ### Bertipe pilihan
      ```
      [Pilihan satu: {opsi menggoda}] Imbalan: {sangat menggoda} Harga: {risiko tersirat}
      [Pilihan dua: {opsi lain}] Imbalan: {godaan jenis lain} Harga: {risiko jenis lain}
      ```
      Bab berakhir, hasil pilihan tidak diberikan.

      ### Bertipe krisis meningkat
      ```
      {bunyi/gerakan mendadak}!
      {ancaman baru muncul}.
      {reaksi ketakutan/kepanikan tokoh utama}.
      ```
      Contoh: "Keluar semua! Cepat!" Braak!!! Sebuah sepatu bot tentara yang berlumur lumpur menendang pintu kurungan itu dengan kasar.

      ### Bertipe identitas hampir terbongkar
      ```
      {seorang pengamat} tiba-tiba {mengajukan pertanyaan/menemukan jejak}.
      "{ucapan yang mengisyaratkan identitas sejati tokoh utama}"
      {Orang lain tidak menghiraukan, tokoh utama diam-diam menegang}.
      ```

      ### Bertipe titik balik perasaan
      ```
      Tepat saat itu, {ekspresi/sikap} {tokoh} tiba-tiba {berubah drastis}.
      {satu tindakan melunak/permintaan yang tak terduga}.
      "{ucapan yang menusuk titik lemah tokoh utama}"
      ```

      ### Bertipe kesenjangan informasi
      ```
      {keraguan diri/keluh batin tokoh utama}.
      {satu citraan/kiasan}.
      {Isyaratkan akan ada perubahan, tanpa menyatakannya terang-terangan}.
      ```
      Contoh: Bunga punya hari untuk berkembang lagi, manusia tak punya masa muda kedua. Bagaimana bisa hidupku sendiri kujalani sampai berantakan seperti ini?

      ### Bertipe misteri dalam dialog
      ```
      "{paruh pertama pengajuan permintaan}"
      "{tanggapan pihak lawan}"
      "{paruh kedua yang tak terduga, bukan yang diperkirakan pembaca}"
      ```
      Contoh: "Aku punya satu permintaan." Su Mu berkata perlahan. "Katakan." "Sebelum bercerai, aku ingin sekali saja membuktikan diriku."

      ### Bertipe lompatan waktu
      ```
      {penanda waktu yang persis/kabur}.
      {hasil yang tak terduga}.
      {satu kalimat yang mengisyaratkan prosesnya}.
      ```
      Contoh: Tiga menit tiga detik kemudian. Jiang Yiyao keluar dari kamar dengan wajah tenang, sedikit merapikan pakaiannya yang berantakan.

      ## Tiga pengait akhir bab bergaya sketsa cepat

      ### Bertipe pengumuman perolehan (akhir dungeon/misi)
      ```
      {tindakan yang berjalan sekarang mendekati selesai}.
      {isyaratkan imbalan yang segera diperoleh}.
      {satu kalimat yang mengisyaratkan imbalannya lebih besar dari dugaan}.
      ```

      ### Bertipe tokoh antagonis mendekat (akhir unit pembangun landasan)
      ```
      {keadaan tokoh utama saat ini}.
      {di tempat gelap/kejauhan, satu tindakan tokoh antagonis}.
      {isyaratkan tindakan ini akan memengaruhi tokoh utama}.
      ```

      ### Bertipe pengumuman tindakan (sebelum pameran diri/tamparan balik)
      ```
      {tokoh utama membuat satu keputusan}.
      {satu gerakan persiapan}.
      {isyaratkan tindakan yang akan terjadi}. Hasilnya tidak dituliskan.
      ```

      ## Tempo pameran diri dan tamparan balik

      | Tahap | Masa publik (siklus 5 bab) | Masa VIP |
      |------|-------------------|--------|
      | Penetapan watak | 1 bab | 1-2 bab |
      | Pembangunan landasan | 2 bab | 5 bab |
      | Tamparan balik | 1 bab | 1-2 bab |
      | Pembenahan pasca | 1 bab | 1 bab |

      - Ketakterkalahan kecil yang dipasang lebih awal: sebelum tamparan balik, benda, tokoh, atau kekuatan wajib sudah siap, kalau tidak, cemoohan justru berubah menjadi penyiksaan tokoh utama.
      - Landasan lebih penting daripada tamparan baliknya; setelah landasannya matang, tokoh utama berdiri tanpa berkata apa pun pun sudah terasa memamerkan diri.
      - Tingkatan sasaran tamparan balik menentukan tingkat rasa kepuasan; keterkejutan orang biasa yang lewat tidak sama dengan keterkejutan tokoh berbobot.
      - Pengait akhir bab sekitar 100 kata sudah cukup untuk menaikkan angka penuntasan bacaan secara nyata.

      ## Pemeriksaan mutu tingkat bab

      - [ ] 100 kata pertama bab punya pengait, bukan dibuka dengan pemandangan atau cuaca.
      - [ ] Akhir bab punya sesuatu yang membuat pembaca ingin membuka halaman berikutnya.
      - [ ] Kekuatan pengait sepadan dengan tahap bab; bab keseharian tidak wajib punya pengait kuat.
      - [ ] Dua bab berurutan tidak memakai jenis pengait yang sama.
      - [ ] Pengait sekitar 100 kata, cukup disentuh lalu dilepas, tidak berkepanjangan.

      # Tambahan pengait tingkat paragraf versi asal

      ## 11 jenis pengait tingkat paragraf

      | # | Nama | Rumus | Contoh | Keefektifan |
      |---|------|------|------|--------|
      | 1 | Kesenjangan informasi | Pembaca tahu informasi kunci, tokoh tidak tahu | "Ia menerima kopi itu dengan tersenyum, tanpa tahu perempuan itu baru saja menaruh sebutir obat tidur di dalamnya." | *5 |
      | 2 | Hitungan mundur | Memasang tekanan waktu yang jelas | "Masa jeda perceraian tinggal tiga hari terakhir. Setelah tiga hari, ia tanda tangan atau tidak sudah tak ada bedanya." | *4 |
      | 3 | Titik balik | Dugaan pembaca tiba-tiba dipatahkan | "Ia membuka surat wasiat itu, kolom pewaris kosong. Halaman berikutnya menindih surat keterangan kematian ibunya." | *5 |
      | 4 | Kartu tertutup | Tokoh utama menyimpan satu kartu tanpa memainkannya, pembaca menunggu kartu dibuka | "Ibu mertua mengomel sepuluh menit penuh. Aku tak mengucapkan sepatah kata pun. Perekam suara di ponsel masih berjalan." | *4 |
      | 5 | Tamparan balik | Tokoh sedang berbangga, pembaca tahu ia segera ditampar | "[Kau? Juga mau bersaing denganku?] Ia terbahak sampai terguncang. Aku tidak berkata apa-apa. Aku hanya mengeluarkan laporan tes DNA itu dari tas." | *5 |
      | 6 | Harga | Mengisyaratkan tokoh utama akan kehilangan sesuatu atau pilihannya menuntut bayaran yang berat | "Aku tahu apa artinya melaporkan dia. Kalau dia dilaporkan, aku juga habis. Tapi aku tetap menekan tombol kirim." | *4 |
      | 7 | Yang lemah/anak | Memperkenalkan pihak lemah yang butuh dilindungi, membangkitkan dorongan melindungi | "Putrinya bersembunyi di balik pintu, menutup kedua telinganya. Ia baru empat tahun, belum mengerti apa-apa. Tetapi ia tahu tidak boleh bersuara." | *4 |
      | 8 | Arwah yang mengamati | Tokoh utama sudah mati, bercerita dari sudut pandang arwah, serba tahu tetapi tak berdaya mengubah | "Arwahku pelan-pelan melayang naik, menatap wajah ibu yang membiru. Maafkan aku, Bu, aku tak sanggup berdiri tegak." | *5 |
      | 9 | Benda ganjil | Benda yang seharusnya tidak ada di tempat ini memicu seluruh keadaan | "Tanggal pada kondom itu tiba-tiba berbeda, bahkan rasanya berubah menjadi mangga yang dulu membuatku alergi. Aku mengangguk dengan tersenyum." | *5 |
      | 10 | Kepatuhan berpura-pura | Setelah terlahir kembali ia justru menyerahkan benda yang di kehidupan sebelumnya ia lindungi sekuat tenaga, lawan menyangka ia gila | "'Kalau kau memang menginginkannya, ambil saja semuanya.' Toh siapa pun yang mendapat warisan besar ini akan tertimpa malapetaka besar, dan aku justru sedang bingung mencari cara menyelamatkan nyawa." | *4 |
      | 11 | Penemuan dingin | Reaksi pertamanya setelah menemukan keganjilan adalah tetap sangat tenang, dan ketenangan itu sendiri menciptakan misteri | "Pada gantungan kunci itu tercetak 'VIP Pusat Perawatan Pascamelahirkan Yue'an'. Padahal kami tidak punya anak. Aku mengangguk dengan tersenyum. Hari itu juga aku pergi ke pusat perawatan itu dan mencatat lembar pemesanannya." | *5 |

      ### Butir penting penggunaan
      - Kesenjangan informasi tidak boleh berlarut terlalu lama; melewati 3000 kata pembaca akan jengkel.
      - Begitu hitungan mundur dipasang, ia wajib ditunaikan saat jatuh tempo, tidak boleh dibiarkan menggantung.
      - Titik balik wajib punya landasan; titik balik tanpa landasan adalah kecurangan.
      - Kartu tertutup tidak boleh disimpan terlalu lama; pada naskah pendek paling lama 30% panjang naskah.
      - Tamparan balik harus tegas dan ringkas; tamparan balik satu kalimat lebih memuaskan daripada tamparan balik satu paragraf.
      - Harga wajib nyata; kalau pada akhirnya tokoh utama tidak kehilangan apa pun, pengait harga menjadi tak berfungsi.
      - Pihak lemah tidak boleh hanya jadi alat; ia harus punya jalur tindakannya sendiri.
      - Sudut pandang arwah hanya boleh melihat dan tidak boleh bertindak; batasan ini wajib dipatuhi dengan ketat.

      ## Tabel lengkap kombinasi pengait

      | Kombinasi | Efek | Genre yang cocok |
      |------|------|----------|
      | Kesenjangan informasi + kartu tertutup | Pembaca tahu tokoh utama sedang menahan jurus besar | Balas dendam, kehidupan sosial |
      | Hitungan mundur + harga | Waktu mendesak dan apa pun yang dipilih tetap merugi | Misteri kriminal, pernikahan dan percintaan |
      | Titik balik + tamparan balik | Roller coaster emosi | Semua naskah pendek berorientasi kepuasan |
      | Yang lemah + harga | Empati terisi penuh | Mengejar kembali kekasih, kehidupan sosial, sastra tokoh yang mati |
      | Kartu tertutup + tamparan balik | Rasa kepuasan paling kuat | Balas dendam, kebangkitan dari bawah |
      | Benda ganjil + penemuan dingin | Rasa misteri dalam keseharian dan penggilasan kecerdasan | Misteri kriminal |
      | Arwah yang mengamati + yang lemah | Tragedi paling ekstrem dan dorongan melindungi | Genre tragedi |
      | Kepatuhan berpura-pura + kartu tertutup | Kesenjangan informasi berlapis tiga dan penghimpunan rasa kepuasan | Balas dendam |
      | Pengkhianatan bertangga + penemuan dingin | Penambahan bobot lapis demi lapis dan ketenangan sepanjang jalan | Balas dendam, kehidupan sosial |

      1. Teknik melayani penyampaian; jangan memakai teknik hanya demi memakai teknik.
      2. Pada tahap merancang alur cerita, beberapa teknik boleh dipertimbangkan sekaligus untuk memperkaya alur cerita.
      3. Teknik boleh dipakai bercampur, kalau tidak berguna dibuang.
      4. Jangan menurunkan alur cerita dari satu teknik tunggal; teknik adalah alat, bukan belenggu.

