      ## Lima tingkat penaikan emosi dialog

      | Tingkat | Jenis | Kekuatan |
      |------|------|------|
      | 1 | Menyatakan fakta secara objektif | Paling lemah |
      | 2 | Menyatakan secara objektif sekaligus mengajukan saran | Sopan tetapi berbobot |
      | 3 | Tuduhan subjektif | Mulai terasa konflik |
      | 4 | Tuduhan subjektif sekaligus perintah paksa | Emosi kuat |
      | 5 | Tuduhan subjektif sambil meninggikan diri dengan dalih "demi kebaikanmu" | Paling kuat |

      Tutur kata yang paling kuat berkedok "demi kebaikanmu", tiap kalimatnya tak lepas dari kepedulian, tetapi tiap kalimatnya adalah kejengkelan, tuduhan, dan rasa jijik.

      ## Pengait cedera yang tidak adil

      Cedera yang tidak adil = ketidakadilan (tokoh utama tak bersalah) + cedera (fisik + batin). Cedera batin lebih mampu menggerakkan emosi pembaca, karena sebagian besar pembaca lebih sering menelan kekesalan. "Yang menyakitkan bukan kekurangan, melainkan ketidakmerataan": jatah bulanan yang dipotong untuk semua orang itu adil, tetapi hanya bahan obat tokoh utama yang diturunkan satu tingkat itu tidak adil. Pilih salah satu saja dan tulis sampai matang, kebencian terhadap tokoh antagonis sudah bisa terbangun.

      | Jenis | Motif | Perilaku | Sikap |
      |------|------|------|------|
      | Bertipe pengalihan keuntungan | Tokoh antagonis tak mau menanggung harganya sendiri | Merampas, memerintah, memaksa tokoh utama | Merasa sudah semestinya, congkak dan tinggi hati |
      | Bertipe pelemparan kerugian | Tokoh antagonis melimpahkan hukuman yang mestinya ia terima kepada tokoh utama | Mengancam dan membujuk, menyusun jebakan, memaksa jadi kambing hitam | Tersembunyi, keji |
      | Bertipe berhadapan langsung | Tatanan tempat tokoh antagonis berada dipatahkan tokoh utama | Menjebak, memperhitungkan, mencederai | Tak memberi jalan hidup |

      1. Sebisa mungkin jangan menekan; ganti "tokoh utama benar-benar dianiaya" dengan "orang lain menyangkal, tokoh utama menampar balik".
      2. Buat penyangkalan tidak langsung; cemoohan di depan muka diubah menjadi gerak batin atau gunjingan di belakang.
      3. Alasan penyangkalan harus wajar dan berdasar, bertumpu pada informasi yang tersedia saat itu.
      4. Tokoh yang menyangkal harus beragam; posisi yang berbeda memakai cara yang berbeda.
      5. Tekan sedikit saja, dan hanya pada puncak volume.

      ## Kualitas dan pelapisan penonton

      | Lapisan | Sasaran | Ciri |
      |------|------|------|
      | Kualitas rendah | Pemain latar, tukang serabutan, pemagang | Murni reaksi emosi, tanpa kelanjutan |
      | Kualitas sedang | Praktisi yang paham bidangnya, tangan kanan | Mampu membandingkan secara profesional, ada perubahan sikap |
      | Kualitas tinggi | Setingkat sutradara, puncak industri | Reaksinya disertai penyingkapan informasi, kemajuan hubungan, dan ekspektasi |

      | Dimensi | Prinsip |
      |------|------|
      | Ragam tokoh | Beragam jenis tokoh lebih baik daripada satu jenis, tiap jenis memunculkan reaksi berbeda |
      | Jumlah tokoh | Banyak orang lebih baik daripada sedikit orang, pilih situasi yang memungkinkan banyak orang tampil |
      | Tingkatan tokoh | Banyak tingkatan lebih baik daripada satu tingkatan; orang biasa, sesama praktisi, ahli, dan tokoh antagonis masing-masing bereaksi |
      | Kedalaman hubungan | Orang yang dikenal lebih baik daripada orang tak dikenal; keterkejutan orang dekat jauh lebih memuaskan daripada keterkejutan orang tak dikenal |

      ## Daftar periksa pembedahan naskah

      1. Apa jenis pengaitnya?
      2. Pengait muncul pada kalimat keberapa atau kata keberapa?
      3. Berapa kekuatan pengaitnya (1-10)?
      4. Apakah pengait ditunaikan pada posisi yang wajar?
      5. Apakah jarak antara pembangunan landasan dan penunaian sudah pas?
      6. Apakah ada pengait yang tak tertunaikan atau dibiarkan menggantung?

      ## Tambahan prinsip penggunaan tingkat paragraf

      Kesenjangan informasi, hitungan mundur, titik balik, kartu tertutup, tamparan balik, harga, yang lemah, arwah yang mengamati, benda ganjil, kepatuhan berpura-pura, dan penemuan dingin bisa membentuk penanjakan di dalam satu paragraf yang sama, tetapi harus jelas mana pengait utama dan mana pengait pendukung. Pengait utama sebaiknya muncul di posisi yang paling mudah dikenali pembaca, sedangkan pengait pendukung bertugas menambah tekanan atau menunda penunaian.

      Saat merancang, catat butir demi butir: jenis pengait, posisi kemunculan, kekuatan (1-10), posisi penunaian, jarak antara landasan dan penunaian, serta ada tidaknya risiko tak tertunaikan. Kartu tertutup pada naskah pendek biasanya tidak melewati 30% panjang naskah, hitungan mundur wajib sampai jatuh tempo, harga wajib nyata, dan arwah yang mengamati wajib mematuhi batasan hanya boleh mengamati dan tidak boleh bertindak.

