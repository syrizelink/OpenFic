name: Pemeriksaan kata terlarang dan frasa klise novel daring
summary: Memeriksa secara lengkap frasa klise AI berfrekuensi tinggi, nada menjelaskan, hiasan kosong, klasifikasi kiasan, dan tanda baca tanpa fungsi, lalu memberi arah penggantian yang konservatif.
is_enabled: true
content: |
  # Tabel kata dan pola kalimat terlarang beraroma AI

  Skill ini hanya menemukan masalah, tidak langsung menulis ulang seluruh teks. Daftar kata adalah peringatan risiko, bukan daftar larangan mekanis. Satu kata yang lazim dipakai harus dinilai bersama kerapatan pengulangan, fungsi dalam konteks, garis suara genre, dan gaya bicara tokoh. Sesi ini memindai per bagian secara manual dan mengeluarkan lokasi kena, penilaian fungsi, serta arah penggantian.

  ## Pola kalimat terlarang paling beracun (muncul berarti langsung diperbaiki, prioritas tertinggi)

  Pola kalimat AI paling beracun dalam novel daring; sekali penulis terbiasa, pola itu akan muncul berulang-ulang. Pemindaian pertama Gate A wajib menangkapnya:

  | Tingkat racun | Pola kalimat | Contoh salah | Cara perbaikan |
  |------|------|--------|------|
  | ***** | "bukan A, melainkan B" / "bukan A, bukan B, melainkan C" (kata "melainkan" boleh dihilangkan, dihilangkan pun tetap terhitung kena) | "Dia bukan dingin, melainkan putus asa" | Tulis langsung B atau pakai ungkapan yang lebih wajar |
  | **** | ", dengan disertai ..." sebagai keterangan serbaguna | "Dia tersenyum sekejap, dengan disertai setitik cemooh yang sukar terlihat" | Pecah jadi kalimat pendek atau ganti dengan tindakan |
  | **** | Garis suara tanpa emosi: "suaranya tidak keras, tetapi mengandung ..." / "nadanya sama sekali tanpa riak" / "tenang tanpa riak" / "suaranya datar/rata/tak terdengar emosinya" | "Suaranya tidak keras, tetapi mengandung kekuatan yang tak terbantahkan" | Tulis langsung isi dialog, ciri suara, atau tindakan |
  | **** | "dia tahu ..." | "Dia tahu semuanya sudah terlambat" | Tunjukkan pemahaman melalui perilaku |
  | *** | "seolah-olah/seperti/bagaikan ... layaknya" | "Seolah-olah bisa menembus segalanya layaknya begitu" | Hapus atau tulis apa adanya |
  | *** | "sekilas ... berkelebat di matanya" / "seulas ... tersungging di sudut bibirnya" | "Sekilas kesedihan berkelebat di matanya" | Dia menundukkan pandangan / sudut bibirnya tersentak |
  | *** | "segumpal ... membuncah di hatinya" / "hatinya tergetar" | "Segumpal kehangatan membuncah di hatinya" | Pakai reaksi tubuh |
  | *** | Penutupan abstrak soal takdir atau awal baru: "takdir ... papan catur/taring" / "pada saat ini akhirnya ia mengerti" / "serangan balasnya baru saja dimulai" | "Takdir akhirnya menampakkan taringnya; serangan balas yang menjadi miliknya baru saja dimulai" | Kembali ke dokumen, tindakan, dialog, atau akibat fisik yang terlihat oleh tokoh saat itu |
  | ** | Pratinjau di akhir bab "yang tidak dia ketahui adalah ..." | "Yang tidak dia ketahui adalah, badai yang lebih besar segera datang" | Tutup dengan benda atau peristiwa pengait yang konkret, hindari pratinjau kosong |

  > Satu saja yang kena tingkat ***** dianggap bukti kuat aroma AI berat; kalau tingkat **** kena >=2 tempat, pemindaian ulang tingkat sedang langsung dipicu.

  **Tanda baca**: isi utama (termasuk narasi dan dialog) melarang tanda pisah panjang `——`/`—`, tanda hubung ganda `--`, dan elipsis jeda `…`; gantilah dengan titik, koma, kalimat pendek, atau pemenggalan lewat tindakan; tidak ada pengecualian tanda pisah untuk dialog. Tanda kutip sudut gaya Yanyan (corner bracket, U+300C dan U+300D) tidak termasuk dalam daftar ini.

  ## Kata terlarang tingkat satu (muncul berarti diganti)

  ### Kelompok modalitas
  seolah-olah, seperti, bagaikan, sebagaimana, setitik, seulas, sedikit banyak, beberapa kadar, samar-samar, tanpa tanda apa pun, nyaris tak terdengar, nyaris tak terlihat

  ### Kelompok tindakan
  menarik napas dalam-dalam, perlahan-lahan, tak kuasa, sedikit, dengan lembut, dengan datar

  ### Kelompok ekspresi
  berkelebat di matanya, sudut bibirnya melengkung, dahinya berkerut sedikit, matanya menunduk redup, pupilnya menyempit sedikit, pupilnya mengerut, pupilnya mengecil, sendi jarinya memutih, tatapannya tajam, pandangannya tajam

  ### Kelompok kejiwaan
  hatinya bergerak, hatinya tergetar, dalam hatinya ia langsung paham, dalam hatinya ia berkata, dari dasar hatinya muncul, tak tertahankan, hatinya bergidik

  ### Kelompok penilaian
  tak terbantahkan, tak boleh dibantah, sukar terlihat, jelas terlihat, tanpa keraguan, tak dapat disangkal, belum pernah ada sebelumnya

  ### Kelompok kata sifat
  teguh, berkilau memancarkan cahaya, licik, mendalam, menusuk dingin, dingin membeku

  ### Kelompok transisi
  tanpa sadar, tak dapat menahan diri, dengan sendirinya, mengalihkan arah bicara

  ## Kata terlarang tingkat dua (diganti kalau muncul terlalu sering)

  ### Kata sensitif konteks (ditangani hanya kalau frekuensinya tinggi atau dipakai sebagai jalan pintas)

  tiba-tiba, mendadak, sekonyong-konyong, seketika, sepertinya, kelihatannya, dalam sekejap, dengan sentakan, kuat-kuat (boleh dipertahankan pada ucapan tokoh, kejadian mendadak yang nyata, pemadatan waktu, atau saat sudut pandang memang tidak pasti; memutar-mutar sinonim untuk mengelabui pengulangan tidak dihitung pengecualian, kerapatannya dihitung sebagai satu kata yang sama)

  ### Nada tulisan formal -> ragam lisan

  | Nada tulisan formal | Penggantian ragam lisan |
  |--------|-----------|
  | runtuh berkeping | hilang / bubar / habis |
  | amarah tanpa nama | gelisah |
  | menusukkan belati ke hatiku | pikiranku kacau |

  ### Pola kalimat penyimpulan
  - "akhirnya dia mengerti ..."
  - "baru saat itu dia menyadari ..."
  - "pada saat ini, dia akhirnya mengerti/menyadari ..."
  - "mulai dari saat ini ..."
  - "serangan balas/pembalasan/kisah yang menjadi milik X baru saja dimulai"
  - "takdir/suratan + roda gigi/papan catur/taring/ditulis ulang/pengaturan"
  - "saat ini, dia ..."
  - "segalanya ... semua ..."
  - "ternyata ..."

  ### Pola kalimat paralel
  - Paralelisme tiga kalimat atau lebih dengan struktur yang sama secara berurutan
  - "ada yang ... ada yang ... ada yang ..."
  - "sambil ... sambil ... sambil ..."

  ### Pola kalimat pemuliaan
  - "pada saat ini ..."
  - "dia tahu ..."
  - "dia paham ..."
  - "inilah ..."

  ## Templat pola kalimat terlarang

  | Pola kalimat | Contoh | Masalah |
  |------|------|------|
  | "bukan A, melainkan B" | "Dia bukan dingin, melainkan putus asa" | Paling beracun; tulis langsung B |
  | "..., dengan disertai ..." | "Dia berkata, dengan disertai setitik keputusasaan" | Keterangan serbaguna |
  | "suaranya tidak keras, tetapi mengandung ..." | "Suaranya tidak keras, tetapi mengandung kekuatan yang tak terbantahkan" | Deskripsi suara favorit AI |
  | "seolah-olah bisa ... layaknya begitu" | "Seolah-olah bisa menembus segalanya layaknya begitu" | Nada sastra kuno |
  | Kerapatan label dialog terlalu tinggi atau label berpola rumus | "Baik, katanya" | Kata "kata" biasa boleh dipertahankan; tangani kalau frekuensinya tinggi atau berpola rumus |
  | "dia merasakan ..." | "Dia merasakan setitik kehilangan" | Memberi tahu, bukan menunjukkan |
  | "dia menyadari ..." | "Dia menyadari ada yang tidak benar" | Langsung memberitahukan |
  | "sekilas XX berkelebat di matanya" | "Sekilas kesedihan berkelebat di matanya" | Sudah jadi templat |
  | "seulas XX tersungging di sudut bibirnya" | "Seulas senyum dingin tersungging di sudut bibirnya" | Sudah jadi templat |
  | "segumpal XX membuncah di hatinya" | "Segumpal kehangatan membuncah di hatinya" | Sudah jadi templat |
  | "yang menggantikannya adalah" | "Senyumnya hilang, yang menggantikannya adalah dingin" | Templat transisi AI; tulis langsung keadaan barunya |
  | "disepuh X / mengandung sepuhan X" | "Matanya disepuh racun" | Pola sinestesia AI; tulis tindakan atau dialog |
  | "tampak (agak) X" | "Dia tampak agak bersemangat" | Memberi tahu, bukan menunjukkan |
  | "suatu tempat di dasar hati / di dalam hati + melunak" | "Suatu tempat di dalam hatinya melunak tak berbentuk" | Kalimat klise roman; tulis tindakan |
  | "(seluruh tubuhnya) memancarkan aura X" | "Seluruh tubuhnya memancarkan aura jangan-dekati-aku" | Deskripsi aura serbaguna; tulis reaksi orang di sekitarnya |
  | "takdir/suratan + roda gigi/papan catur/taring/ditulis ulang/pengaturan" | "Takdir akhirnya menampakkan taringnya" / "papan catur yang sudah lama ditata" | Simpulan abstrak dari penulis; ubah menjadi dokumen, tindakan, dialog, atau akibat fisik yang ditemui tokoh saat itu |
  | "pada saat ini akhirnya mengerti / mulai dari saat ini / baru saja dimulai" | "Pada saat ini, dia akhirnya mengerti" / "serangan balasnya baru saja dimulai" | Nada penutup AI; hapus simpulannya, tutup dengan tindakan atau masalah yang belum selesai |

  ## Klasifikasi kiasan (secara baku ditelaah ulang, bukan dihapus semua secara baku)

  Kiasan dengan "seperti/bagai/seolah-olah/bagaikan/laksana" tidak semuanya beraroma AI. Yang benar-benar berisiko tinggi adalah: menumpuk berderet-deret, memakai kiasan sastra serbaguna, memakai kiasan indah sebagai pengganti laju alur cerita, atau menyimpulkan makna untuk pembaca di akhir bagian. Tabel ini dipakai untuk mengenali jenis kiasan yang perlu ditelaah ulang:

  | Kategori kiasan | Contoh | Penanganan |
  |---------|----|------|
  | Keseharian / khas tokoh | "seperti anjing liar yang dibuang" | Kalau menempel pada sudut pandang tokoh dan mampu menyampaikan informasi atau emosi, boleh dipertahankan |
  | Benda / gejala | "seperti sebilah belati" "wajahnya pucat seperti salju yang memenuhi langit" | Kiasan fungsional biasa boleh tinggal; kalau sudah jadi templat atau berulang, ubah menjadi deskripsi apa adanya |
  | Keadaan (klise usang) | "menangis seindah bunga tersiram hujan" "sejuk bagai disapa angin musim semi" | Utamakan dihapus atau diubah menjadi tindakan/ekspresi yang konkret |
  | Abstrak | "seperti roda gigi takdir" "seperti debu dari kehidupan sebelumnya" | Risiko tinggi, utamakan dijatuhkan kembali ke tindakan, benda, suara, dan akibat |
  | Andaian | "tenaganya begitu besar seolah hendak meremukkan tulang" | Kalau memang persepsi tubuh tokoh boleh tinggal; kalau menumpuk berlebihan, ubah menjadi akibat faktual |

  Prinsip penanganan: lihat fungsinya dulu, baru kerapatannya. Pertahankan satu atau dua yang paling mampu menyampaikan informasi atau emosi, sisanya ubah menjadi deskripsi langsung, kata kerja, kata benda, kegunaan, hasil, atau fakta; jangan mengganti kiasan yang dihapus dengan sekumpulan kiasan baru. Contoh: "wajahnya pucat seperti salju yang memenuhi langit" kalau hanya frasa klise -> "wajahnya pucat"; kalau pemandangan salju memang sedang menekan tokoh, boleh dipertahankan atau diubah menjadi gambaran konkret yang dilihat tokoh saat itu.

  > `metaphor-density-tic` bersifat advisory: ia mengingatkan untuk menelaah ulang secara menyeluruh, bukan blocking; kiasan yang membumi, khas tokoh, dan tunggal serta punya fungsi boleh dipertahankan.

  ## Rujukan cepat strategi penggantian

  | Jenis teks asal | Metode penggantian | Contoh |
  |----------|----------|------|
  | Kata emosi abstrak | Tindakan konkret | "gugup" -> "tangannya gemetar" |
  | "merasakan XX" | Pengeksternalan | "merasa marah" -> "mengepalkan tangan" |
  | Tumpukan kata sifat | Deskripsi apa adanya | "senyum yang cantik memikat" -> "dia tersenyum" |
  | Ungkapan tulisan formal | Ragam lisan | "tak terbantahkan" -> "memang begitu" |
  | Deskripsi yang menjelaskan | Ruang kosong | "karena takut dia ..." -> "dia melangkah mundur" |
  | Paralelisme berurutan | Pertahankan satu yang terkuat | Dari tiga kalimat paralel sisakan satu |
  | Kalimat simpulan pemuliaan | Hapus langsung | "Pada saat ini, dia akhirnya mengerti ..." -> hapus |
  | "bukan A, melainkan B" | Tulis langsung B atau ungkapan yang lebih wajar | "Dia bukan dingin, melainkan putus asa" -> tulis langsung B |
  | Hiasan berlebih (kata sifat/atribut/kata bilangan/kata tunjuk) | Hapus | "pil berwarna putih" -> "pil"; "potongan rantai di tangannya itu" -> "rantai"; "mobil yang melaju kencang" -> "mobil" |

  **Penggantian tidak boleh didaur ulang**: kolom kanan adalah contoh arah, bukan jawaban baku. Kalau satu kata terlarang kena beberapa kali dalam satu bab, berikan penulisan konkret yang berbeda di setiap tempat; kalau satu bentuk penggantian muncul berulang-ulang (setiap kali "menundukkan pandangan", setiap tindakan ditambahi "sejenak"), hasil penggantian itu sendiri menjadi sidik jari templat yang baru.

  **Kerapatan frasa klise ditangani lebih dulu**: kalau frasa klise menggumpal berderet menjadi nada templat, urutan penanganannya bukan penggantian sinonim, melainkan hapus dulu simpulan abstraknya, lalu jatuhkan emosi/penilaian ke tindakan, benda, dialog, dan akibat konkret yang terlihat oleh tokoh saat itu.

  ## Alur lengkap

  1. Tandai per bagian frasa klise berfrekuensi tinggi, kiasan serbaguna, simpulan penulis, nada menjelaskan, pemberitahuan kejiwaan yang berlebihan, kata sambung bergaya makalah, rantai tindakan mekanis, dan tanda baca tanpa fungsi.
  2. Catat kalimat aslinya, jenis yang kena, lokasi pengulangan, serta apakah bagian itu memikul fungsi alur cerita/kausalitas/tokoh/irama.
  3. Pengulangan yang berfungsi, garis suara tetap, istilah genre, nama khusus, dan isi kutipan ditandai sebagai dipertahankan atau menunggu telaah ulang.
  4. Simpulan tanpa fungsi dihapus; ungkapan abstrak yang berfungsi diutamakan diubah menjadi tindakan konkret, benda di dalam adegan, dialog, fakta, atau akibat di tempat.
  5. Jangan mengganti sinonim secara mekanis, dan jangan memakai salah tulis yang disengaja, tanda baca acak, atau kata lisan tanpa makna untuk memalsukan "rasa manusia".
  6. Saat hanya memeriksa, jangan mengubah teks aslinya; kalau pengguna meminta revisi, serahkan hasilnya kepada "revisi penghapusan templat novel daring".

  ## Format keluaran

  - Risiko keseluruhan: rendah / sedang / tinggi
  - Daftar masalah:
    - Lokasi:
    - Jenis:
    - Kalimat asal:
    - Kata atau pola kalimat yang kena:
    - Apakah memikul fungsi alur cerita:
    - Tindakan yang disarankan: pertahankan / hapus / ubah menjadi ungkapan konkret / menunggu telaah ulang
  - Istilah, garis suara, dan ungkapan tetap yang wajib dilindungi:
  - Kerapatan dan cakupan pengulangan:

references:
  - name: Daftar kata terlarang lengkap
    content: |
      Isi utama Skill ini sudah memuat lengkap pola kalimat terlarang paling beracun, kata terlarang tingkat satu dan tingkat dua, pola kalimat penyimpulan/paralel/pemuliaan, templat terlarang, klasifikasi kiasan, strategi penggantian, pengecualian, dan alur pemeriksaan manual. Saat memeriksa, wajib mempertimbangkan konteks, dan jangan menganggap kata yang lazim dipakai sebagai kesalahan secara mekanis.
