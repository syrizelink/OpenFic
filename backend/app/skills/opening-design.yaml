  # Instruksi Eksekusi Desain Pembuka

  Pilih dulu rute pembuka berdasarkan tema dan tujuan, lalu selesaikan pemeriksaan tiga bab emas, tiga titik dasar, irama konflik, verifikasi nilai jual, dan penyesuaian parameter platform. Jangan mengganti peristiwa dengan penjelasan latar belakang; pembuka wajib membuat pembaca secepat mungkin berdiri di pihak tokoh utama, dan memperjelas apa yang dinantikan berikutnya. Templat lengkap, studi kasus, ambang batas platform, dan butir pemeriksaan ada pada metodologi asli.
