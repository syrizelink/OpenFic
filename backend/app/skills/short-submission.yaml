content: |
  # Paradigma pengiriman: nada dasar platform, paragraf pembuka, titik berbayar

  Karya pendek ditulis untuk dikirim dan diterima, bukan sekadar selesai ditulis. Metodologi ini mengurus tiga hal di lapisan pengiriman: menetapkan nada dasar menurut platform, menggarap paragraf pembuka secara terpisah, dan menempatkan titik berbayar tepat di titik pemotongan. Jurus khas genre tetap mengikuti bahan genre yang diberikan pengguna; dokumen ini hanya menumpuk satu lapisan tambahan, yaitu "bagaimana menulis agar karya kiriman diterima". Sesi ini dijalankan manual, tanpa memanggil jaringan, tanpa menulis ke direktori proyek, dan tanpa bergantung pada Agent eksternal.

  ## 1. Tetapkan nada dasar platform lebih dulu

  Sebelum mulai menulis, pastikan dulu platform tujuan pengiriman; sudut pandang isi utama, kadar ketajaman konflik, pengait akhir bab, dan tekstur akhir cerita ikut berganti mengikutinya. Tiga nada dasar arus utama:

  | Platform | Sudut pandang | Perkembangan konflik | Pengait akhir bab | Tekstur akhir cerita |
  |---|---|---|---|---|
  | Zhihu Yanxuan | Orang pertama yang membenamkan pembaca, masuk lewat rasa ganjil dari hal sehari-hari ("ada sehelai rambut merah di kursi depan mobil suamiku") | Perang psikologis, selisih informasi, menyusun kepingan detail hingga terasa "makin dipikir makin mengerikan", emosi dikupas lapis demi lapis | Menemukan satu detail meledak yang menjungkirkan pemahaman atas teks sebelumnya, misterinya tertahan tetapi dayanya panjang | Pembalikan ekstrem / karma berputar / penutupan cerdas, banyak ruang kosong, mengutamakan gema yang tertinggal |
  | Mini program | Sudut pandang mahatahu atau orang pertama beremosi kuat, dibuka langsung di neraka | Konflik dieksternalkan seluruhnya ke dialog dan tindakan, berjalan dalam putaran cepat "dihina -> membuka kartu -> menampar di depan umum -> merampas keuntungan nyata" | Titik potong yang mencekik leher (tamparan hampir jatuh, perjanjian baru dirobek separuh, ucapan berhenti di tengah) | Rasa pemuas yang lugas dan kasar, tokoh antagonis membayar harga nyata (bangkrut/dipenjara/ditinggalkan semua orang), tokoh utama duduk tinggi tanpa penyesalan |
  | Karya pendek Fanqie | Orang pertama/ketiga yang lancar, tujuan jelas, anugerah emas lugas | Mulus tanpa titik beracun, provokasi tokoh antagonis dalam satu dua bagian berubah menjadi pijakan bagi tokoh utama untuk naik kelas atau kaya | Membuka peta baru / mendapat kartu pamungkas baru / tokoh baru hadir membawa sumber daya | Bulat dan menyenangkan, karier dan cinta dua-duanya panen, orang jahat dihukum |

  - Mini program paling banyak menerima kiriman, dan cerita pemuas bertema menampar wajah adalah lapak utamanya; satu ide cerita yang sama bisa dijalankan masing-masing satu versi untuk Zhihu/mini program/Fanqie, lalu kirim yang paling lancar.
  - Nada dasar hanya menyetel "suara dan titik jatuh", tidak menimpa jurus khas genre dan tujuan emosi karya ini. Nada dasar adalah suara saluran penayangan, dan itu sumbu yang berbeda dari templat tata letak pada "format isi utama karya pendek": naskah bernada mini program pun tata letaknya tetap memilih satu templat aplikasi menurut format isi utama.
  - **Menyetel nada dasar bukan berarti melonggarkan garis batas anti-AI**: emosi kuat dijatuhkan lewat tindakan dan dialog yang konkret, jangan memaksa memecah ucapan menjadi serakan potongan tiga kata yang dijejer berderet; latar belakang kejadian sebelumnya dimunculkan lewat adegan, jangan menyisipkan satu blok penuh menjadi buku petunjuk "asal-usul perkara"; pola kalimat berpasangan ("di kehidupan lalu ... di kehidupan ini ...") jangan didaur ulang terlalu sering. Penghapusan aroma AI tetap mengikuti aturan penghapusan templat yang lengkap.

  ## 2. Paragraf pembuka (wajah kiriman, digarap terpisah)

  Paragraf pembuka adalah pancingan di bagian paling depan isi utama, dan juga hal pertama yang dilihat editor. Editor menelaah ratusan naskah sehari, **kalau paragraf pembukanya lemah, sebagus apa pun isi utamanya tetap tersingkir dalam sekali pandang**. Karena itu paragraf pembuka harus digarap sebagai satu karya tersendiri, jangan berharap editor mau membaca ke bawah.

  - **Panjang dan bentuk**: sekitar 150-220 kata (kalau paket genre menulis 150-300, kencangkan ke angka ini saat mengirim), yaitu beberapa paragraf pertama isi utama. Satu kalimat satu paragraf berarti setiap kalimat utuh berdiri sebagai paragraf sendiri, bukan memecah satu kalimat menjadi serakan potongan tiga kata; ini bentuk paragraf pembuka gaya Heiyan/Yanyan, sedangkan paragraf pembuka Fanqie cukup memakai jalinan paragraf pendek platform tersebut sesuai "format isi utama karya pendek". Setelah paragraf pembuka selesai, langsung bersambung ke isi utama (isinya memang awal bab pertama, tidak ditulis ulang).
  - **Kerangka empat dimensi**: sebab awal (sumber tragedi atau pembukaan absurd) + konflik inti (keadaan terjepit karena ditatap, diperah, atau diperhitungkan) + warna dasar penokohan (sadar, punya kartu pamungkas, bukan sekadar nestapa) + pembalikan emosi (pengait ditahan di separuh kalimat terakhir, berhenti mendadak).
  - **Triangel emas**: satu benda konkret yang berdaya hentak (hasil USG yang dirobek, perjanjian penitipan nama, kamera tua berdebu) + satu selisih informasi (kartu pamungkas yang disembunyikan tokoh utama, pembaca tahu, pelaku tidak tahu) + satu pengait fatal yang menyisakan ruang kosong.
  - **Sisi sebaliknya**: jangan memakai paragraf pembuka untuk memaparkan latar belakang secara datar atau melamunkan perasaan; jangan membuka semua kartu pamungkas (sisakan untuk dituntaskan di isi utama); jangan hanya menulis nestapanya tanpa menulis bahwa "dia punya langkah simpanan".

  ## 3. Titik berbayar (struktur pengiriman)

  Karya pendek dikirim dengan susunan "baca percobaan gratis + titik berbayar + isi utama berbayar" (kata "bab" dalam konteks pengiriman sama dengan "bagian" dalam Skill ini). Titik berbayar adalah batas antara bagian gratis dan bagian berbayar; kalau ditempatkan salah pembaca tidak membayar, kalau tepat konversinya tinggi.

  - **Posisi titik potong**: titik berbayar ditahan pada satu titik potong yang mencekik leher di akhir bab, yaitu satu momen pembalikan atau duel yang segera terkuak dan hanya bisa dilihat pembaca setelah membayar (uji DNA yang baru dirobek separuh, kartu pamungkas yang baru hendak dihantam ke meja, nama yang baru terucap separuh). Jangan melepas seluruh titik pemuas besar yang inti di bagian gratis.
  - **Kerapatan titik alur cerita**: sebelum titik berbayar, setiap bab memuat 2-3 titik alur cerita (cepat menegakkan situasi, menanam pengait, menaikkan tekanan lapis demi lapis); setelah titik berbayar, setiap bab memuat 1-2 titik lebih banyak daripada sebelumnya (memusatkan penuntasan tamparan/pembalikan/titik pemuas). Titik alur cerita ditambah secukupnya, terlalu banyak akan membuat kacau.
  - **Menyusun kerangka rinci dengan penalaran balik**: tetapkan dulu titik berbayar ditahan di akhir bab bagian keberapa, pikirkan tuntas dulu alur cerita bagian itu (misalnya pembalasan bernada siksa-pemuas: beberapa bagian awal emosinya makin menyiksa secara bertahap, lalu akhir bab pada bagian titik berbayar mengisyaratkan serangan balas), lalu tarik balik untuk menata "konflik emosi yang bertahap menaik" di bagian-bagian sebelumnya, dan terakhir susun bagian penuntasan setelah titik berbayar.
  - **Bentuk karya jadi siap kirim**: judul + paragraf pembuka (jangan menuliskan kata "paragraf pembuka", cukup sisakan beberapa kalimat itu) + isi utama yang dibagi menjadi bagian bernomor (termasuk titik potong berbayar). Rentang yang disarankan untuk pengiriman lebih rapat daripada kerangka umum (8000-20000): keseluruhan sekitar 8000-12000 kata, setiap bab sekitar 1000-1300 kata, jumlah bab sekitar 7-12 bab.

  ## 4. Tabel penuntasan nada dasar pengiriman

  | Nada dasar | Tugas bagian awal | Tugas bagian akhir | Penutup |
  |---|---|---|---|
  | Siksa | Membangun ikatan dan luka yang tidak adil | Pemulihan, kehilangan kesempatan, atau nyeri tumpul yang senyap | Tindakan konkret, titik jatuh emosinya kuat |
  | Pemuas | Penindasan, salah nilai, kartu tersembunyi tokoh utama | Bukti, serangan balas, tamparan, dan peningkatan | Menuntaskan rasa pemuas inti dan menyisakan gema |
  | Manis | Membangun hubungan dan interaksi yang khas | Dituntaskan lewat perhatian, pilihan, dan janji yang konkret | Jangan ditutup dengan "aku mencintaimu" yang kosong |
  | Misteri | Kejanggalan, pertanyaan, selisih informasi | Menarik kembali petunjuk dan mengubah pemahaman | Setelah kebenaran, sisakan riak baru |
  | Penyembuhan | Menyingkap kelemahan dan kebuntuan | Hubungan, tindakan, atau pemahaman menghasilkan pemulihan | Sisakan detail yang tenang |

  ## 5. Kerangka paragraf pembuka

  ```
  {waktu/adegan konkret}, {tokoh utama} karena {sebab awal} terpaksa menghadapi {konflik inti}.
  Ia sebenarnya {warna dasar penokohan atau tujuan yang bisa dipahami pembaca}, tetapi menemukan {selisih informasi/fakta yang janggal}.
  {Tinggalkan satu tindakan, pilihan, atau kebenaran yang belum tuntas, jangan bocorkan akhir ceritanya.}
  ```

  Paragraf pembuka wajib punya peristiwa, keadaan terjepit, dan selisih informasi yang bisa dipahami; hindari tumpukan label genre, hiperbol kosong, penilaian diri penulis, pembocoran seluruh hasil, dan nada yang tidak sejalan dengan isi utama.

  ## 6. Aturan titik potong berbayar

  - Sebelum titik potong: bangun tokoh, konflik inti, alasan untuk terus membaca, dan petunjuk yang diperlukan; setidaknya buat pembaca tahu apa masalahnya, mengapa ia harus peduli, dan siapa yang mungkin mengubah keadaan.
  - Posisi titik potong: saat tindakan hampir selesai, bukti hampir terungkap, kebenaran hampir terbalik, hubungan hampir didefinisikan ulang, atau pilihan hampir diambil; sebelum titik potong wajib ada persiapan dan pemanasan.
  - Setelah titik potong: tidak boleh mengulang prosedur bagian sebelumnya, wajib menambah informasi, emosi, serangan balas, pembalikan, konsekuensi pilihan, atau gema.
  - Dilarang: tokoh baru yang tak relevan, latar baru, kesalahpahaman yang dipaksakan, pemotongan tanpa persiapan sama sekali, dan berpura-pura menyisakan gema dengan mengandalkan masalah yang belum ditangani.
  - Penutup: tuntaskan emosi inti garis utama; genre misteri boleh menyisakan pertanyaan baru, tetapi tidak boleh menyisakan masalah lama yang seharusnya ditangani karya ini.

  ## 7. Penerimaan karya jadi siap kirim

  - [ ] Paragraf pembuka punya peristiwa konkret, keadaan tokoh utama, konflik inti, dan selisih informasi, tanpa pengantar genre yang umum.
  - [ ] Nada dasar pengiriman sejalan dengan peristiwa isi utama, pilihan tokoh, dan emosi penutup.
  - [ ] Pembukaannya mencengkeram secara mandiri, dan bagian awal sudah membangun alasan untuk terus membaca.
  - [ ] Titik potong ditahan pada tindakan, bukti, kebenaran, atau perubahan hubungan yang belum tuntas, dan fungsi dua bagian sebelum serta sesudahnya berbeda.
  - [ ] Setelah titik potong ada tambahan informasi atau penuntasan emosi, tanpa tokoh tak relevan dan kesalahpahaman yang dipaksakan.
  - [ ] Penutup menuntaskan emosi garis utama karya ini, dan jatuh secara konkret pada tindakan, dialog, atau gambaran.
  - [ ] Isi utama tidak memuat keterangan proses, meta-informasi internal platform, placeholder, dan masalah lama yang belum ditangani.

  ## 8. Format isi utama karya pendek: penanda bab

  Seluruh naskah memakai satu jenis saja, tidak dicampur.

  | Format | Platform yang sesuai | Contoh |
  |------|----------|------|
  | `###1.` | Baku untuk karya pendek | `###1.` `###2.` `###3.` |
  | `###Bab N` | Fanqie / Qimao / latar kuno | `###Bab Satu` `###Bab Dua` |
  | `1.` (angka murni, tanpa `###`) | Zhihu Yanyan | `1.` `2.` `3.` |

  Untuk karya pendek disarankan `###1.` atau angka murni, karena ringkas. Bab yang agak panjang di lini Fanqie memakai `###Bab N`.

  ## 9. Format isi utama karya pendek: dua templat platform

  Bentuk isi utama karya pendek dibagi menjadi dua templat menurut platform. **Tidak ada garis keras terpadu berupa "setiap paragraf maksimal 3 kalimat" atau "800-1500 kata per bagian"**, karena itu produk pindahan dari karya panjang dan akan memotong karya pendek menjadi kerangka yang panjangnya seragam. Kenali warna dasar platform lebih dulu, baru bagikan jumlah kata menurut prinsip rapat-renggang.

  ### Heiyan: satu kalimat satu paragraf, ruang kosong untuk bacaan cepat

  - Satu kalimat satu paragraf sebagai pola utama, banyak ganti baris untuk menciptakan rasa terjatuh dan jeda.
  - Iramanya rapat, volume tiap bagian kecil, dan akhir bagian wajib menyisakan pengait.
  - Satu kalimat berdiri sebagai paragraf adalah hal yang lazim; jangan mengelas kalimat pendek kembali menjadi paragraf panjang hanya demi "mengumpulkan cukup jumlah kata".

  Gambaran templat:

  ```
  ###1.

  Dia menyerahkan sebuah dokumen.

  Itu perjanjian perceraian.

  Aku tersenyum.

  "Setelah kau tanda tangan, kau bebas."
  ```

  ### Fanqie / Qimao: paragraf pendek sebagai warna dasar, narasi berjalin dengan dialog

  - Paragraf pendek tetap menjadi warna dasar pembacaan di ponsel, tetapi **paragraf narasi kilas balik bermultikalimat dan jalinan dengan dialog diperbolehkan**: dalam satu paragraf bisa ada monolog batin, kilas balik yang menusuk lagi, dan tindakan, lalu bersambung ke dialog.
  - Genre latar kuno / kehidupan sosial boleh menulis paragraf narasi yang lebih panjang, yang memikul rantai emosi utuh dan penataan adegan.
  - Titik pemuas, tamparan, dan pembalikan dipadatkan menjadi pendek (boleh satu kalimat satu paragraf); adegan transisi dan penyampaian informasi cukup dilewati satu kalimat.

  Gambaran templat:

  ```
  ###Bab Satu

  Waktu aku mengantar sup hangat ke depannya, dia sedang menunduk menatap ponsel, layarnya menyala menampilkan nama perempuan idamannya. Tiga tahun sudah, kukira aku telah melewati hari-hari tersulit, ternyata yang kutahan hanyalah diriku sendiri.

  "Nanti hal seperti ini tidak perlu kau kerjakan." Dia bahkan tidak mengangkat kepala, "Dia tidak suka bau asap masakan."

  Tanganku yang memegang mangkuk berhenti sejenak.
  ```

  ### Batasan keras yang berlaku untuk kedua templat (semua platform)

  - Antara dua paragraf isi utama yang berdampingan **hanya diizinkan satu karakter ganti baris `\n`**, tidak boleh ada baris kosong atau ganti baris berturut-turut `\n\n` (susunan rapat). Sebelum dan sesudah penanda bab dihitung terpisah.
  - **Tanpa indentasi**: jangan memakai spasi lebar ideografis (ideographic space U+3000) atau spasi biasa sebagai indentasi, karena perender platform menanganinya sendiri.
  - **Larangan Markdown pada paragraf isi utama**: selain penanda bagian / bab yang terpadu (seperti `###1.`), paragraf isi utama tidak memakai penebalan `**`, miring `*`, judul `#`, garis pemisah `---`, dan sejenisnya.
  - Panjang dan pendek berselang-seling, jangan seragam sepanjang naskah. Memotong setiap paragraf menjadi jumlah kata yang sama justru sumber nada AI.

  ## 10. Dialog

  ### Tanda kutip

  | Prioritas | Format | Kesesuaian |
  |--------|------|------|
  | Pilihan utama | `"isi ucapan"` (tanda kutip lurus lebar setengah) | Baku karya pendek, Fanqie, Hongguo, Heiyan |
  | Ditentukan platform / proyek | Tanda kutip sudut gaya Yanyan (corner bracket U+300C dan U+300D) | Zhihu Yanyan, sebagian genre latar kuno, permintaan pengguna |

  **Secara baku pakai `""`**; kalau pengguna atau platform menentukan gaya Yanyan, pakai tanda kutip sudut tersebut, dan jangan memperlakukannya sebagai kesalahan lalu menggantinya.

  ### Aturan

  1. Dialog **berdiri di baris sendiri**, tidak ditanam di dalam paragraf narasi.
  2. Ganti label dialog dengan tindakan: kurangi "katanya", "ujarnya", "sambil tersenyum ia berkata", ubah menjadi beat tindakan + dialog; kata "kata" yang biasa boleh dipertahankan sesuai konteks.
  3. Pada dialog dua orang yang berturut-turut, label dihilangkan dan pembicara dibedakan lewat isinya.

  Benar:

  ```
  Dia meletakkan gelasnya.
  "Pergilah."
  Lelaki itu tidak bergerak.
  "Kubilang, pergilah."
  ```

  Salah:

  ```
  Dia meletakkan gelasnya, lalu berkata: "Pergilah." Lelaki itu tidak bergerak, dia berkata lagi: "Kubilang, pergilah."
  ```

  ## 11. Batasan keras tanda baca

  **Isi utama di repositori ini seragam tidak memuat `…` bergaya elipsis panjang, `——`, `—`, dan `--`**. Berlaku untuk narasi, dialog, dan deskripsi kejiwaan, tanpa pengecualian untuk dialog.

  Jeda, tersedak suara, ucapan yang tak selesai, terpotong, dan ruang kosong semuanya diwujudkan dengan cara berikut:
  - Kalimat pendek, titik, dan koma untuk memenggal.
  - Beat tindakan ("dia berhenti sejenak", "dia mengepalkan tangan").
  - Ganti baris / satu kalimat berdiri sebagai paragraf.

  Tanda baca lainnya mengikuti nada:

  | Nada / fungsi | Tanda baca | Garis pertahanan |
  |---|---|---|
  | Menekan / tenang / menahan diri | Kalimat pendek, koma, titik, bila perlu titik dua untuk menekan titik jatuh penilaian | Jangan menambahkan tanda seru secara artifisial, jangan pula menitikkan semuanya sepanjang naskah |
  | Menuntut / bertanya balik | Tanda tanya + susulan pertanyaan yang singkat | Jangan mengakhiri setiap kalimat dengan tanda tanya |
  | Meledak / menampar | Titik ledak yang sungguhan memakai 1 tanda seru, ledakan berturut-turut maksimal 1-2 tempat | Larang `!!!`, larang seruan berteriak sepanjang paragraf |
  | Penyingkapan informasi / titik jatuh penilaian | Titik dua, satu kalimat berdiri sebagai paragraf untuk menciptakan titik jatuh | Jangan menulis rangkaian titik koma bergaya makalah |

  Kalau dalam contoh paket genre muncul elipsis panjang, itu hanya untuk mengisyaratkan tekniknya; saat jatuh ke isi utama, tulis ulang mengikuti butir ini.

  ## 12. Larangan mencampur meta-informasi bab ke dalam isi utama

  Nomor bab dan kata kerja teknis penulisan hanya boleh muncul di judul / penanda bagian / nama berkas / catatan pelacakan. Dalam narasi, dialog, dan deskripsi kejiwaan isi utama **tidak boleh muncul**:

  ```
  Bab [0-9]+ | Bab [Satu Dua Tiga Empat Lima Enam Tujuh Delapan Sembilan Sepuluh Seratus Seribu] | bab sebelumnya | bab lalu | bab ini | teks sebelumnya | teks setelahnya | petunjuk awal | kerangka rinci | pembaca
  ```

  Ubahlah menjadi penambat peristiwa atau waktu relatif yang bisa dirasakan tokoh. Contoh: "lebih sakit daripada tiga detik tembakan di bab satu itu" diubah menjadi "lebih sakit daripada tiga detik tembakan itu".

  Pengecualian: kalau tokoh benar-benar membaca / membicarakan teks "bab X" di dalam dunia cerita, atau tokoh memang benar-benar seorang penulis / pembaca dan sedang membicarakan status kepembacaannya, hal itu boleh dipertahankan.

  ## 13. Tabel cakupan platform

  | Platform | Penanda bab | Format dialog | Warna dasar paragraf | Persyaratan khusus |
  |---|---|---|---|---|
  | Zhihu Yanyan | `1.` (angka murni) | Tanda kutip sudut (U+300C dan U+300D) | Paragraf pendek + jalinan narasi | Paragraf pembuka perlu ditandai terpisah |
  | Fanqie | `###Bab N` | `""` | Paragraf pendek sebagai warna dasar, narasi boleh berjalin dengan dialog | Paragraf pertama harus punya daya tarik |
  | Hongguo | `###1.` | `""` | Paragraf pendek sebagai warna dasar | Tidak ada |
  | Heiyan | `###1.` | `""` | Satu kalimat satu paragraf, banyak ganti baris untuk ruang kosong | Akhir bagian wajib menyisakan pengait |

  Kalau pengguna tidak menentukan platform, pakai format umum karya pendek secara baku: `###1.` + `""` + warna dasar paragraf pendek lini Fanqie.

  ## 14. Pemeriksaan cepat setiap kali selesai satu paragraf

  - [ ] Apakah bentuk paragraf sesuai templat platform tujuan (Heiyan satu kalimat satu paragraf / lini Fanqie paragraf pendek berjalin narasi)? Apakah tidak dipotong menjadi kerangka dengan jumlah kata yang seragam?
  - [ ] Apakah antara paragraf yang berdampingan hanya ada satu `\n`, tanpa baris kosong atau `\n\n`?
  - [ ] Apakah tanpa indentasi (tanpa spasi lebar ideografis atau spasi biasa)?
  - [ ] Apakah di luar penanda judul / bagian, paragraf isi utama tidak memakai Markdown seperti `**` `*` `#` `---`?
  - [ ] Apakah dialog berdiri di baris sendiri, gaya tanda kutipnya sesuai platform (tanda kutip sudut Yanyan sah), dan label dialognya tidak mekanis?
  - [ ] Apakah di isi utama (termasuk dialog) tidak ada `…` bergaya elipsis panjang, `——`, `—`, atau `--`, dan jeda sudah diganti dengan kalimat pendek / tindakan / ganti baris?
  - [ ] Apakah tanda baca mengikuti nada: tidak dititikkan semuanya sepanjang naskah, dan tidak menaburkan tanda tanya atau tanda seru sembarangan?
  - [ ] Apakah isi utama tidak tercampur kata meta-informasi seperti `Bab N` / `bab sebelumnya` / `bab ini` / `teks sebelumnya` / `teks setelahnya` / `petunjuk awal` / `kerangka rinci` / `pembaca` (kecuali dalam konteks pembacaan nyata di dalam cerita atau status kepembacaan yang nyata)?

  ## Format keluaran

  - Platform tujuan dan aturan yang masih perlu dipastikan:
