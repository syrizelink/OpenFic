id: builtin-skill--prose-format
name: Standar Format Isi Utama Novel
summary: Menata bab, subbagian, paragraf, dialog, tanda baca, dan info meta pada isi utama, sekaligus menjaga irama baca di ponsel dan kealamian narasi.
is_enabled: true
content: |
  # Instruksi Eksekusi Format Isi Utama

  Pastikan lebih dulu apakah pengguna atau platform tujuan punya ketentuan yang jelas; kalau ada, ketentuan itu menimpa format bawaan. Pilih penanda bab, bentuk paragraf, dan tanda kutip sesuai templat platform, lalu jalankan dengan ketat aturan ganti baris antarparagraf, tanpa indentasi, larangan tanda baca, larangan info meta di isi utama, dan larangan Markdown. Kalau berlaku untuk cerita pendek, jalankan juga aturan jumlah kata per beat, subperistiwa, dan penyambungan subbagian. Sebelum menyerahkan hasil, jalankan satu per satu seluruh daftar pemeriksaan pada metodologi asli.
references:
  - name: Metodologi Asli Format Isi Utama dan Struktur Subbagian
    content: |
      # Format Isi Utama dan Struktur Subbagian

      ## Penanda Bab

      Format bawaan (diurutkan menurut keluwesan):

      | Format | Platform yang cocok | Contoh |
      |------|----------|------|
      | `###1.` | bawaan cerita pendek | `###1.` `###2.` `###3.` |
      | `###Bab Satu` | sebagian platform | `###Bab Satu` `###Bab Dua` |
      | `1.` (angka murni) | platform tanya jawab | `1.` `2.` `3.` (tanpa awalan ###) |

      **Aturan**: seluruh naskah memakai satu format yang sama, jangan dicampur. Cerita pendek disarankan `###1.` atau angka murni, ringkas dan efisien. Kalau memakai nama bab, bentuknya "Bab x Isi Judul" (contoh "Bab Lima Belas Kembali ke Kampung"), isi judul maksimal 10 kata.

      ## Format Paragraf

      ### Aturan Inti: Unit Dramatik Didahulukan

      Tata letak penyerahan bawaan adalah **memotong paragraf secara alami menurut unit dramatik/bidikan kamera, dengan paragraf tersusun rapat**. Jangan jadikan jumlah kata tetap sebagai pisau pemotong yang wajib; nilai lebih dulu apakah "satu peristiwa/satu rantai penalaran/satu perubahan emosi" sudah selesai.

      - Satu paragraf memuat satu unit dramatik: satu rantai aksi, satu penemuan petunjuk, satu perpindahan arah pandang, satu putaran penilaian batin, atau satu rantai suasana/penalaran/emosi yang berkesinambungan.
      - Adegan berakhir, satu peristiwa berakhir, aksi baru, benda baru, informasi baru, dan dialog baru memulai paragraf baru; kejadian, persepsi, dan reaksi pada saat yang sama harus dijalin bersama, jangan dipisah menjadi lapis aksi/lapis persepsi/lapis reaksi.
      - Antara dua paragraf isi utama yang berdampingan **hanya boleh ada satu karakter ganti baris `\n`**; tidak boleh ada baris kosong atau ganti baris berurutan `\n\n` (tersusun rapat).
      - Tanpa indentasi (perender platform menanganinya sendiri, tidak perlu spasi lebar penuh atau spasi biasa).
      - Panjang hanya dipakai sebagai diagnosis: pecah paragraf hanya kalau terasa berjejal, tercampur beberapa beat, atau sulit diikuti di layar ponsel; kalau penalaran utuh, penataan suasana, atau penanjakan emosi belum selesai, paragraf yang agak panjang boleh dipertahankan demi kesinambungan.

      ### Irama Paragraf (panjang pendek berselang + rapat renggang berbeda)

      Paragraf pendek dibaca cepat, itulah nada dasar pembacaan novel daring di ponsel; paragraf panjang bertugas memuat penalaran utuh, suasana, dan pengendapan emosi. **Hindari panjang yang sama sepanjang naskah**, hindari juga memotong setiap paragraf pada ambang jumlah kata yang sama:

      - **Panjang pendek berselang**: puncak, tamparan balik, dan pembalikan ditekan sependek mungkin (satu kalimat jadi satu paragraf); rantai penalaran, tekanan lingkungan, pengendapan emosi, dan penutupan bab boleh mempertahankan paragraf yang lebih panjang supaya pembaca menyelesaikan satu perubahan yang utuh.
      - **Rapat renggang berbeda (rinci atau ringkas)**: titik puas dan beat peralihan ditulis rapat (persepsi, aksi, detail dipenuhi); beat transisi dan beat penghubung ditulis renggang (1-2 kalimat saja, jangan rata dalam mengerahkan tenaga). Setiap beat sama panjang dan sama rinci justru sumber gaya bicara AI.
      - **Jangan terlalu berkeping-keping**: kalau beberapa paragraf sangat pendek yang berurutan masih termasuk satu bidikan kamera/satu peristiwa, gabungkan menjadi satu paragraf alami supaya tidak terasa seperti kerangka atau baris puisi.

      ### Irama Subjek dan Nama Tokoh

      Nama tokoh tidak baik selalu dihilangkan, tetapi juga jangan disebut di setiap kalimat. Pakai berdasarkan "penyetelan ulang subjek":

      - Di awal paragraf, saat perpindahan adegan, saat banyak orang di satu tempat, atau saat subjek mungkin tertukar, pakai nama tokoh utama/nama tokoh untuk membangun sudut pandang.
      - Di dalam satu paragraf atau satu rantai aksi yang sama, utamakan campuran kata ganti, sambungan aksi, dan penghilangan yang wajar, hindari setiap kalimat dibuka dengan nama tokoh yang sama.
      - Pada peralihan penting, ledakan emosi, kontras identitas, atau saat pembaca perlu kembali memusatkan perhatian ke tokoh utama, nama boleh disebut lagi untuk memperkuat.
      - Telaah irama subjek dengan melihat "apakah terasa tersendat saat dibaca", bukan dipangkas berdasarkan jumlah kemunculan di seluruh bab; hanya kalau kalimat/paragraf berurutan tidak punya penyetelan ulang subjek tetapi namanya disebut berulang kali, itu baru disebut subjek terlalu rapat.

      ## Format Dialog

      ### Penanda Dialog

      Pilih menurut platform tujuan/permintaan pengguna; kalau tidak ditentukan, pakai format bawaan:

      | Prioritas | Format | Platform yang cocok |
      |--------|------|----------|
      | Pilihan utama | `"isi ucapan"` | bawaan cerita pendek dan semua platform umum |
      | Ditentukan platform/proyek | gaya tanda kutip lain yang diminta platform atau pengguna | ikuti permintaan itu, jangan diperlakukan sebagai kesalahan |

      **Bawaannya memakai `""`**; kalau pengguna atau platform meminta gaya tanda kutip lain, ikuti permintaan itu dan jangan dianggap salah.

      ### Aturan Dialog

      1. Dialog **berdiri sendiri satu baris**, tidak diselipkan di dalam paragraf narasi
      2. Ganti label dialog dengan aksi: jangan pakai "dia berkata" atau "dia menuturkan", ubah menjadi deskripsi aksi + dialog
      3. Saat dialog dua orang muncul berurutan, hilangkan labelnya, andalkan isi untuk membedakan siapa yang bicara

      **Contoh benar**:
      ```
      Dia meletakkan cangkirnya.
      "Pergilah."
      Lelaki itu tidak bergerak.
      "Kubilang, pergilah."
      ```

      **Contoh salah**:
      ```
      Dia meletakkan cangkirnya, lalu berkata, "Pergilah." Lelaki itu tidak bergerak, dia berkata lagi, "Kubilang, pergilah."
      ```

      ## Spektrum Tanda Baca dan Nada

      Tanda baca melayani nada, warna suara tokoh, dan irama emosi, tidak boleh seluruh naskah hanya berakhir titik, tidak boleh juga menumpuk simbol secara acak demi terasa "kaya". Nilai dulu fungsi kalimat saat ini, baru pilih tanda bacanya:

      | Nada / fungsi | Strategi tanda baca | Garis pertahanan |
      |---|---|---|
      | Menekan / tenang / menahan diri | Kalimat pendek, koma, titik, kalau perlu titik dua untuk menekan titik jatuh penilaian | Jangan menambah tanda seru secara buatan; menahan diri bukan berarti setiap kalimat rata berakhir titik |
      | Menuntut / menjajaki / bertanya balik | Tanda tanya + serpihan desakan pendek, disertai jeda aksi | Hindari setiap kalimat berakhir dengan `?` |
      | Terkejut / meledak / menampar balik | Titik ledakan yang sungguhan boleh memakai 1 tanda seru, ledakan berurutan paling banyak 1-2 tempat | Larang `!!!` dan seruan bergaya berteriak sepanjang paragraf |
      | Ragu / menelan kata / belum selesai bicara | Koma, titik, pemotongan kalimat pendek, beat aksi | Jangan pakai `……` untuk menciptakan jeda; utamakan aksi dan perubahan panjang kalimat |
      | Terpotong / suara memanjang | Jangan pakai `——`; ganti dengan aksi yang memotong, ganti baris, kalimat pendek, atau aksi yang belum selesai | Isi utama maupun dialog sama-sama melarang `——` / `—` / `--` |
      | Pembukaan informasi / titik jatuh penilaian | Titik dua, titik koma, atau satu kalimat jadi satu paragraf untuk menciptakan titik jatuh | Jaga kenyamanan baca di ponsel, jangan menulis rentetan titik koma bergaya makalah |

      Aturan eksekusi: saat menulis dialog, lihat dulu hubungan tokoh dan posisi kuasanya; saat menulis narasi, ciptakan irama dengan panjang kalimat, jeda koma, dan satu kalimat jadi satu paragraf, jangan menjadikan tanda pisah sebagai alat irama; saat penyuntingan halus, periksa apakah seluruh naskah hanya berakhir titik dan apakah ada tumpukan tanda baca acak. Gaya tanda kutip mengikuti kesepakatan proyek/platform, dan gaya tanda kutip lain yang diminta platform adalah format dialog yang sah.

      ## Struktur Subbagian (beat)

      ### Aturan Dasar

      - Bagi subbagian dengan nomor angka (`1` `2` `3`), setiap subbagian adalah satu beat naratif yang utuh
      - Setiap subbagian 800-1500 kata (cerita bergaya serba puas boleh dipadatkan sampai 500-800 kata per subbagian)
      - 8-15 subbagian menutupi seluruh naskah (dihitung balik dari target jumlah kata; 8000:1000 kira-kira 8 subbagian, 12000:800 kira-kira 15 subbagian)
      - Setiap subbagian mendorong satu titik peristiwa yang jelas

      ### Struktur Dalam Subbagian

      Setiap subbagian harus punya:

      1. **Satu peristiwa utama** + **3-5 subperistiwa** (peristiwa utama mendorong alur inti, subperistiwa memperkaya lapisan; kalau draf awal cenderung pendek, kembali dulu ke subbagian atau kerangka rinci untuk melengkapi subperistiwa, dialog, atau konflik yang sudah direncanakan; saat menghilangkan rasa AI pada isi utama yang sudah ada, tidak boleh menambah alur cerita baru)
      2. **Satu perubahan emosi** (bagaimana perasaan pembaca berubah)
      3. **Satu informasi baru yang diketahui pembaca**
      4. **3-5 putaran benturan dialog** (membuka hubungan/menaikkan konflik; adegan tertentu seperti menemukan sesuatu sendirian atau membaca buku harian boleh ditandai nol, jalankan sesuai permintaan tugas desain saat ini)
      5. **Tiga dimensi setiap subperistiwa dijalin**: kejadian + persepsi + reaksi dijalin dalam satu paragraf isi utama yang sama

      ### Penyambungan Antarsubbagian

      - Penutup subbagian menyisakan satu pengait (misteri/emosi yang belum tuntas/pertanyaan baru)
      - Pembuka subbagian berikutnya menyambung dengan cepat, jangan menata ulang dari awal
      - Emosi menanjak melewati subbagian: intensitas emosi setiap subbagian >= subbagian sebelumnya. Pengecualian: setelah emosi puncak (subbagian pembalikan) boleh dipertahankan tanpa turun selama 1 subbagian, tetapi tidak boleh jatuh mendadak

      ## Tabel Penimpaan Format Dialog per Platform

      | Platform | Penanda bab | Format dialog | Ketentuan khusus |
      |------|----------|----------|----------|
      | Platform tanya jawab (Yanyan) | `1.` | gaya tanda kutip yang diminta platform | pengantar perlu ditandai terpisah |
      | Fanqie | `###Bab Satu` | `""` | paragraf pertama harus menarik |
      | Hongguo | `###1.` | `""` | tidak ada |

      **Prinsip umum**: kalau pengguna tidak menentukan platform, pakai format umum cerita pendek (`###1.` + `""`); kalau pengguna atau platform meminta gaya tanda kutip lain, gaya itu diizinkan.

      ## Larangan Mutlak

      1. **Larang memotong paragraf secara mekanis menurut jumlah kata**: jangan memaksa memecah paragraf hanya karena melewati jumlah kata tertentu; nilai dulu apakah paragraf itu masih satu unit dramatik yang utuh. Pecah hanya kalau tercampur beberapa aksi/informasi/perpindahan pandangan, sementara rantai penalaran, suasana, dan emosi yang utuh boleh mempertahankan paragraf yang agak panjang
      2. **Larang baris kosong antarparagraf**: antara paragraf isi utama yang berdampingan hanya boleh satu karakter ganti baris `\n`, tidak boleh ada baris kosong atau ganti baris berurutan `\n\n`
      3. **Hindari label dialog yang mekanis**: "dia berkata", "dia menuturkan", "dia tersenyum lalu berkata" yang sering muncul atau berpola rumus digantikan aksi/konteks; kata "kata" yang biasa boleh dipertahankan
      4. **Larang indentasi**: jangan memakai spasi lebar penuh (U+3000) atau spasi biasa sebagai indentasi
      5. **Larang perenderan Markdown pada paragraf isi utama**: selain penanda subbagian/bab yang seragam (seperti `###1.`), di dalam paragraf isi utama tidak dipakai sintaks Markdown seperti tebal `**`, miring `*`, judul `#`, atau garis pemisah `---`
      6. **Isi utama tidak memakai tanda pisah**: isi utama (termasuk narasi, dialog, deskripsi batin) tidak memakai tanda pisah `——`/`—` atau tanda hubung ganda `--`, ganti dengan titik, koma, ganti baris, beat aksi, atau pemotongan kalimat pendek; tidak ada lagi "pengecualian dialog"
      7. **Larang seluruh naskah berakhir titik atau menumpuk tanda baca secara acak**: tanda baca wajib cocok dengan nada/warna suara tokoh/fungsi emosi; saat harus menuntut pakai tanda tanya, saat harus meledak pakai sedikit tanda seru; ragu, menelan kata, dan bicara yang belum selesai diungkapkan lewat aksi atau perubahan panjang kalimat, jangan memaksa jeda dengan `……` / `——`, jangan juga menebar `?`/`!` tanpa fungsi
      8. **Larang info meta bab masuk ke isi utama**: nomor bab hanya boleh muncul di judul/penanda subbagian/nama berkas/catatan pelacakan. Di dalam narasi, dialog, dan deskripsi batin isi utama tidak boleh muncul kata rekayasa penulisan seperti `Bab <bilangan>` | `bab sebelumnya` | `bab lalu` | `bab terdahulu` | `bab ini` | `bab yang ini` | `bagian sebelumnya` | `bagian selanjutnya` | `petunjuk awal` | `kerangka rinci` | `pembaca`; ubah menjadi jangkar peristiwa yang bisa dirasakan tokoh atau waktu relatif. Pengecualian: kalau tokoh benar-benar membaca/membahas teks "Bab X" di dalam dunia cerita, atau benar-benar berperan sebagai penulis/pembaca dan membicarakan status pembaca, kata terkait boleh dipertahankan.

      ## Pemeriksaan Cepat

      - [ ] Paragraf dipotong menurut unit dramatik/bidikan kamera, bukan dipotong mekanis menurut jumlah kata?
      - [ ] Apakah paragraf berisi tiga dimensi yang dijalin sudah dipotong menurut perubahan bidikan/informasi, dan apakah rantai penalaran/suasana/emosi yang utuh tetap berkesinambungan?
      - [ ] Apakah irama subjek/nama tokoh terasa alami: awal paragraf bisa membangun subjek, di tengah paragraf ada kata ganti/penghilangan, pada peralihan penting nama disebut lagi, dan pengulangan berurutan yang tidak perlu dihindari?
      - [ ] Apakah antara paragraf isi utama yang berdampingan hanya ada satu `\n`, tanpa baris kosong atau `\n\n`?
      - [ ] Dialog berdiri sendiri satu baris, dan gaya tanda kutip sesuai kesepakatan proyek/platform (gaya tanda kutip yang diminta platform itu sah)?
      - [ ] Apakah irama tanda baca cocok dengan nada/warna suara tokoh, tidak seluruh naskah berakhir titik, dan tidak ada tumpukan `?`/`!` acak atau jeda paksa dengan `……`/`——`?
      - [ ] Apakah `——`/`—`/`--` di isi utama (termasuk dialog) sudah diubah menjadi koma, titik, beat aksi, atau pemotongan kalimat pendek?
      - [ ] Apakah label dialog terhindar dari frekuensi tinggi/pola rumus, dan apakah kata "kata" yang biasa dipertahankan sesuai konteks?
      - [ ] Tanpa indentasi?
      - [ ] Setiap subbagian punya peristiwa + emosi + informasi?
      - [ ] Di luar judul/penanda subbagian, tidak ada kata info meta seperti `Bab <bilangan>` | `bab sebelumnya` | `bab lalu` | `bab terdahulu` | `bab ini` | `bab yang ini` | `bagian sebelumnya` | `bagian selanjutnya` | `petunjuk awal` | `kerangka rinci` | `pembaca`; kecuali konteks membaca/membahas "Bab X" secara nyata di dalam cerita atau status pembaca yang sungguhan?
  - name: Metodologi Asli Format Isi Utama Cerita Pendek
    content: |
      # Format Isi Utama Cerita Pendek

      ## Penanda Bab

      Seluruh naskah memakai satu format, jangan dicampur.

      | Format | Platform yang cocok | Contoh |
      |------|----------|------|
      | `###1.` | bawaan cerita pendek | `###1.` `###2.` `###3.` |
      | `###Bab N` | Fanqie / Qimao / cerita zaman kuno | `###Bab Satu` `###Bab Dua` |
      | `1.` (angka murni, tanpa `###`) | platform tanya jawab (Yanyan) | `1.` `2.` `3.` |

      Cerita pendek disarankan `###1.` atau angka murni supaya ringkas. Bab yang agak panjang di lingkungan Fanqie memakai `###Bab N`. Bentuk nama bab adalah "Bab x Isi Judul" (contoh "Bab Lima Belas Kembali ke Kampung"), isi judul maksimal 10 kata.

      ## Paragraf: Dua Templat Platform

      Bentuk isi utama cerita pendek dibagi dua templat menurut platform. **Tidak ada garis keras yang seragam berupa "setiap paragraf <= 3 kalimat" atau "800-1500 kata per subbagian"**, itu warisan dari novel panjang dan akan memotong cerita pendek menjadi kerangka yang sama panjang. Kenali dulu nada dasar platform, baru bagi jumlah kata menurut prinsip rapat renggang.

      ### Heiyan: satu kalimat satu paragraf, ruang kosong untuk baca cepat

      - Sebagian besar satu kalimat satu paragraf, banyak ganti baris untuk menciptakan rasa jatuh dan jeda.
      - Irama rapat, tiap subbagian bervolume kecil, akhir subbagian wajib menyisakan pengait.
      - Satu kalimat jadi satu paragraf adalah hal biasa, jangan menyambungkan kembali kalimat pendek menjadi paragraf panjang hanya demi "mengejar jumlah kata".

      Gambaran templat:
      ```
      ###1.

      Dia menyerahkan sebuah dokumen.

      Surat perjanjian perceraian.

      Aku tersenyum.

      "Setelah tanda tangan, kau bebas."
      ```

      ### Fanqie / Qimao: paragraf pendek sebagai nada dasar, narasi berjalin dialog

      - Paragraf pendek tetap menjadi nada dasar pembacaan di ponsel, tetapi **paragraf narasi retrospektif berbilang kalimat boleh berjalin dengan dialog**: dalam satu paragraf boleh ada monolog batin, kilas balik yang menusuk, aksi, lalu disambung dialog.
      - Cerita zaman kuno atau cerita kehidupan boleh menulis paragraf narasi yang lebih panjang untuk memuat rantai emosi dan penataan adegan yang utuh.
      - Titik puas, tamparan balik, dan pembalikan ditekan pendek (boleh satu kalimat jadi satu paragraf); transisi dan penyampaian informasi cukup satu kalimat.

      Gambaran templat:
      ```
      ###Bab Satu

      Saat aku mengantarkan sup hangat ke depannya, dia sedang menunduk menatap ponsel, layarnya menyala menampilkan nama perempuan idamannya. Sudah tiga tahun, kupikir aku sudah melewati hari-hari tersulit, ternyata yang kutahan hanyalah diriku sendiri.

      "Lain kali hal seperti ini tidak perlu kau lakukan." Dia bahkan tidak mengangkat kepala. "Dia tidak suka bau minyak dapur."

      Tanganku yang memegang mangkuk berhenti sesaat.
      ```

      ### Batasan Keras yang Berlaku untuk Kedua Templat (semua platform)

      - Antara paragraf isi utama yang berdampingan **hanya boleh ada satu karakter ganti baris `\n`**, tidak boleh ada baris kosong atau ganti baris berurutan `\n\n` (tersusun rapat). Sebelum dan sesudah penanda bab dihitung terpisah.
      - **Tanpa indentasi**: jangan memakai spasi lebar penuh (U+3000) atau spasi biasa sebagai indentasi, perender platform menanganinya sendiri.
      - **Larang Markdown pada paragraf isi utama**: selain penanda subbagian / bab yang seragam (seperti `###1.`), di dalam paragraf isi utama jangan memakai tebal `**`, miring `*`, judul `#`, garis pemisah `---`, dan sejenisnya.
      - Panjang pendek berselang, hindari panjang yang sama sepanjang naskah. Memotong setiap paragraf pada jumlah kata yang sama justru sumber gaya bicara AI.

      ## Dialog

      ### Tanda Kutip

      | Prioritas | Format | Cocok untuk |
      |--------|------|------|
      | Pilihan utama | `"isi ucapan"` (tanda kutip ganda lurus) | bawaan cerita pendek, Fanqie, Hongguo, Heiyan |
      | Ditentukan platform / proyek | gaya tanda kutip lain yang diminta platform atau pengguna | platform tanya jawab (Yanyan), sebagian cerita zaman kuno, permintaan pengguna |

      **Bawaannya memakai `""`**; kalau pengguna atau platform meminta gaya tanda kutip lain, pakai gaya itu dan jangan diperbaiki seolah salah.

      ### Aturan

      1. Dialog **berdiri sendiri satu baris**, tidak diselipkan di dalam paragraf narasi.
      2. Ganti label dialog dengan aksi: kurangi "dia berkata", "dia menuturkan", "dia tersenyum lalu berkata", ubah menjadi beat aksi + dialog; kata "kata" yang biasa boleh dipertahankan sesuai konteks.
      3. Dialog dua orang yang berurutan menghilangkan label, andalkan isi untuk membedakan siapa yang bicara.

      Benar:
      ```
      Dia meletakkan cangkirnya.
      "Pergilah."
      Lelaki itu tidak bergerak.
      "Kubilang, pergilah."
      ```

      Salah:
      ```
      Dia meletakkan cangkirnya, lalu berkata, "Pergilah." Lelaki itu tidak bergerak, dia berkata lagi, "Kubilang, pergilah."
      ```

      ## Batasan Keras Tanda Baca

      **Isi utama di repositori ini seragam tidak boleh memuat `……` / `——` / `—` / `--`**. Berlaku untuk narasi, dialog, dan deskripsi batin, tanpa pengecualian dialog.

      Jeda, tersedak, kalimat yang belum tuntas, ucapan yang terpotong, dan ruang kosong semuanya diwujudkan dengan cara berikut: kalimat pendek, pemotongan dengan titik dan koma; beat aksi ("dia berhenti sesaat", "dia mengepalkan tangan"); ganti baris atau satu kalimat jadi satu paragraf.

      Tanda baca lainnya mengikuti nada:

      | Nada / fungsi | Tanda baca | Garis pertahanan |
      |---|---|---|
      | Menekan / tenang / menahan diri | Kalimat pendek, koma, titik, kalau perlu titik dua untuk menekan titik jatuh penilaian | Jangan menambah tanda seru secara buatan, jangan juga seluruh naskah berakhir titik |
      | Menuntut / bertanya balik | Tanda tanya + desakan pendek | Jangan setiap kalimat berakhir dengan `?` |
      | Meledak / menampar balik | Titik ledakan sungguhan memakai 1 tanda seru, ledakan berurutan paling banyak 1-2 tempat | Larang `!!!`, larang seruan bergaya berteriak sepanjang paragraf |
      | Pembukaan informasi / titik jatuh penilaian | Titik dua, satu kalimat jadi satu paragraf untuk menciptakan titik jatuh | Jangan menulis rentetan titik koma bergaya makalah |

      Kalau di contoh paket tema muncul `……`, itu hanya untuk menggambarkan tekniknya; saat masuk ke isi utama, tulis ulang sesuai butir ini.

      ## Larang Info Meta Bab Masuk ke Isi Utama

      Nomor bab dan kata rekayasa penulisan hanya boleh muncul di judul / penanda subbagian / nama berkas / catatan pelacakan. Di dalam narasi, dialog, dan deskripsi batin isi utama **tidak boleh muncul**:

      ```
      Bab <bilangan> | bab sebelumnya | bab lalu | bab terdahulu | bab ini | bab yang ini | bagian sebelumnya | bagian selanjutnya | petunjuk awal | kerangka rinci | pembaca
      ```

      Ubah menjadi jangkar peristiwa yang bisa dirasakan tokoh atau waktu relatif. Contoh: "lebih sakit daripada tiga detik tembakan di bab satu itu" diubah menjadi "lebih sakit daripada tiga detik tembakan itu". Pengecualian: kalau tokoh benar-benar membaca / membahas teks "Bab X" di dalam dunia cerita, atau tokoh benar-benar berperan sebagai penulis / pembaca dan membicarakan status pembaca, kata itu boleh dipertahankan.

      ## Tabel Penimpaan per Platform

      | Platform | Penanda bab | Format dialog | Nada dasar paragraf | Ketentuan khusus |
      |------|----------|----------|----------|----------|
      | Platform tanya jawab (Yanyan) | `1.` (angka murni) | gaya tanda kutip yang diminta platform | paragraf pendek + narasi berjalin | pengantar perlu ditandai terpisah |
      | Fanqie | `###Bab N` | `""` | paragraf pendek sebagai nada dasar, narasi boleh berjalin dialog | paragraf pertama harus menarik |
      | Hongguo | `###1.` | `""` | paragraf pendek sebagai nada dasar | tidak ada |
      | Heiyan | `###1.` | `""` | satu kalimat satu paragraf, banyak ganti baris untuk ruang kosong | akhir subbagian wajib menyisakan pengait |

      Kalau pengguna tidak menentukan platform, pakai format umum cerita pendek: `###1.` + `""` + nada dasar paragraf pendek gaya Fanqie.

      ## Pemeriksaan Cepat Setiap Selesai Satu Paragraf

      - [ ] Bentuk paragraf sesuai templat platform tujuan (Heiyan satu kalimat satu paragraf / gaya Fanqie paragraf pendek berjalin narasi)? Tidak dipotong menjadi kerangka dengan jumlah kata yang sama?
      - [ ] Antara paragraf yang berdampingan hanya ada satu `\n`, tanpa baris kosong / `\n\n`?
      - [ ] Tanpa indentasi (tidak ada spasi lebar penuh atau spasi biasa)?
      - [ ] Di luar judul / penanda subbagian, paragraf isi utama tidak memakai `**` `*` `#` `---` dan Markdown lainnya?
      - [ ] Dialog berdiri sendiri satu baris, gaya tanda kutip sesuai platform (gaya tanda kutip yang diminta platform itu sah), dan label dialog tidak mekanis?
      - [ ] Di isi utama (termasuk dialog) tidak ada `……` / `——` / `—` / `--`, dan jeda sudah diganti kalimat pendek / aksi / ganti baris?
      - [ ] Tanda baca mengikuti nada: tidak seluruh naskah berakhir titik, tidak menebar `?` / `!` secara acak?
      - [ ] Isi utama tidak tercampur kata info meta seperti `Bab N` / `bab sebelumnya` / `bab ini` / `bagian sebelumnya` / `bagian selanjutnya` / `petunjuk awal` / `kerangka rinci` / `pembaca` (kecuali konteks membaca secara nyata di dalam cerita / status pembaca yang sungguhan)?
