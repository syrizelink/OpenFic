    content: |
      # Panduan Lengkap Penghilangan Aroma AI

      > Mengenali sidik jari tulisan AI, metode tiga lintasan penghilangan aroma AI sistematis, kekangan kata terlarang, dan pustaka contoh penulisan ulang. Dipakai untuk pemeriksaan mandiri penghilangan aroma AI dan sebagai bahan rujukan saat menulis ulang setelah isi utama selesai ditulis. Dijalankan manual oleh sesi ini, tanpa bergantung pada Agent luar, skrip, jaringan, atau protokol penyimpanan proyek.

      ## Perutean Keputusan

      | Apa yang sedang kamu kerjakan | Modul mana yang dirujuk |
      |-----------|-------------|
      | Pemeriksaan mandiri aroma AI setelah isi utama selesai | Aturan inti -> Deteksi pola tulisan AI -> Pemeriksaan dimensi mutu |
      | Menulis ulang sepotong teks yang beraroma AI kental | Pustaka contoh penulisan ulang + Pustaka contoh penulisan ulang dialog konflik |
      | Memeriksa apakah kata terlarang terpakai | Tabel cepat kata terlarang dan pola kalimat -> Kata berfrekuensi tinggi khas AI (pola 1) |
      | Menghilangkan aroma AI satu bab secara sistematis | Metode tiga lintasan penghilangan aroma AI sistematis |
      | Memeriksa apakah akhir bab mengandung rangkuman dan pemuliaan | Sidik jari tulisan AI -> Gaya rangkuman akhir bab |
      | Menilai apakah deskripsi emosi bersifat memberi tahu | Prinsip Show Don't Tell + Teknik tambahan penghilangan aroma AI |
      | Memindai mutu seluruh bab dengan cepat | Mantra pemeriksaan mandiri cepat + Pemeriksaan dimensi mutu |

      ## Nada Instruksi

      Berkas ini terutama berisi pola masalah dan daftar berisiko tinggi. Kata berisiko tinggi tingkat satu diperiksa lebih dulu; kata tingkat dua atau kata yang sensitif konteks dinilai menurut frekuensi, konteks, dan apakah itu tanda bermalas-malasan. Kalau berbenturan, mempertahankan niat kreatif dan fungsi alur cerita lebih diutamakan daripada penggantian mekanis.

      ## Sidik Jari Tulisan AI (wajib dihindari)

      ### Kata berfrekuensi tinggi khas AI

      > Daftar lengkap kata terlarang lihat "Daftar Lengkap Kata Terlarang dan Pola Kalimat Novel Daring" di Skill ini.

      **Kategori tambahan**:

      | Kategori | Prinsip penggantian |
      |------|---------|
      | Kata pemuliaan abstrak (takdir, suratan, sudah ditakdirkan) | Gunakan kejadian konkret sebagai ganti konsep abstrak |
      | Metafora serbaguna (seperti gelombang pasang, bagaikan kilat, seumpama angin musim semi) | Utamakan tidak memakai metafora; kalau memang perlu, sisakan hanya sedikit metafora yang membumi dan sesuai tokoh |

      ### Gaya rangkuman akhir bab

      **Dilarang** menutup akhir bab dengan cara berikut:
      - Renungan yang bersifat merangkum ("dia akhirnya mengerti ...")
      - Seruan bergaya pemuliaan ("malam ini sudah ditakdirkan tidak ada yang bisa tidur")
      - Penutup bergaya filosofis ("hidup memang seperti ini ...")
      - Pengumuman bergaya petunjuk awal ("yang tidak dia ketahui adalah, badai yang lebih besar segera datang")

      **Cara yang benar**: tutup akhir bab dengan aksi, dialog, atau ketegangan yang menggantung, biarkan alur cerita itu sendiri yang menciptakan gema.

      ### Deskripsi bertumpuk (satu aksi dipecah dan ditulis tiga kali)

      **Pola deteksi**: satu aksi atau emosi ditulis kejadiannya dulu, lalu ditambah detail persepsinya, lalu ditambah reaksi tubuhnya, ditulis habis dalam tiga paragraf berurutan. Yang dilihat pembaca adalah satu aksi yang sama dipecah dan ditulis tiga kali.

      **Ciri khas**:
      - Ditulis dulu satu aksi yang bersifat ikhtisar, lalu diuraikan detail aksi yang sama, lalu ditulis reaksi tubuhnya: tiga paragraf itu membicarakan satu hal yang sama
      - "Lapis kejadian -> lapis persepsi -> lapis reaksi" muncul terpisah paragraf secara berurutan
      - Setiap dimensi berdiri sendiri sebagai paragraf, alih-alih dilebur ke dalam satu isi utama yang bersinambung

      **Contoh salah**:
      > Ayah Lin menunduk, tangan kirinya menahan dokumen, tangan kanannya mengambil pena, lalu menurunkannya ke kertas.
      >
      > Tangannya gemetar dari siku sampai pergelangan.
      >
      > Ujung pena berhenti sejenak di kertas, menarik satu garis, lalu berhenti lagi. Coretan pada huruf nama keluarga "Lin" itu melenceng.

      -> Satu aksi yang sama (tangan gemetar / menulis) ditulis dalam tiga paragraf, tiap paragraf adalah dimensi berbeda dari momen yang sama

      **Cara yang benar**: lebur ketiga dimensi kejadian, persepsi, dan reaksi ke dalam satu isi utama yang bersinambung, sehingga pembaca membaca satu momen yang utuh:

      > Tangan kiri Ayah Lin menahan dokumen, tangan kanannya menurunkan pena ke kertas, ujung pena begitu menyentuh permukaan kertas langsung melenceng, dari siku sampai pergelangan gemetarnya tak tertahan, garis itu terseret miring keluar.

      -> Kejadian, persepsi, dan reaksi disajikan bersamaan dalam satu paragraf.

      **Prinsip penanganan**: pertahankan detail emosi yang berfungsi, gabungkan deskripsi berulang atas momen yang sama menjadi gambar yang bersinambung. Kalau setelah digabung jelas menjadi tipis, utamakan memulihkan informasi yang berfungsi dari teks asli, atau ubah informasi yang sudah ada menjadi ungkapan aksi/dialog yang lebih wajar; jangan menambah alur cerita, latar, relasi, atau garis waktu yang tidak ada di teks asli.

      ## Aturan Inti

      ### Aturan 1: Diagnosis kerapatan paragraf

      Panjang pendek paragraf tidak punya baik-buruk yang baku. Titik pemeriksaannya adalah apakah pembacaan lantang dan pembacaan di ponsel tersendat:
      - Satu paragraf biasanya hanya memuat satu aksi, satu perubahan informasi, atau satu kelompok reaksi yang berkaitan erat.
      - Kalau rentetan koma terlalu panjang dan beberapa aksi utuh berjejal di satu paragraf sampai perlu ambil napas saat dibaca, pecah menurut aksi atau perubahan informasi.
      - Kalau paragraf pendek berturut-turut sampai hancur jadi kerangka, gabungkan kalimat bersebelahan dalam satu bidikan kamera yang sama agar gambarnya tetap bersinambung.

      ```
      Terlalu rapat: Dia menatap hujan di luar jendela, di hatinya membumbung sebuah rasa yang sukar dijelaskan, jalan yang dia lalui bertahun-tahun ini dan banyak hal yang sudah dia lupakan semuanya membanjir naik pada saat ini.

      Lebih wajar: Dia menatap ke luar jendela. Hujan sudah lama turun.
      "Kamu masih memikirkan dia?" tanya Lao Liu.
      Dia tidak menjawab.
      ```

      ### Aturan 2: Aksi + dialog + reaksi emosi

      Tiga unsur itu berputar mendorong cerita, jangan menulis kegiatan batin saja lebih dari 2 paragraf:

      ```
      aksi -> dialog -> reaksi emosi -> aksi -> dialog -> ...
      ```

      Emosi jangan memakai "dia merasa / dia menganggap", pakai reaksi tubuh dan perwujudan perilaku:
      - Jangan tulis "dia sangat gugup" -> tulis "telapak tangannya basah berkeringat, sumpitnya hampir jatuh"
      - Jangan tulis "dia sangat murka" -> tulis "dia menghempaskan cangkir ke lantai, pecahannya memantul ke punggung kakinya pun dia tidak membungkuk memungutnya"
      - Jangan tulis "dia sangat sedih" -> tulis "dia duduk dua puluh menit di dalam mobil baru menyalakan mesin"

      ### Aturan 3: Utamakan kalimat pendek

      | Skenario | Panjang kalimat | Contoh |
      |------|------|------|
      | Duel/ketegangan | 3-8 kata | Dia mengelak. Kilau pisau berkelebat. Darah menyembur ke dinding. |
      | Dialog | Bernada lisan | "Kamu gila?" "Mungkin." |
      | Keseharian | 8-15 kata | Di dapur ada suara menumis, baunya seperti tumis cabai daging. |
      | Deskripsi | Dibaca tidak tersendat, informasi tidak kelebihan beban | Hari hampir gelap, di gang tidak ada orang. |

      ### Aturan 4: Ungkapan bernada lisan

      - Boleh memakai bahasa slang dan kata kasar (yang sesuai identitas tokoh)
      - Dialog jangan memakai bahasa tulis ("saya berpendapat hal ini tidak patut" -> "kurasa nggak masuk akal")
      - Narasi juga jangan bergaya jaim ("pandangannya seperti obor menyala" -> "biji matanya tidak bergerak sedikit pun menatap")
      - Utamakan frasa daripada idiom ("tiada daya upaya" -> "nggak ada cara")

      ## Prinsip Show Don't Tell

      | Tell (memberi tahu) | Show (menunjukkan) |
      |-------------|-------------|
      | Dia orang yang pengecut | Dia membolak-balik hasil pemeriksaan itu di tangannya tiga kali, tetap tidak berani membukanya |
      | Bar ini sangat berisik | Bartender mendekat ke telinganya dan berteriak dua kali baru dia dengar |
      | Dia sangat kaya | Dia melempar sembarangan satu kartu kredit ke meja, angka di permukaan kartunya sepuluh kali lebih mahal dari makan ini |
      | Hubungan mereka sangat buruk | Dia mematikan rokoknya di cangkir teh yang baru diseduh perempuan itu, dan perempuan itu tanpa ekspresi menggeser cangkirnya ke samping |
      | Dia sangat pintar | Tiga detik. Dia melihat tiga detik lalu menutup dokumen itu. "Halaman tiga, baris dua." |

      **Metode inti**:
      1. Gunakan perilaku sebagai ganti kata sifat
      2. Gunakan detail sebagai ganti rangkuman
      3. Gunakan dialog sebagai ganti keterangan narasi sampingan
      4. Gunakan reaksi sebagai ganti kata emosi

      ## Pemeriksaan Dimensi Mutu

      ### 1. Konsistensi inti (bobot tertinggi)
      - Apakah alur cerita konsisten dengan kerangka dan teks sebelumnya
      - Apakah perilaku tokoh sesuai rancangan tokoh
      - Apakah latar mengandung pertentangan antara bagian awal dan akhir

      ### 2. Penulisan ulang permukaan (mencegah sidik jari AI)
      - Apakah mengandung kata berfrekuensi tinggi khas AI
      - Apakah akhir bab mengandung rangkuman atau pemuliaan
      - Apakah ada deskripsi batin murni yang panjang
      - Apakah paragraf dipotong secara wajar menurut unit dramatis atau bidikan kamera, menghindari kalimat tunggal jadi paragraf secara mekanis atau hancur jadi kerangka demi memenuhi target pendek

      ### 3. Konsistensi format
      - Format dialog seragam: pertahankan satu gaya tanda kutip menurut kesepakatan proyek atau platform; cerita pendek gaya Zhihu Yanyan boleh memakai tanda kutip siku
      - Irama tanda baca cocok dengan nada: hindari seluruh teks jadi bertitik semua; pertahankan tanda tanya yang berfungsi dan sedikit tanda seru; ungkapkan keraguan atau pemotongan lewat aksi atau kalimat pendek, jangan mengarang jeda secara paksa dengan titik-titik atau tanda pisah
      - Peralihan adegan punya penanda yang jelas
      - Garis waktu jernih dan bisa dilacak

      ### 4. Keterbacaan
      - Apakah ada beberapa kalimat panjang berturut-turut yang menekan irama baca, sementara aksi, dialog, atau kalimat pendek untuk ambil napas tidak ada
      - Apakah dialognya bernada lisan
      - Apakah ada kata langka atau istilah latar yang belum dijelaskan
      - Apakah iramanya ada cepat ada lambat (tidak boleh satu irama saja seluruhnya)

      ### 5. Keterpaduan logika
      - Apakah motif tokoh masuk akal
      - Apakah rantai sebab-akibat kejadian jernih
      - Apakah garis waktunya cocok
      - Apakah cakupan pengetahuan tokoh masuk akal (tidak boleh "membuka sudut pandang maha tahu")

      ## Mantra Pemeriksaan Mandiri Cepat

      ```
      Satu hal satu paragraf, kamera terpotong wajar.
      Dialog mesti seperti orang bicara.
      Perasaan jangan ditulis sebagai isi hati.
      Penutup jangan digubah jadi pemuliaan besar.
      Adegan duel jangan jadi catatan mengalir.
      Adegan sehari-hari harus menanam pasak petunjuk awal.
      ```

      > Aturan paragraf novel daring: potong paragraf secara wajar saat unit dramatis, bidikan kamera, atau satu urusan selesai; paragraf pendek untuk baca cepat, paragraf panjang untuk memuat penalaran utuh, atmosfer, dan rantai emosi, hindari kalimat tunggal jadi paragraf secara mekanis atau panjang seragam di seluruh teks.

      > **Kalibrasi sampel bernilai tinggi Tomato**: isi utama Tomato lebih dekat ke "paragraf pendek ramah ponsel + kata tugas yang wajar + dorongan aksi/dialog di dalam adegan", bukan pemenuhan indikator mekanis. Jendela 305 bab pada sampel bernilai tinggi Tomato menunjukkan: median paragraf sekitar 23,5 kata, lebar baris 50-60 karakter rata-rata hanya menempati 5,1%; rata-rata porsi dialog sekitar 20,6%, dialog >= 50% hanya 3/305, pembuka berupa dialog 59/305; partikel keterangan/pelengkap 305/305, "sangat" 275/305, "seperti/sepertinya/bagaikan/seumpama" 267/305, koma enumerasi 176/305, titik-titik 281/305. Kesimpulan: semua itu hanya bisa ditelaah menurut konteks, tidak bisa dijadikan larangan keras nol toleransi.
      > **Batas antispekulasi**: jangan memaksa ganti baris tiap kalimat, mengubah `……` menjadi `........`, mengubah seluruh partikel keterangan/pelengkap menjadi partikel atribut, melarang semua koma enumerasi/"sangat"/"seperti", memaksakan pembuka berupa dialog, atau menata ulang bab menurut pola tiga ulangan empat bukti demi "antideteksi". Penghilangan aroma AI adalah pemolesan, bukan penulisan ulang struktur; kecuali pengguna jelas meminta penulisan ulang, jangan mengubah urutan bab, sebaran petunjuk awal, porsi dialog, dan irama pelepasan informasi tokoh.

      ## Tabel Cepat Kata Terlarang dan Pola Kalimat

      > Daftar lengkap kata terlarang lihat "Daftar Lengkap Kata Terlarang dan Pola Kalimat Novel Daring" di Skill ini.

      ### Contoh penggantian yang benar
      - "dia merasa seberkas gugup" -> "tangannya gemetar"
      - "dia sangat sedih" -> "dia membalikkan badan, ujung lengan bajunya dikepal sampai kusut"
      - "Baik. ucapnya" -> "Baik." Dia memasukkan kartu pintu itu kembali ke kantong
      - "dia menarik napas panjang" -> "dia menelan kembali kata-katanya"

      ## Deteksi 10 Pola Tulisan AI

      ### Pola 1: Kata berfrekuensi tinggi khas AI

      | Dilarang | Diganti dengan |
      |------|--------|
      | tak kuasa | hapus |
      | bagaikan/seumpama | hapus atau pakai deskripsi konkret |
      | terpampang di depan mata | hapus |
      | membatin dalam hati | tunjukkan pikirannya lewat aksi |
      | berkata dengan suara berat / berkata datar | ganti dengan label aksi |
      | rona wajahnya berubah | pakai ekspresi atau aksi konkret |
      | sudut bibirnya terangkat tipis | dia tertawa / dia menarik sedikit bibirnya |
      | tanpa sadar | hapus |
      | tampak terlihat / pada saat ini juga | hapus |
      | pandangannya seperti obor menyala | hapus atau buat konkret |

      ### Pola 2: Adverbia pelembut membanjir

      Ambang: lebih dari 3 buah per 1000 kata = tanda tangan AI. Yang dipantau utama: sedikit, samar, perlahan, lembut.

      ### Pola 3: Pengembungan makna

      - "bermakna mendalam" -> tulis akibat konkretnya
      - "belum pernah ada sebelumnya" -> berikan acuan pembanding
      - "boleh dikatakan" -> hapus

      ### Pola 4: Kesimpulan serbaguna

      - "masa depan bisa dinanti" -> tutup dengan ketegangan yang belum terselesaikan
      - "masa depannya tak terbatas" -> hapus
      - "penuh harapan" -> tulis langkah berikutnya yang konkret

      ### Pola 5: Struktur paragraf bergaya makalah

      Kalau kalimat pembuka berikut muncul di novel = invasi AI:
      - "tidak sulit dilihat", "dari sini dapat diketahui", "sesungguhnya", "berdasarkan uraian di atas"

      ### Pola 6: Kata penghubung bahasa tulis membanjir

      Yang sering muncul dalam prosa naratif: "maka dari itu", "pada saat yang sama", "sehingga dengan demikian", "oleh karena itu", "memang benar" -> ganti dengan padanan lisan atau hapus langsung.

      ### Pola 7: Kegemaran tiga paralelisme berderet

      AI suka menggenapkan segala sesuatu menjadi tiga supaya terasa "lengkap". -> Potong sampai hanya menyisakan satu yang paling kuat.

      ### Pola 8: Nada penjelas / sudut pandang maha tahu / rasa diatur

      Narator keluar dari kekinian tokoh untuk menjelaskan, membocorkan, merangkum, melabeli, dan mengangkat makna, sehingga pembaca bisa mencium aroma "penulis hadir di ruangan" dan "alur cerita sudah diatur rapi". Inilah sumber dari "rasa berkhotbah / rasa maha tahu / nada penjelas / rasa mekanis / rasa dipaksakan / rasa diatur".

      | Perwujudan | Contoh (hapus/ubah) |
      |---|---|
      | Menjelaskan sebab-akibat | "alasan ... adalah karena", "ternyata ...", "ini berarti", "justru karena" -> hapus. Sebab-akibat hanya boleh disusun sendiri oleh pembaca dari aksi, dialog, dan reaksi tokoh |
      | Bocoran sudut pandang maha tahu | "yang tidak dia ketahui adalah", "tanpa disadarinya", "bertahun-tahun kemudian", "entah bagaimana takdir mengatur", "seolah menandakan" -> hapus. Tulis hanya yang diketahui tokoh saat itu, biarkan pembaca sendiri yang tergantung penasaran |
      | Menyimpulkan atau melabeli bagi pembaca | "aktingnya bagus sekali", "sandiwara ini sudah pernah dia tonton", "dia memang orang yang setipis itu perasaannya" -> hapus. Pajang buktinya (mimik, aksi, dialog), pelabelan diserahkan kepada pembaca |
      | Merangkum batin bagi tokoh | "dia paham, semua ini adalah takdir" -> ganti dengan satu kilasan pikiran yang berprasangka atau satu reaksi tubuh |
      | Rantai rangkuman, motif, dan penilaian mengisi makna sampai penuh | "dia akhirnya mengerti", "ini pilihan terbaik", "semua orang akan mengingat momen ini" -> hapus pelabelannya, ubah menjadi celah konkret yang harus ditangani tokoh saat itu, aksi yang belum selesai, atau umpan balik setempat; bukan mempertahankan penilaiannya lalu menjejalkan benda atau aksi secara paksa |
      | Rasa diatur / pengantar yang dipaksakan | Menerangkan latar secara paksa demi teks berikutnya, kilas balik satu paragraf penuh -> latar dibawa keluar menurut yang sungguh dibutuhkan tokoh saat itu, lewat kilasan pikiran, setengah kalimat, atau serpihan benda, jangan diterangkan terpusat |
      | Penutup bergaya pemuliaan | Penutup berpasangan rapi yang mengangkat makna, kalimat emas penegas tema -> tutup dengan satu aksi atau satu kalimat yang menyisakan ruang, tekan "maknanya" ke dalam gambar |
      | Takdir abstrak / pembukaan dan penutupan abstrak | "takdir akhirnya menyingkap taringnya", "papan catur yang sudah lama disiapkan", "pada saat ini akhirnya dia mengerti", "serangan balasan yang menjadi miliknya baru saja dimulai" -> ubah menjadi dokumen, aksi, dialog, atau akibat fisik yang bisa dilihat tokoh saat itu |
      | Kerapatan kata klise terlalu tinggi | bagaikan/seberkas/segaris/menarik napas panjang/tenang tanpa riak/sendi tangan memutih dan semacamnya muncul berulang berderet -> bukan merotasi sinonim, tetapi seluruh paragraf dikembalikan ke bukti yang ada di kekinian tokoh |
      | Kerapatan metafora terlalu tinggi | Penanda metafora seperti seperti/sepertinya/bagaikan/seumpama muncul berulang bergerombol -> pertahankan satu atau dua yang paling bisa menyampaikan informasi atau emosi, sisanya dikembalikan menjadi aksi, benda, suara, atau akibat yang konkret |
      | Nada surat resmi pengumuman sistem terlalu rapat | Kata aturan yang keras bergerombol di dalam aturan berkurung siku, panel, atau baris pengumuman -> pertahankan sebagai pembawa layar, pengumuman, atau aturan yang dilihat tokoh; bahasa-sehari-harikan hanya sebagian kata keras di dalam pembawa itu, atau tambahkan akibat konkret yang langsung dipahami tokoh di tempat |

      **Satu lapis yang lebih terselubung (paling sukar diperiksa sendiri, tanpa kata penanda)**:
      - Adverbia atau pelengkap menghakimi: "perhatiannya pas sekali kadarnya", "tertawanya persis sekali proporsinya", "tidak lebih tidak kurang" -> penulis sedang mencapkan bagi pembaca bahwa "ini pura-pura". Tulis aksinya saja, pura-pura atau tidak biarkan pembaca menilai sendiri.
      - Menelanjangi subteks bergaya bocoran: "senyum sekelumit itu terlihat jelas olehnya", "siapa pun bisa melihat dia sedang berbohong" -> yang tersembunyi jadi ditelanjangi. Biarkan tersimpan, jangan dibongkar.
      - Metafora melabeli / kalimat penutup peti mati: "seperti sedang menjatuhkan putusan atas hal yang sudah lama ditetapkan", "seperti memandang sebuah benda mati" -> metaforanya sedang menyimpulkan atas nama tokoh. Kalau bukan rasa subjektif yang kuat pada diri tokoh saat itu, hapus; kalau mau dipertahankan, ia hanya boleh berupa rasa sekilas tokoh yang berprasangka, bukan pernyataan objektif.

      Pemeriksaan mandiri: tanyakan sekali pada setiap kalimat, apakah ini "tokoh sedang mengalami", atau "penulis sedang menerangkan/mengatur"? Setiap tempat di mana penulis melompat keluar untuk menerangkan, hapus, atau ubah menjadi sajian dari dalam sudut pandang tokoh.

      Prioritas cara perbaikan: hapus dulu atau ganti di tempat kalimat yang tercemar, jangan menambal "rasa manusia" berupa ekor di akhir paragraf. Kalau perlu menambah informasi, ubah kalimat rangkuman, motif, atau penilaian yang lama menjadi tekanan konkret yang bisa disentuh tokoh saat itu, seperti masalah yang harus dibereskan, prosedur, surat balasan, pembayaran, atau suara di luar pintu; kalau ponsel, layar, pengumuman, papan nama, atau formulir sudah ada informasinya, utamakan mempertahankannya sebagai pembawa di dalam adegan yang dilihat tokoh, jangan dialihtulis menjadi penjelasan narator.

      **Titik hambat tugas bukan formula tetap**: ia hanya mendaratkan kembali penjelasan yang sudah ada ke celah yang harus ditangani tokoh saat itu. Tanyakan dulu apakah teks asli punya "urusan yang harus dibereskan" dan "titik yang menghambat"; kalau ada, baru boleh ditekan menjadi titik hambat tugas; kalau tidak ada, cukup hapus penjelasannya atau ubah menjadi aksi/dialog, jangan mengarang rantai kejadian baru. Setelah diubah, lakukan lagi "coba hapus dulu": kalau setelah dihapus informasi, emosi, relasi, harga yang dibayar, atau petunjuk awal tidak terpengaruh, ringkas atau hapus saja.

      **Tetapi menghapus nada penjelas bukan berarti membuat pembaca bingung**: saat istilah baru, latar baru, atau alat peraga baru pertama kali muncul, pembaca tetap harus bisa memegang satu jangkar. Lewat reaksi aksi tokoh, sebutan wajar setengah kalimat di dalam dialog, atau akibat fisik di dalam adegan, bawa keluar dengan satu goresan fungsinya atau bobotnya saat itu. Jangan menceritakan asal-usul dan prinsipnya satu paragraf penuh, tetapi jangan pula sekadar melempar kata asing tanpa informasi lalu membiarkan pembaca kebingungan. Ingatan tokoh, bantalan emosi, dan sambungan sebab-akibat juga sama: kalau satu kalimat sepertinya penjelasan atau penilaian tetapi sebenarnya memikul keterpaduan kecil, jangan dihapus secara mekanis sampai jadi daftar kutipan; tekan saja menjadi bahasa sehari-hari, aksi, benda, atau setengah pikiran tokoh saat itu. Contoh: "kristal biru" pada kemunculan pertama jangan ditulis "ini adalah alat penyimpan ingatan", tetapi boleh ditulis dia menekankan kristal biru itu ke pelipisnya lalu serpihan ingatan orang lain meledak di depan matanya, fungsinya terlihat oleh pembaca, gambaran utuhnya disimpan sebagai ketegangan. Pembedanya: jangkar adalah akibat yang bisa dirasakan, ingatan, atau sambungan emosi yang ditubruk tokoh saat itu, sedangkan penjelasan adalah penulis melompat keluar untuk menceritakan asal-usul atau prinsip latar dan menyimpulkan bagi pembaca.

      ### Pola 9: Pemadatan berlebihan (gaya telegram)

      Sidik jari kebalikan akibat penghapusan aroma AI yang kelewatan. Setiap kalimat ditekan sampai terpendek, kata tugas penstruktur tersapu habis, dan setiap aksi ditambahi satu reaksi ringan gaya "sedikit/sejenak". Dilihat satu per satu kalimatnya tampak bersih, dibaca berurutan mirip kerangka, dan rasa yang diterima pembaca adalah "tidak lancar, sesak napas". Sasaran pengurangan adalah menghapus omong kosong (penjelasan, pengencer, pengisi hitungan), bukan menghapus keberlebihan alami bahasa Indonesia.

      | Perwujudan | Cara perbaikan |
      |---|---|
      | Kalimat naratif nonpuncak pun semuanya ditekan sampai terpendek | Kalimat pukulan berat tetap ringkas dan cepat; pengantar, peralihan, dan aksi sehari-hari ditulis sebagai kalimat bahasa sehari-hari yang wajar, dengan mempertahankan kata tugas penstruktur seperti sudah/yang/pun/ketika |
      | Mikroaksi gaya "menarik sedikit/berhenti sejenak/menepuk dua kali/melonggarkan setengah putaran" muncul berulang dengan kerapatan tinggi | Gabungkan aksinya, ganti dengan detail yang konkret; tidak setiap aksi perlu disambung ekor reaksi |
      | Adverbia penegas (bahkan/baru/lagi/hanya/seluruhnya/justru sebaliknya) tersapu habis | Nilai semantiknya sebelum menghapus: yang memikul makna rancangan tokoh, pembandingan, atau sindiran dipertahankan |
      | Kata seru dalam dialog dinolkan | Pertahankan partikel bernada wajar berfrekuensi rendah seperti kok/deh/sih menurut tokohnya; tetapi juga jangan ditambah bertubi-tubi ke arah sebaliknya |
      | Narasi menyisakan nada surat resmi atau nada klasik (tidak diperkenankan/wajib/belum/telah pula/saat ini) | Ganti dengan bahasa sehari-hari; pengumuman sistem, pasal aturan, dan siaran panel boleh mempertahankan fungsi yang dingin dan keras |
      | Paragraf naratif pendek bergerombol di dalam teks panjang | Tangani hanya kalimat peralihan yang dibaca seperti kerangka, gabungkan kembali ke bidikan kamera yang sama |
      | Narasi di luar tanda kutip berkerapatan penghubung rendah dan kekurangan kalimat sedang-panjang | Pulihkan hanya penghubung, penunjuk, dan kalimat penyambung sedang-panjang yang perlu di lapis narasi, jangan menangani dialog, komentar berjalan, dan siaran sistem yang secara alami ringkas dan cepat |

      Pemeriksaan mandiri: setelah selesai menghapus, baca berurutan sekali; kalau rasa bacanya seperti kerangka atau seperti komando berderet, berarti penghapusannya kelewatan. Pulihkan kalimat nonpuncak menjadi bahasa sehari-hari yang wajar, bukan terus menghapus. Kata terlarang, pola kalimat klise, dan batin bergaya memberi tahu tetap dihapus dan diubah seperti seharusnya; yang diisi kembali hanya kata tugas penstruktur dan penghubung, bukan memulihkan diksi templat.

      ### Pola 10: Kewajaran palsu hasil revisi kedua (inversi berminyak / daftar aksi bergaya pengawasan / dialog diindikatorkan)

      Beberapa "prompt antideteksi" akan mendorong teks ke templat jenis lain: menginversi kalimat sembarangan demi menaikkan keterkejutan, menambahkan salah ucap dan kata kotor secara mekanis demi rasa manusia asli, memaksa ganti baris tiap kalimat demi pembacaan di ponsel, dan mengubah batin serta narasi menjadi dialog secara paksa demi porsi dialog. Semua itu bukan novel daring yang wajar, itu jejak revisi kedua.

      | Perwujudan | Cara perbaikan |
      |---|---|
      | Inversi berminyak | Jangan menulis aksi pengiring di depan seperti "sambil menggenggam pisau di tangannya, dia menerjang maju". Saat subjeknya sama berturut-turut, utamakan mengganti awal kalimat secara wajar dengan benda di dalam adegan, suara, bagian tubuh tertentu, atau umpan balik lingkungan; jangan menyalahgunakan personifikasi benda mati |
      | Daftar aksi gaya kamera pengawas | Rentetan "mengulurkan tangan mengambil, meraih, menyingkap, meletakkan, berbalik ..." dalam satu paragraf mirip tabel langkah. Gabungkan aksi remeh, pertahankan hanya aksi yang berfungsi emosi, alur cerita, atau keruangan; kalau perlu, pakai keraguan tokoh, salah tafsir, reaksi orang sekitar, atau umpan balik lingkungan sebagai bantalan |
      | Kesalahan mengeringkan adegan bertekanan tinggi | Konflik, pengejaran, dan duel boleh dibuang penjelasan dan lem logikanya; keseharian, kemesraan, dan pengantar tidak boleh dikeringkan sebab penuh. Yang dihapus adalah omong kosong, bukan penghubung wajar seperti "yang/sudah/pun/tetapi" |
      | Kata tertelan dan kata bocor | Kalau verbanya tanpa objek, arah aksinya tidak jelas, atau pembaca tidak tahu siapa melakukan apa kepada siapa, kembalikan objek, benda pemikul, atau umpan balik fisik yang diperlukan |
      | Dialog diindikatorkan | Jangan memperbanyak dialog secara paksa demi menggenapi porsi dialog 50%-60%. Dialog hanya ditambah kalau tokoh memang akan dan harus mengatakannya saat itu; dialog yang bersifat penjelasan lebih baik ditekan menjadi konflik, penghindaran, atau informasi setengah kalimat |
      | Spekulasi format keras | Jangan memaksa ganti baris tiap kalimat, jangan memaksa 50-60 karakter satu baris, jangan mengubah titik-titik menjadi titik gaya Inggris, jangan mengubah semua partikel keterangan/pelengkap sampai salah. Ikuti format yang sudah ada di platform dan proyek |

      Catatan daftar aksi bukan blocking. Kalau rantai aksi pada duel, pengejaran, atau langkah upacara yang fungsional memang memikul informasi, ia boleh dipertahankan atau ditandai `[perlu telaah]`.

      #### Menulis kalimat bergaya kerangka menjadi paragraf yang bersinambung

      Kalau teks sudah tidak punya blocking atau advisory yang jelas, tetapi dibaca masih seperti kerangka, tangani hanya bagian yang retak:
      1. Tandai paragraf yang dibaca seperti laporan logika: rantai penilaian seperti "dia tahu/dia paham/ini berarti/masalah sesungguhnya/harus/perlu" muncul berturut-turut, tetapi aksi, benda, atau umpan balik dialog pada saat itu tidak ada.
      2. Daratkan kesimpulan narator: ganti "dia menyadari/ini berarti" dengan akibat yang bisa disentuh, didengar, atau terpaksa ditangani tokoh saat itu. Jangan memakai daftar benda yang baku, dan jangan menjadikan kulit adegan tertentu sebagai aturan umum.
      3. Pulihkan penghubung wajar dan kata tugas penstruktur hanya di bagian yang retak; jangan menetapkan target rasio, jangan menambal penghubung secara mekanis.
      4. Pengumuman sistem, pasal aturan, dan siaran panel boleh mempertahankan kalimat pendek yang dingin dan keras; bahasa-sehari-harikan hanya sebagian kata aturan keras di dalam pembawa aslinya, atau biarkan tokoh melihat akibat konkretnya di tempat, jangan diubah menjadi penjelasan narator.

      Contoh:
      ```
      Terlalu dipadatkan:
      Lin Yao mengangkat kepala.
      Lampu jalan di luar kanopi hujan mati.
      Angin juga berhenti.
      Gelas kertas di meja kasir bergoyang dua kali.

      Setelah dibuat lancar:
      Ketika Lin Yao mengangkat kepala, lampu jalan di luar kanopi hujan sedang mati satu per satu. Angin tiba-tiba berhenti, gelas kertas di meja kasir masih berputar pelan di tempatnya.
      ```

      ## Metode Tiga Lintasan Penghilangan Aroma AI Sistematis

      ### Lintasan 1: Buang generik (Strip Generic)
      - Kalimat rangkuman emosi abstrak -> hapus atau ganti dengan aksi konkret
      - Kalimat berkedalaman palsu -> hapus
      - Pengembungan makna -> perkecil menjadi dampak konkret
      - Kesimpulan kosong -> hapus
      - Pola kalimat pembanding yang rapi berpasangan -> pecah dan tulis ulang
      - Tumpukan kata sifat dekoratif -> deskripsi lugas
      - Pemakaian berlebihan "maka", "namun", "saat ini" -> hapus separuhnya
      - Semua tokoh berbicara sama "berkelasnya" -> bedakan nadanya

      **Prinsip**: kalau bisa dihapus hapus, kalau tidak bisa dihapus ganti dengan detail konkret. Lintasan ini menghilangkan 80% aroma AI.

      ### Lintasan 2: Buang nada formal (Cut Professional Diction)
      - Diksi analitis ("mekanisme", "struktur", "logika", "sistem" muncul di dalam novel) -> ganti dengan ungkapan sehari-hari
      - Penyalahgunaan nomina abstrak -> katakan langsung urusannya
      - Diksi birokratis ("lebih lanjut", "secara mendalam", "mendorong", "merealisasikan") -> hapus
      - Tumpukan istilah teknis -> pertahankan hanya yang perlu, jelaskan dengan bahasa sehari-hari

      **Pengecualian**: pertahankan pada adegan yang memang butuh rasa profesional (diksi formal pada genre bertema sejarah, kerapatan yang disengaja pada karya berorientasi sastra, majas hiperbola pada komedi).

      ### Lintasan 3: Kembalikan rasa wajar (Restore Natural Presence)
      - Detail indrawi yang konkret (bau, suhu, rasa sentuhan)
      - Pembedaan cara bicara tokoh (orang berbeda nada berbeda)
      - Variasi awal kalimat: kalau 3+ kalimat berturut-turut memakai subjek yang sama atau kelas kata yang sama sebagai pembuka, ganti cara membukanya (aksi, adegan, pengantar dialog)
      - Variasi irama (kalimat panjang dan pendek berselang-seling): setel panjang kalimat dan paragraf secara wajar menurut beat emosi, dorongan aksi, dan unit dramatis; hindari beberapa paragraf berturut-turut berpanjang sama, hindari pula hancur jadi kerangka demi memenuhi target pendek. Panjang pendek bukan acak: di tempat pengendapan boleh diperlambat, di tempat konflik atau pembalikan boleh dipendekkan mendadak, sementara penalaran utuh dan rantai emosi diutamakan tetap bersinambung
      - Dialog yang berasa posisi sosial (atasan dan bawahan bicaranya berbeda)
      - Titik ingat yang khas bagi adegan itu
      - Kebiasaan bahasa yang khas bagi proyek itu (kalimat khas tokoh)

      **Prinsip**: lebih sedikit itu lebih banyak. Menambah 1-2 detail konkret per paragraf sudah cukup.

      ### Strategi Peningkatan

      | Derajat aroma AI | Strategi |
      |----------|------|
      | Ringan | Hanya lakukan Lintasan 1 |
      | Sedang | Lintasan 1 + Lintasan 2 |
      | Berat | Tiga lintasan penuh + tulis ulang paragraf penting |

      ### Daftar Pemeriksaan Mandiri
      - Pemeriksaan kewajaran dialog: apakah dialog memakai ungkapan bernada lisan, apakah bahasa tulis atau nada formal sudah dihindari
      - Kalau satu kalimat mana pun dihapus, apakah pemahaman terpengaruh? Tidak = mungkin berlebih
      - Apakah tokoh yang berbeda bisa dibedakan lewat dialognya?
      - Apakah ada satu detail yang khas bagi adegan ini?

      ## Teknik Tambahan Penghilangan Aroma AI

      ### Show vs Tell

      | Jenis pemberitahuan | Cara tulis AI | Cara tulis wajar |
      |----------|--------|----------|
      | Memberi tahu rasa menanti | "dia sangat menantikannya" | Tunjukkan rantai menanti -> emosi -> terpuaskan |
      | Memberi tahu tujuan tokoh | "dia ingin bercerai" | Tunjukkan tujuannya lewat tindakan |
      | Memberi tahu sikap tokoh | "dia sangat tenang" | Wujudkan lewat dialog dan reaksi |
      | Memberi tahu arah alur cerita | "berikutnya akan terjadi hal besar" | Tunjukkan lewat pengantar -> pembalikan -> kelanjutan |

      ### Deskripsi batin yang meresap tanpa terasa

      - Menambahkan kurung untuk menandai kegiatan batin = merusak rasa terbawa masuk
      - Monolog batin panjang yang menjelaskan motif = tanda tangan AI
      - Menulis langsung "dia merasa", "dia menyadari" = memberitahukan emosi

      **Cara tulis wajar**: kegiatan batin melebur wajar ke dalam narasi, pakai perilaku untuk mengisyaratkan batin, pakai kebisuan, aksi, atau perilaku yang tidak biasa untuk mengungkapkan isi hati.

      ### Pemeriksaan rasa terbawa masuk
      - Apakah perilaku tokoh utama bisa dipahami, diresapi, dan diterima pembaca?
      - Apakah tokoh antagonisnya cukup kuat? (antagonis lemah = pembaca merasa kemenangan tokoh utama tidak bermakna)
      - Apakah perilaku ditulis berputar di sekitar rancangan tokoh? (perilaku, bahasa, dan cara berpikir terbentang dari kepribadiannya)
      - Apakah informasi yang sudah diketahui pembaca dikendalikan secara efektif? (selisih informasi menciptakan riak emosi)

      ## Pustaka Contoh Penulisan Ulang

      ### Contoh eksternalisasi emosi

      **Gugup**
      - "dia merasa gugup sesaat, jantungnya tanpa sadar berdetak lebih cepat"
      - Dia mengepalkan gelas kertas di tangannya, airnya sedikit tumpah keluar

      **Murka**
      - "kemurkaan menyala di dalam hatinya, dia tak kuasa mengepalkan tangannya"
      - Dia menggebrakkan sumpitnya ke meja, kuah di mangkuk terpecik keluar

      **Sedih**
      - "seberkas kesedihan membanjir ke dalam hatinya, kilau air mata melintas di matanya"
      - Dia menunduk mengaduk kopinya, mengaduk lama sekali

      **Takut**
      - "ketakutan seketika menyelubunginya, dia merasakan gigil sesaat"
      - Punggungnya menempel di dinding, tidak berani bergerak

      **Kecewa**
      - "dia merasa seberkas kehilangan, hatinya bagaikan dicengkeram sesuatu"
      - "Oh." Dia mengunci layar ponselnya

      **Terkejut**
      - "pupil matanya mengecil sedikit, jelas tidak menyangka akan mendengar kata-kata seperti itu"
      - Dia membuka mulutnya sedikit, tidak sepatah kata pun keluar

      ### Contoh deskripsi adegan

      **Adegan bergaya AI**
      - "Cahaya matahari menyiram masuk lewat celah gorden, menjatuhkan bayang cahaya yang beragam di atas lantai. Di udara mengambang wangi bunga yang samar, bagaikan seluruh dunia sedang terbenam dalam atmosfer yang tenang dan damai."
      - Jam tiga siang, di ruang tamu hanya ada jam yang berjalan.

      **Cuaca bergaya AI**
      - "Langit muram menggantung, awan hitam bertumpuk padat, bagaikan hujan lebat bisa turun kapan saja. Angin dingin yang menggigit melolong berlalu, membawa seberkas hawa dingin yang menusuk tulang."
      - Hujan mau turun. Angin membuat pakaian yang dijemur di luar bergoyang liar.

      **Duel bergaya AI**
      - "Kepalannya bagaikan angin kencang dan hujan deras yang menghantam, setiap pukulan mengandung kekuatan yang tak terbantahkan. Pupil mata lawannya mengecil sedikit, jelas tidak menduga serangan yang begitu tajam."
      - Dia menyodok satu kepalan, lawannya tidak berhasil mengelak, sudut bibirnya pecah.

      ### Contoh penulisan ulang penutup

      **Penutup bergaya pemuliaan** -> "Dia berdiri di depan jendela, memandang garis langit di kejauhan, akhirnya memahami makna sejati kehidupan: kadang-kadang, melepaskan adalah pilihan terbaik." -> Dia mematikan rokoknya, masuk kamar tidur.

      **Penutup bergaya rangkuman** -> "Pada saat ini, segalanya telah berubah. Dia tahu, mulai hari ini, hidupnya akan membuka lembaran yang baru." -> Dia menutup pintu itu. Tidak menoleh.

      **Penutup bergaya keluh haru** -> "Waktu berlalu diam-diam bagaikan air mengalir ..." -> Hapus saja paragraf semacam ini.

      ### Contoh penyesuaian irama

      **Kalimat paralel**
      - "Dia menatap matanya, menatap bibirnya, menatap bulu matanya yang bergetar samar, di dalam hatinya membumbung sebuah rasa yang sukar dinamai."
      - Dia menatapnya. Perempuan itu tidak berkata apa-apa.

      **Kalimat panjang dipecah pendek**
      - "Ketika dia akhirnya mendorong pintu kayu yang berat itu, yang terpampang di depan matanya adalah sebuah kamar yang gelap, di udara mengambang hawa yang usang, di sudut dinding bertumpuk penuh kotak-kotak yang tertutup debu."
      - Pintu terbuka. Di dalam gelap, di sudut bertumpuk beberapa kotak, semuanya berdebu.

      **Paragraf yang terlalu rapi dipecah**
      - "Dia menyukai bunga musim semi, menyukai cahaya matahari musim panas, menyukai daun jatuh musim gugur, menyukai salju putih musim dingin. Setiap musim punya keindahannya yang khas."
      - Dia suka musim semi. Musim lain ya lumayan.

      ## Pustaka Contoh Penulisan Ulang Dialog Konflik

      ### Dialog lembut bergaya AI
      - "Kurasa caramu melakukan ini kurang tepat, bisakah kamu mempertimbangkan perasaanku?" -> "Aku masih ada di matamu?"

      ### Penjelasan sempurna bergaya AI
      - "Sebenarnya aku melakukan ini ada alasannya, karena keadaan saat itu sangat rumit ..." -> "Kamu bisa apa?" Dia meletakkan cangkir teh itu keras-keras.

      ### Contoh lima tingkat gradasi emosi dialog

      Pada adegan konflik yang sama, dari lemah ke kuat:
      1. **Pernyataan objektif**: "Kamu membuang barangku."
      2. **Pernyataan + saran**: "Kamu membuang barangku, ke depannya bisa nggak bilang dulu ke aku."
      3. **Tuduhan subjektif**: "Atas dasar apa kamu menyentuh barangku."
      4. **Tuduhan + perintah**: "Kamu ini apa sih, pantas juga menyentuh barangku? Keluar."
      5. **Tuduhan + PUA**: "Aku melayani makanmu, melayani pakaianmu, satu barang saja kamu nggak bisa taruh dengan benar. Seumur hidup kamu ya cuma begini, lepas dari aku kamu bukan apa-apa."

      ### Contoh penulisan ulang keterkejutan berlapis

      **Sekali jadi bergaya AI**: Semua orang terkejut, tidak percaya pada telinga mereka sendiri.

      **Keterkejutan berlapis yang wajar**:
      1. Tangan pria di seberang bergetar sedikit, air di cangkir tehnya tumpah keluar.
      2. Orang-orang di sebelah bertukar pandang. Ada yang mundur satu langkah. Di sudut ruangan ada yang mulai mengeluarkan ponsel.
      3. Perempuan yang tadi masih tinggi hati, senyum di wajahnya membeku. Dia membuka mulutnya sedikit, satu kata pun tidak keluar.

      ### Contoh perbaikan rasa terbawa masuk

      **Tokoh utama pasif**: Dia sangat takut, tidak tahu harus bagaimana, hanya bisa menunggu perkara itu berlalu.

      **Tokoh utama aktif**: Dia mengunci pintu, mengubah ponselnya ke mode senyap, lalu menyalakan perekam.

      ## Daftar Pemeriksaan Mutu

      Setelah setiap bab selesai ditulis, pindai butir per butir menurut daftar ini:
      - [ ] **Kendali paragraf**: paragraf dipotong menurut perubahan aksi atau informasi, dibaca tidak tersendat
      - [ ] **Isi utama tanpa tanda pisah**: isi utama (termasuk narasi dan dialog) tanpa `——`/`—`/`--` (pakai titik, koma, kalimat pendek, atau pemotongan kalimat lewat aksi), tanpa menetapkan pengecualian untuk dialog
      - [ ] **Pemindaian kata berfrekuensi tinggi khas AI**: tanpa tak kuasa/bagaikan/terpampang di depan mata/membatin dalam hati/berkata dengan suara berat/sudut bibirnya terangkat tipis/tanpa sadar/tampak terlihat
      - [ ] **Hitungan adverbia pelembut**: "sedikit/samar/perlahan/lembut" tidak lebih dari 3 buah per 1000 kata
      - [ ] **Tanpa tiga paralelisme berderet**: tidak ada majas "satu kelompok tiga" bergaya AI
      - [ ] **Tanpa gaya makalah**: tanpa "tidak sulit dilihat/dari sini dapat diketahui/sesungguhnya/berdasarkan uraian di atas"
      - [ ] **Tanpa tumpukan kata penghubung bahasa tulis**: tanpa banjir "maka dari itu/pada saat yang sama/sehingga dengan demikian/oleh karena itu/memang benar"
      - [ ] **Akhir bab tanpa rangkuman dan pemuliaan**: ditutup dengan aksi, dialog, atau ketegangan menggantung, tanpa renungan, filosofi, atau pengumuman
      - [ ] **Tanpa deskripsi batin panjang**: kegiatan batin tidak lebih dari 2 paragraf, tanpa penandaan isi hati dalam kurung
      - [ ] **Emosi ditunjukkan lewat aksi**: tanpa menulis langsung "murka/sedih/gugup", semuanya memakai reaksi tubuh
      - [ ] **Dialog bernada lisan**: tanpa nada bahasa tulis, nada tokoh yang berbeda bisa dibedakan
      - [ ] **Tanda baca tidak dipipihkan**: tidak menekan seluruh pertanyaan mendesak, ledakan, dan keraguan menjadi titik; juga tidak menumpuk `?`/`!` secara acak atau mengarang jeda secara paksa dengan `……`/`——`
      - [ ] **Show Don't Tell**: pakai perilaku sebagai ganti kata sifat, pakai detail sebagai ganti rangkuman
      - [ ] **Panjang kalimat cocok dengan adegan**: paragraf duel dan konflik lebih pendek, paragraf keseharian dan deskripsi boleh agak panjang, tetapi pembacaan lantang tidak tersendat dan informasi tidak kelebihan beban
      - [ ] **Risiko gaya telegram rendah**: narasi nonpuncak mempertahankan kata tugas yang wajar, mikroaksi gaya "sedikit/sejenak" tidak dibaca berulang; reaksi ringan yang fungsional boleh dipertahankan atau ditandai `[perlu telaah]`
      - [ ] **Nada rangkuman abstrak rendah**: takdir/papan catur/pada saat ini akhirnya mengerti/baru saja dimulai tidak muncul berulang berderet; penutup diutamakan ditutup dengan aksi, benda, atau masalah yang belum terselesaikan
      - [ ] **Tumpukan kata klise rendah**: kata klise berisiko tinggi seperti bagaikan/seberkas/segaris/menarik napas panjang/tenang tanpa riak tidak bergerombol; baru dibuat konkret kalau memang bernada templat, jangan sekadar merotasi sinonim
      - [ ] **Tumpukan metafora rendah**: seperti/sepertinya/bagaikan/seumpama tidak muncul berulang bergerombol; sisakan hanya metafora yang paling berfungsi, sisanya dikembalikan menjadi gambar konkret, jangan menggantinya dengan sekumpulan metafora baru
      - [ ] **Nada laporan rantai penjelasan rendah**: rantai penilaian seperti tahu/paham/ini berarti/harus/perlu tidak bergerombol; baru didaratkan ke aksi, benda, dialog, dan umpan balik di tempat kalau memang bernada laporan
      - [ ] **Nada surat resmi pengumuman sistem rendah**: kata aturan yang keras di dalam aturan berkurung siku, panel, atau baris pengumuman tidak bergerombol berderet; pertahankan sebagai pembawa di dalam adegan, bahasa-sehari-harikan hanya sebagian kata keras di dalam pembawa itu atau tambahkan akibat konkret yang langsung dipahami tokoh di tempat
      - [ ] **Sedikit paragraf pendek yang terlalu diringkas tanpa penjelasan / kerapatan penghubung rendah**: paragraf naratif pendek di dalam teks panjang tidak tampil sebagai kerangka atau gaya telegram; kalau memang terasa retak, tambal hanya bagian yang retak, kata tugas penstruktur yang perlu, dan kelompok kalimat sedang-panjang, dilarang mengencerkan secara mekanis
      - [ ] **Sedikit daftar aksi bergaya pengawasan**: dalam satu paragraf jangan merentetkan langkah remeh gaya "mengulurkan tangan/mengambil/meraih/meletakkan/berbalik"; nilai dulu apakah rantai aksinya memikul fungsi duel, pengejaran, upacara, atau informasi, baru gabungkan aksinya dan tambahkan bantalan sudut pandang kalau memang berupa tabel langkah
      - [ ] **Tidak berspekulasi dengan indikator keras**: jangan memaksa ganti baris tiap kalimat, 50-60 karakter satu baris, dialog 50%-60%, titik-titik gaya Inggris, atau mengubah semua partikel keterangan/pelengkap menjadi partikel atribut demi antideteksi
      - [ ] **Titik hambat tugas tunduk pada batas teks asli**: kalau rangkuman abstrak diubah menjadi tokoh yang terhambat saat membereskan urusan, itu wajib berasal dari celah tugas, bukti, prosedur, atau benda yang sudah ada di teks asli; jangan menambah rantai kejadian yang tidak ada di teks asli
      - [ ] **Pelaksanaan metode tiga lintasan penghilangan aroma AI**: ringan hanya Lintasan 1, sedang Lintasan 1+2, berat tiga lintasan penuh
      - [ ] **Uji kewajaran dialog**: tanpa jejak bahasa tulis = lulus
