content: |
  # Instruksi Eksekusi Desain Dialog

  Pilih dulu mode dialog berdasarkan "Rute Keputusan", lalu rancang adegan mengikuti aturan operasi yang sesuai; metodologi lengkap, contoh, ambang batas, dan butir pemeriksaan ada pada "Metodologi Asli Desain Dialog" di bawah. Dialog tidak boleh ditulis hanya sebagai pertukaran informasi: setiap baris dialog minimal harus mendorong alur cerita, menambah rasa penasaran, atau memperlihatkan watak tokoh, dan pada adegan emosional harus menanggapi keadaan emosi baris sebelumnya. Setelah selesai, jalankan satu per satu pemeriksaan kualitas dan lembar kerja pada metodologi asli.
