    content: |
      # Manual Operasional Busur Emosi

      ## Tabel Rute Keputusan

      | Efek emosi yang ingin kamu tulis | Pilih busur ini | Poin kunci |
      |------------------|-----------|----------|
      | Menderita habis lalu berbalik menang | Bentuk V | Dasar jurang di 60-70%, penyembuhan naik cepat |
      | Manis lalu ditusuk mati (BE) | Bentuk V terbalik | Titik tinggi di 40-50%, kejatuhan lebih cepat daripada pendakian |
      | Banyak titik balik yang tak tertebak | Bentuk W | Setiap puncak lebih tinggi dari sebelumnya, maksimal 3 gelombang |
      | Tamparan berlapis yang terus meningkat | Bentuk progresif | Tanpa penurunan, seperti tangga yang menanjak |
      | Menahan diri lalu meledak besar | Kepuasan tertunda | 70-80% awal jadi landasan, ledakan terpusat di bagian akhir |
      | Akhir yang menjungkirkan | Bentuk banting arah | Banting arah di 70-80%, petunjuk awal sebelumnya harus masuk akal saat ditengok kembali |

      Dua jenis busur boleh ditumpuk (misalnya "kepuasan tertunda + banting arah"), tidak lebih dari dua.

      ## Panduan Cepat Enam Busur

      ### Satu, busur bentuk V (penderitaan -> penyembuhan)

      ```
      emosi
      10 |          *
       9 |         / \
       7 |        /   \
       6 |       /     *  titik tinggi penyembuhan
       1 |  *  dasar jurang penderitaan
         +------------------> progres
           0%  40%  70%  100%
      ```

      Poin operasional: letakkan dasar jurang di 60-70%, penyembuhan naik dengan cepat, emosi penutup wajib lebih tinggi daripada titik awal; dasar jurang harus cukup dalam, titik balik harus mendadak, penyembuhan jangan berlarut, dasar jurang cukup bertahan 1-2 adegan lalu langsung berbalik.

      | Tema | Bagian penderitaan | Bagian penyembuhan |
      |------|----------|------------|
      | Reinkarnasi balas dendam | Disiksa di kehidupan sebelumnya | Berbalik menang setelah terlahir ulang |
      | Cinta yang bersatu kembali | Kepedihan perpisahan | Kembali bersama |
      | Kasih keluarga pengundang tangis | Kesalahpahaman/rasa berutang | Rekonsiliasi/memahami kebenaran |
      | Pendewasaan dan penyembuhan | Terjatuh ke titik terendah | Berdiri kembali |

      Alokasi jumlah kata (12000 kata): pembukaan 10% -> penurunan 30% -> dasar jurang 15% -> titik balik 10% -> pendakian penyembuhan 25% -> penutupan di titik tinggi 10%.

      ### Dua, busur bentuk V terbalik (kepuasan -> titik balik -> jurang)

      ```
      emosi
      10 |     *
       5 | *     \
       1 |        *  titik jatuh BE
         +------------------> progres
           0%  30%  60%  100%
      ```

      Poin operasional: letakkan titik tinggi di 40-50%, setelah titik balik langsung meluncur jatuh; kecepatan jatuh wajib lebih cepat daripada pendakian, akhir BE jangan diberi pemanis.

      | Tema | Bagian kepuasan | Bagian kejatuhan |
      |------|----------|------------|
      | Cinta menyiksa BE | Kemanisan/kebahagiaan | Kebenaran/perpisahan |
      | Karier yang terjungkal | Naik jabatan/sukses | Ternyata itu jebakan |
      | Pengkhianatan persahabatan | Kedekatan tanpa jarak | Perhitungan di balik punggung |
      | Kepercayaan yang runtuh | Percaya tanpa ragu | Kebenaran bahwa dirinya ditipu |

      Alokasi jumlah kata (12000 kata): awalan 10% -> pendakian 35% -> puncak 10% -> titik balik 5% -> kejatuhan 30% -> penutupan di jurang 10%.

      ### Tiga, busur bentuk W (banyak naik-turun)

      ```
      emosi
      10 |       *           *
       5 |  *         \ /
       4 |             *
         +--------------------> progres
           0%  20%  40%  60%  80%  100%
      ```

      Poin operasional: minimal dua puncak dan satu jurang, umumnya tiga gelombang; setiap puncak wajib lebih tinggi daripada puncak sebelumnya, puncak terakhir di 80-90%; antar gelombang wajib ada ruang bernapas, maksimal 3 gelombang.

      | Tema | Penjelasan |
      |------|------|
      | Misteri dengan banyak titik balik | Setiap kali pembaca merasa sudah menebak, muncul titik balik lagi |
      | Mengejar kembali istri yang sudah menyerah | Tarik-ulur berulang, setiap kali terasa sudah baikan lalu bermasalah lagi |
      | Perang bisnis penuh strategi | Saling serang balik, setiap kali terasa sudah menang lalu berbalik |

      Alokasi jumlah kata (15000 kata, 3 gelombang): awalan + puncak ke-1 25% -> jurang ke-1 10% -> puncak ke-2 25% -> jurang ke-2 10% -> puncak ke-3 20% -> penutupan 10%.

      ### Empat, busur progresif (peningkatan bertahap)

      ```
      emosi
      10 |                     *
       7 |             * /
       5 |       * /
       3 | * /
         +--------------------> progres
           0%  25%  50%  75%  100%
      ```

      Poin operasional: tidak boleh ada penurunan, harus seperti tangga yang menanjak setapak demi setapak; titik tertinggi di 85-95%, di tengah hanya berikan kemenangan kecil, jangan melepas kepuasan lebih awal.

      | Tema | Cara peningkatan |
      |------|----------|
      | Cerita tamparan yang memuaskan | Ditampar satu per satu, tiap tamparan lebih keras dari sebelumnya |
      | Pembongkaran berlapis | Setiap lapis kebenaran lebih mengguncang dari lapis sebelumnya |
      | Serangan balik dan pembalikan keadaan | Setiap langkah pembalikan lebih besar daripada langkah sebelumnya |

      Alokasi jumlah kata (10000 kata): penindasan 20% -> serangan balik tahap 1 20% -> serangan balik tahap 2 25% -> serangan balik tahap 3 25% -> penutupan 10%.

      ### Lima, busur kepuasan tertunda (landasan panjang -> ledakan)

      ```
      emosi
      10 |                       *
       5 |              *--------|
       3 |       *------         |
       1 | *------                |
         +-------------------------> progres
           0%  20%  40%  60%  80%  100%
      ```

      Poin operasional: 70-80% bagian awal untuk penindasan/landasan, 20-30% terakhir untuk ledakan terpusat; pada tahap landasan setiap bagian wajib punya muatan informasi dan ketegangan, tidak boleh membosankan; cara menindas harus bervariasi, ledakan harus padat, setelah meledak segera tutup.

      | Tema | Bagian penindasan | Bagian ledakan |
      |------|----------|------------|
      | Cerita balas dendam yang memuaskan | Menahan diri, berpura-pura lemah, ditindas | Berbalik menang dalam sekejap, perhitungan menyeluruh |
      | Pembongkaran jati diri | Menyembunyikan kekuatan/jati diri | Jati diri sebenarnya terbongkar, semua orang tercengang |
      | Rencana jangka panjang | Tokoh utama bergerak diam-diam | Semua bidak jatuh ke posisinya serentak |

      Alokasi jumlah kata (12000 kata): penindasan awal 20% -> landasan lapisan dalam 25% -> tekanan maksimum 15% -> pemicu ledakan 5% -> ledakan terpusat 25% -> penutupan 10%.

      ### Enam, busur banting arah (banting arah di 70-80%)

      ```
      emosi
      10 |                *  titik tinggi/rendah baru setelah banting arah
       8 |           *--/
       3 |      /
         +-------------------------> progres
           0%   30%   70%  80%  100%
      ```

      Poin operasional: 70-80% bagian awal mengikuti busur normal, di 70-80% mendadak berubah arah; banting arah hanya mengambil 1-2 bagian, petunjuk awal yang ditanam sebelumnya wajib masuk akal saat ditengok kembali.

      | Tema | Paruh awal | Setelah banting arah |
      |------|--------|--------|
      | Makin dipikir makin mengerikan | Kehidupan sehari-hari yang hangat | Kebenaran mengerikan muncul |
      | Jati diri yang tertukar | Narasi dari sudut pandang A | Ternyata dia B |
      | Motif yang berbalik | Disangka cinta | Ternyata kebencian/pemanfaatan |

      Alokasi jumlah kata (10000 kata): membangun ilusi 35% -> mendorong ilusi makin tinggi 30% -> titik tinggi ilusi 10% -> banting arah 5% -> kebenaran terbuka 15% -> penutupan emosi baru 5%.

      ## Empat Cara Menambah Tekanan di Bagian Tengah

      1. **Peningkatan ke ruang publik**: pindahkan luka yang tadinya privat ke ruang publik (jamuan keluarga, rapat perusahaan, siaran langsung, upacara).
      2. **Pengkhianatan ganda**: setelah satu lapis pengkhianatan diketahui, tambahkan lapis berikutnya (pengkhianatan finansial, pengkhianatan nama baik, pembalikan sikap, pemalsuan bukti).
      3. **Percepatan harga yang dibayar**: harga karena tidak bertindak terus meninggi (kehilangan peluang, dihina di depan umum, ikut menyeret orang lain).
      4. **Diam yang strategis**: tokoh utama belum melawan, diamnya sendiri terus menambah tekanan (disalahpahami orang lain, tokoh antagonis makin kurang ajar).

      ## Strategi Menurut Jalur Tema

      | Jalur | Titik kepuasan terbaik | Fokus bagian tengah | Preferensi penutup |
      |------|----------|----------|----------|
      | Pernikahan/mengejar kembali istri | Dihina di pembuka -> serangan balik terbuka -> lelaki bejat menyesal -> jati diri terbongkar | Kontras publik/privat, harga yang meningkat, minimal satu mini-payoff | Keunggulan yang senyap, status sosial berbalik |
      | Etika keluarga/kasih keluarga | Adegan realitas bertekanan tinggi, rasa retak akibat pengkhianatan keluarga | Tekanan berlapis, pemaksaan moral, satu penolakan sebagai penopang | Batas yang jelas, lepas dari struktur lama |
      | Serangan balik urban/dunia kerja | Diremehkan -> menunjukkan kemampuan -> jati diri terbongkar | Kemampuan diremehkan tapi terus ditunjukkan, penampilan tak terduga di momen kunci | Kebenaran jati diri terang, harga yang dibayar lawan terlihat |
      | Misteri dengan titik balik | Fakta yang menyimpang -> dikuliti lapis demi lapis -> menjungkirkan pemahaman | Setiap lapis yang terbuka memunculkan pertanyaan baru, minimal sekali "disangka sudah ketemu tapi ternyata bukan" | Kebenaran satu pukulan (kalimat terakhir menyusun ulang seluruh cerita) |

      ## Enam Kaidah Pengelolaan Rasa Ekspektasi

      1. **Hukum maksimalisasi ekspektasi**: momen sesaat sebelum titik kepuasan datang adalah posisi ketegangan tertinggi di seluruh cerita. Saat hampir terpenuhi namun belum terpenuhi, kebutuhan pembaca berada di puncaknya.
      2. **Manipulasi urutan informasi**: informasi yang ditanam lebih dulu menentukan arah dugaan pertama pembaca. Mengendalikan urutan informasi = mengendalikan ekspektasi pembaca.
      3. **Metode ekspektasi bertingkat**: terus tambahkan detail di atas ekspektasi dasar, suntikkan celah kebutuhan yang makin spesifik. Detail yang ditambahkan wajib konsisten dengan gagasan inti.
      4. **Larangan memutus ekspektasi**: sebelum ekspektasi berikutnya berdiri, jangan pernah mengakhiri ekspektasi yang sedang berjalan. Saat ekspektasi lama hampir terpenuhi, benih ekspektasi baru wajib sudah ditanam.
      5. **Prinsip keamanan pada alur menurun**: saat menulis emosi yang menurun, semua kesalahan milik orang lain, semua jasa milik tokoh utama. Di dalam penurunan wajib ada rasa aman bagi pembaca (kemungkinan jalan keluar/potensi keuntungan).
      6. **Kontras titik kepuasan bertingkat**: titik kepuasan yang berurutan harus meningkat bertahap. Dimensinya: cakupan dampak (pribadi -> kelompok -> masyarakat), kedalaman pengungkapan (permukaan -> hakikat -> penjungkiran), selisih status (orang biasa -> tokoh besar -> semua orang tercengang).

      ## Rumus Inti Emosi

      Saat menulis setiap adegan, pisahkan tiga lapis emosi: emosi tokoh itu sendiri (yang dirasakan tokoh), emosi yang disampaikan teks (yang ingin dirasakan pembaca lewat teks), dan emosi nyata yang dirasakan pembaca (pengalaman pembaca sebenarnya). Dalam satu adegan yang sama, tiga lapis ini bisa sepenuhnya berbeda: tokoh sedang menangis, teks sedang menggoda, pembaca sedang merasa puas.

      Contoh: tokoh perempuan utama dibatalkan pertunangannya di depan umum, menahan diri agar tidak menitikkan air mata. Tokoh: terhina; teks menulis sudut bibirnya masih menyisakan senyum (tokoh: bertahan); pembaca menahan sesak untuknya sambil menunggu tamparan balik nanti (pembaca: penghimpunan tenaga sebelum kepuasan).

      ## Struktur Emosi Prareaksi-Perwujudan-Pascareaksi

      Dipakai untuk adegan bertipe penderitaan/kepahlawanan tragis/penyesalan. Jalankan berurutan: prareaksi, biarkan pembaca tahu lebih dulu ada akibat buruk yang akan datang, lalu gambarkan hal-hal indah; perwujudan, biarkan akibat buruk itu benar-benar terjadi; pascareaksi, tokoh utama menumpahkan perasaan sejatinya dan melakukan perubahan (kemarahan/berjuang mati-matian/bangkit kembali). Contoh operasional: mengetahui seseorang akan mati dalam sehari -> biarkan dia mengalami hal-hal indah (jalan-jalan, menonton kembang api) -> dia benar-benar mati -> tokoh utama marah dan berjuang mati-matian.

      ## Struktur Emosi Kecil Melawan Besar

      Dipakai untuk adegan bertipe menggelora/serangan balik. Jalankan berurutan: prareaksi, bangun landasan tentang kepedihan pihak yang lemah, kontraskan kelemahan sekarang dengan kekuatan di masa lalu; perwujudan, pihak kuat datang, "aku tahu kalian menderita, aku datang"; pascareaksi, pihak lemah tertolong; semangat melesat, kesan keseluruhan berbalik.

      ## Lapisan Emosi dalam Konflik dan Taruhan Kematian

      | Jenis taruhan | Adegan yang cocok | Poin operasional |
      |----------|----------|----------|
      | Kematian fisik | Cerita horor dan aneh | Saat tokoh utama terlalu kuat, taruhan wajib beralih ke kematian karier, kalau tidak seluruh cerita runtuh |
      | Kematian karier | Persaingan kerja, perseteruan sekte kultivasi | Kegagalan = semuanya kembali nol |
      | Kematian psikologis | Perasaan yang runtuh, keyakinan yang hancur | Guncangan emosinya paling dalam, prioritaskan untuk garis perasaan |

      Pilih satu sebagai taruhan utama yang menembus seluruh cerita, sisanya berperan pendukung untuk mendorong alur cerita. Kedua pihak yang berseberangan wajib tidak bisa melepaskan diri dengan mudah; tersedia empat perekat: alasan saling membunuh (keunikan urutan yang pasti memicu konflik), tanggung jawab pekerjaan, tanggung jawab moral (kerabat dalam bahaya), dan tempat fisik (ruang tertutup dalam sebuah misi). Akhir volume pertama tidak boleh terlalu sempurna; sambil menyelesaikan satu masalah wajib menanam masalah berikutnya; semakin ke bagian akhir, ketegangan emosi wajib semakin besar.

      ## Dorongan Emosi Berbasis "Seharusnya Tidak Begini"

      "Seharusnya tidak begini" adalah daya dorong emosi yang paling mendasar: saat menulis tuduhan palsu, ketidakadilan, penindasan oleh yang kuat, pembaca secara alami melahirkan pikiran "seharusnya tidak begini". Logika emosi intinya: ingin rasa puas, harus ada rasa tidak puas lebih dulu; ingin keadilan, harus ada ketidakadilan lebih dulu; ingin kekuatan, harus ada ketidakberdayaan lebih dulu. "Tergantung tanpa penyelesaian" juga daya dorong yang kuat. Tema yang baik wajib punya sifat yang membangkitkan rasa sayang dan hasrat akan perubahan.

      ## Daya Ledak Perasaan dari Pertentangan Gagasan

      Pertarungan gagasan lebih mampu memicu resonansi mendalam pembaca daripada pertarungan kepentingan; cukup beberapa adegan kunci saja, tidak perlu banyak tinta. Konflik antara idealisme dan kenyataan adalah teknik untuk membentuk karakter tokoh pendukung setingkat legenda. Persetujuan terhadap gagasan = persetujuan terhadap karakter = keterlibatan perasaan pembaca. Selipkan tokoh bertipe gagasan di dalam alur utama, pakai perjuangan dan pengorbanan mereka untuk mengangkat batas atas emosi seluruh cerita.

      ## Tiga Lapis Metode Menggerakkan Emosi

      Tiga lapis: **investasi perasaan jangka panjang**, **konflik peristiwa jangka pendek**, dan **penggambaran adegan**. Ketiganya bisa ditumpuk, intinya ada di dua lapis pertama.

      ### Tiga Langkah Penuntun Jangka Panjang

      1. **Lemparkan bom resonansi**: temukan jangkar perasaan tokoh yang paling mudah memicu resonansi (mimpi, kebencian, ketakutan).
      2. **Ubah pembaca menjadi saksi**: tunjukkan pengorbanan dan pergulatan tokoh, setiap langkah dibarengi hasil yang diperoleh.
      3. **Ubah pembaca menjadi peserta**: melalui landasan dan detail yang memadai, tumbuhkan rasa senasib sepenanggungan.

      ### Penuntun Emosi Jangka Pendek

      Jangka pendek bergantung pada konflik peristiwa yang berdiri sendiri. **Konflik yang lugas lebih mudah memicu resonansi daripada alur cerita yang berbelit.** Peristiwa terbagi menjadi peristiwa yang mendorong perkembangan alur cerita (membuat pembaca menyetujui situasi tokoh) dan peristiwa yang membentuk watak tokoh (membuat pembaca menyetujui pikiran dan watak tokoh). Pembuka wajib memilih peristiwa yang membentuk watak tokoh: setujui dulu tokoh sebagai pribadi, baru pembaca peduli pada urusan tokoh.

      ### Jebakan Peleburan Emosi

      Sebelum pembaca melebur ke tokoh utama, posisi lemah tokoh utama bisa membangkitkan simpati, tetapi **posisi lemah musuh juga sama-sama membangkitkan simpati**. Saat pembaca belum membangun persetujuan, jangan menulis lawan sebagai pihak yang patut dikasihani.

      ### Teknik Gaya Tulis untuk Emosi

      Kalimat pendek = tegas dan menggelora; kata-kata emosi seperti "mendadak, sekonyong-konyong, menusuk mata" menciptakan rasa mendesak; kata kerja seperti "menyabet, menyayat, meninggalkan" memperkuat gambaran dan mengeksternalkan emosi; kata sifat dipakai presisi dan terkendali. Utamakan mengisyaratkan emosi lewat perilaku tokoh, bukan menggambarkannya secara langsung. **Menulis duka lewat keceriaan**: saat tokoh paling berduka justru tampil gembira, ketegangan emosinya lebih kuat; orang yang berangkat menuju kematian dengan gembira sering kali lebih menyayat daripada yang menangis.

      ## Perancangan Emosi Cerita Romansa untuk Pembaca Pria

      ### Dua Kebutuhan Inti

      - **Nilai emosional**: pembaca kekurangan kasih, di dalam novel ada gadis cantik dan unggul yang mengagumi dirinya, mengisi kekosongan perasaan.
      - **Nilai harga diri**: tampil bersama gadis terpopuler di kampus/direktris perempuan, orang-orang di sekitar iri, cemburu, dan benci.

      ### Menulis Romansa sebagai Cerita Peningkatan

      Tetapkan "bilah progres tingkat kesukaan" (orang asing -> orang baik -> teman -> menyukai tanpa sadar -> ...). Proses tarik-ulur yang penuh ambiguitas biasanya lebih menarik bagi pembaca daripada hasil akhir bersatu. Ciptakan hambatan internal dan eksternal yang menghalangi keduanya bersatu, lalu pertebal perasaan lewat proses mengatasi hambatan itu.

      ### Ketidaksetaraan dalam Peningkatan Perasaan

      Dua garis progres tidak boleh berjalan sejajar: perasaan lebih cepat daripada hubungan sosial (tingkat kesukaan kedua pihak sudah penuh sejak lama tapi keduanya keras kepala tak mau menyatakan), atau hubungan sosial lebih cepat daripada perasaan (berpindah dunia langsung membawa istri/tunangan, tingkat kesukaan nol dan harus dinaikkan bertahap).

      ### Larangan Kunci dan Kiat

      Tokoh utama pria jangan mengejar secara aktif, jangan jadi penjilat, gunakan kualitas dirinya yang unggul untuk menarik perhatian tokoh perempuan utama; garis karier tidak boleh absen, tokoh perempuan utama berperan positif bagi karier tokoh utama; tulislah kebaikan tokoh perempuan utama kepada tokoh utama, rancang cara berkorbannya sesuai karakternya (tipe rendah diri diam-diam menyelipkan pil obat, tipe tsundere keras kepala tapi membuatkan bekal, tipe blak-blakan terus terang memberi hadiah); pakai kontras garis waktu dan standar ganda (kepada orang lain vs kepada tokoh utama); pakai kesenjangan informasi seperti jati diri ganda untuk menarik ekspektasi.

      ## Sudut Pandang Terpadu Penggerakan Emosi

      Rumus pamungkas: **tenang -> penggerakan -> pelepasan -> puas**.

      | Teknik | Penggerakan | Pelepasan | Hasil |
      |------|------|------|------|
      | Pamer lalu ditampar | Tokoh antagonis jumawa | Tokoh utama menghancurkannya | Puas |
      | Menarik kebencian | Emosi negatif | Orang jahat dihukum | Puas |
      | Ditekan dulu lalu diangkat | Penindasan | Ledakan | Puas |
      | Rasa ekspektasi | Menciptakan jurang | Menutup jurang | Puas |

      Tandai pada setiap adegan: emosi pembaca sedang berada di tahap mana, dan langkah berikutnya penggerakan atau pelepasan. Hanya penggerakan tanpa pelepasan = pembaca sesak lalu meninggalkan cerita; hanya pelepasan tanpa penggerakan = rasa puas jadi datar dan tak bertenaga; besarnya penggerakan menentukan derajat kepuasan saat pelepasan.

      ## Mekanisme Dasar Menjaga Rasa Ekspektasi

      Tujuan adalah apa yang hendak dilakukan tokoh, sedangkan rasa ekspektasi adalah dugaan pembaca tentang apa yang akan terjadi setelah tujuan itu tercapai. Ada tujuan tanpa ekspektasi berarti pembaca tidak peduli pada hasilnya; tujuan wajib diubah menjadi ekspektasi.

      Ekspektasi bertipe pasti (cerita memuaskan): pembaca tahu tokoh utama akan menang, jadi yang ditulis adalah "bagaimana cara menang", kreativitas prosesnya lebih penting daripada misteri hasilnya. Ekspektasi bertipe tak pasti (misteri): pembaca tidak tahu hasilnya, misteri hasil lebih penting daripada pengalaman prosesnya. Cerita memuaskan tidak takut bocoran, karena ekspektasinya ada di proses, bukan di hasil.

      Membuka lingkar = menciptakan jurang (mengajukan pertanyaan/misteri); menutup lingkar = menutup jurang (menjawab pertanyaan/mengungkap); lingkar bersarang = menutup satu ekspektasi sambil membuka yang baru. Aturannya: saat menutup satu ekspektasi, wajib sudah ada lingkar berikutnya yang berjalan. Garis perasaan tanpa hambatan = tanpa ekspektasi = diberikan gratis = tanpa makna; sumber jurang mencakup selisih status, penolakan keluarga, kesalahpahaman, dan konflik misi.

      ## Daftar Periksa Kualitas

      ### Pemilihan Busur dan Tempo
      - [ ] Apakah jenis busur cocok dengan efek emosi yang ingin kamu tulis? (bandingkan dengan tabel rute keputusan)
      - [ ] Apakah titik balik kunci berada di posisi progres yang benar? (dasar jurang bentuk V 60-70%, titik tinggi V terbalik 40-50%, banting arah 70-80%)
      - [ ] Apakah alokasi jumlah kata sesuai dengan tuntutan proporsi busur yang dipilih?

      ### Penggerakan dan Pelepasan
      - [ ] Apakah setiap adegan jelas sedang berada di tahap "penggerakan" atau "pelepasan"?
      - [ ] Apakah ada bagian yang hanya penggerakan tanpa pelepasan? (akan membuat sesak dan cerita ditinggalkan)
      - [ ] Apakah ada bagian yang hanya pelepasan tanpa penggerakan? (rasa puasnya datar)
      - [ ] Apakah titik kepuasan yang berurutan meningkat bertahap? (cakupan dampak/kedalaman pengungkapan/selisih status)

      ### Rasa Ekspektasi
      - [ ] Apakah setiap tujuan sudah diubah menjadi ekspektasi pembaca?
      - [ ] Saat menutup satu ekspektasi, apakah lingkar berikutnya sudah berjalan? (larangan memutus ekspektasi)
      - [ ] Apakah garis perasaan sudah dipasangi hambatan? (tanpa hambatan = tanpa ekspektasi)

      ### Peleburan Emosi
      - [ ] Apakah pembuka memakai peristiwa yang membentuk watak tokoh? (setujui dulu pribadinya, baru peduli urusannya)
      - [ ] Sebelum pembaca melebur ke tokoh utama, apakah sudah dihindari menulis lawan sebagai pihak yang patut dikasihani?
      - [ ] Apakah di dalam alur yang menurun pembaca diberi rasa aman? (kesalahan milik orang lain, jasa milik tokoh utama)

      ### Pemeliharaan Jangka Panjang
      - [ ] Saat satu masalah diselesaikan, apakah masalah berikutnya sekaligus ditanam?
      - [ ] Apakah ketegangan emosi makin besar semakin ke bagian akhir?
      - [ ] Apakah taruhan kematian sudah dipilih satu untuk menembus seluruh cerita?
      - [ ] Apakah kedua pihak yang berseberangan punya perekat sehingga tidak bisa melepaskan diri dengan mudah?
