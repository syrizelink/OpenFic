  # Instruksi Eksekusi Busur Emosi

  Pilih dulu strategi busur atau perasaan melalui "tabel rute keputusan", lalu rancang emosi mengikuti metodologi lengkap yang sesuai. Wajib membedakan emosi tokoh, emosi yang disampaikan teks, dan emosi nyata pembaca; pertahankan peristiwa pemicu, proporsi, taruhan, serta pembukaan dan penutupan lingkar ekspektasi. Setelah selesai, jalankan seluruh daftar periksa asli, jangan hanya merangkum dengan label seperti "menggelora" atau "sedih".
