content: |
  # Buku Panduan Hubungan Tokoh dan Alur Perasaan

  ## Perutean Keputusan

  | Apa yang sedang kamu rancang | Gunakan metode di bagian ini |
  |-------------|-------------|
  | Jenis hubungan antartokoh | Tabel jenis hubungan tokoh |
  | Inti karakterisasi pada alur perasaan | Metode inti karakterisasi aliran perasaan |
  | Logika dasar alur cinta | Perbedaan alur cinta segmen pembaca pria/wanita |
  | Pemilihan tokoh pada cerita masuk ke dalam buku/gim | Kaidah pemilihan tokoh masuk ke dalam buku |
  | Hubungan banyak pihak/medan cemburu | Strategi menutup medan cemburu |
  | Ritme pengembangan tingkat kesukaan | Sistem tingkat kesukaan + panduan cerita cinta segmen pembaca pria |
  | Perubahan sikap tokoh pendukung | Zona penyangga penaklukan tokoh pendukung |
  | Penulisan empati terhadap tokoh | Pemeriksaan konsistensi perilaku tokoh |
  | Tujuan tokoh dan alur hubungan | Kemandirian tujuan tokoh + desain alur hubungan |

  ## Jenis Hubungan Tokoh

  Periksa tabel untuk menetapkan jenis hubungan antartokoh, lalu jalankan sesuai prinsipnya.

  | Jenis hubungan | Definisi | Fungsi | Contoh |
  |---------|------|------|------|
  | Jenis konflik | Kepentingan/pandangan kedua pihak berseberangan | Menciptakan ketegangan, mendorong alur cerita | Musuh bebuyutan, pesaing |
  | Jenis persekutuan | Kedua pihak memiliki tujuan bersama | Memberi dukungan, membentuk ikatan | Rekan seperjuangan, guru dan murid |
  | Jenis keintiman | Terhubung oleh ikatan emosi | Menciptakan titik lemah, memberi tumpuan emosi | Kekasih, keluarga, saudara |
  | Jenis otoritas | Hubungan atasan-bawahan/penguasaan | Menciptakan tekanan, membatasi gerak tokoh utama | Guru, atasan, pengawas |

  **Aturan pelaksanaan**:
  - Setiap hubungan penting sedikitnya melewati satu ujian (pengkhianatan/pengorbanan/kesalahpahaman)
  - Hubungan wajib memiliki busur perubahan (musuh menjadi sekutu, sekutu menjadi lawan)
  - Dilarang membuat semua hubungan menjadi satu bongkah "semua serba baik"
  - Fungsi hubungan wajib melayani alur cerita, tidak boleh ada semata demi kemanisan/penyiksaan

  ## Metode Inti Karakterisasi Aliran Perasaan

  Dalam aliran perasaan, alur cerita melayani karakterisasi - setiap alur cerita harus memperkaya tokoh atau mendorong perkembangan perasaan, jika tidak maka itu alur cerita yang tidak berguna.

  ### Langkah pembangunan

  1. **Tetapkan inti karakterisasi**: tuliskan ciri tokoh yang paling awal muncul di kepalamu (misalnya "putra raja yang ingin naik ke takhta", "putra raja yang lemah dan sakit-sakitan")
  2. **Kembangkan di sekeliling inti**: jawab - mengapa inti ini ada? Pengalaman masa lalunya? Pengaruh lingkungannya? Sebab terbentuknya wataknya?
  3. **Perpanjang menjadi alur cerita**: alur cerita yang sudah melekat pada inti wajib ditulis (ada tujuan -> alur tujuan; ada luka -> alur pemulihan)

  ### Aturan pelaksanaan

  - Alur cerita yang klise pun bisa lepas dari kesan formula bila dipasangkan dengan karakterisasi yang kaya
  - Kedua tokoh utama wajib memiliki titik cemerlang dan jalur perubahan yang mandiri, tidak boleh satu orang bersinar sementara yang lain redup
  - Momen sorotan bukan berarti pamer - semua momen yang membuat pembaca berkesan pada tokoh adalah sorotan, termasuk momen yang menyayat hati
  - Hidup bukan hanya bercinta - dalam hatinya tokoh boleh mengharapkan cinta, tetapi hidupnya tidak boleh hanya berisi cinta, karena tokoh yang hanya punya cinta tidak akan berdiri kokoh dan terasa dangkal

  ## Perbedaan Logika Dasar Alur Cinta pada Segmen Pembaca Pria dan Wanita

  **Tetapkan lebih dahulu kelompok pembaca sasaran, lalu pilih logika yang sesuai. Keduanya tidak boleh dicampuradukkan, jika tidak pembaca akan merasa "rasanya tidak pas".**

  ### Logika alur cinta segmen pembaca pria

  | Dimensi | Keterangan |
  |------|------|
  | Inti | "Pameran faktor luar" - kebersamaan tokoh utama dan pasangannya menunjukkan betapa unggulnya faktor luar keduanya |
  | Tiga logika inti | "Alangkah baiknya jika dia milikku" -> "Orang seunggul ini sudah menjadi milikku" -> "Orang seunggul ini pun menyukaiku, berarti aku lebih unggul" |
  | Pikiran para penonton | "Bisa mendapatkan perempuan seunggul itu, aku sangat iri" (bukan "hubungan mereka manis sekali") |
  | Tokoh utama perempuan | Sebaiknya ada beberapa tokoh perempuan yang menyukai tokoh utama, makin banyak makin menunjukkan keunggulannya |
  | Hakikat pasangan | "Piala" - tujuan mendasar dari semua motifnya adalah kemenangan |

  Saat menulis alur perasaan untuk segmen pembaca pria, rancang peristiwa di sekeliling "memamerkan keunggulan".

  ### Logika alur cinta segmen pembaca wanita

  | Dimensi | Keterangan |
  |------|------|
  | Inti | "Keterhubungan" - keterhubungan emosi antara keduanya yang tunggal, tak tergoyahkan, dan paling diutamakan |
  | Tuntutan keterhubungan | "Yang kucintai adalah dirimu sebagai pribadi, penampilan, kekayaan, dan bakat tidak dapat menggantikan keterhubungan ini" |
  | Kemurnian | Setelah keterhubungan terbentuk, pengaruh faktor luar sebaiknya berangsur ditinggalkan |
  | Kedua pihak | Sebaiknya cinta pertama + keduanya belum pernah bersama siapa pun, untuk menjamin kemurnian dan ketunggalan keterhubungan itu |
  | Pikiran para penonton | "Hubungan mereka manis sekali, aku sangat iri" |

  Saat menulis alur perasaan untuk segmen pembaca wanita, rancang peristiwa di sekeliling "memperdalam keterhubungan".

  ## Kaidah Pemilihan Tokoh untuk Cerita Masuk ke Dalam Buku/Gim

  ### Syarat yang wajib dipenuhi

  - Tokoh utama penutur wajib cukup akrab dengan dunia asli (sumber harapan yang paling inti)
  - Pastikan ia berpindah masuk ke dunia yang dikenalnya, jelaskan dengan satu dua kalimat, jangan sampai lewat satu bab pun masih tidak jelas ia berada di mana
  - Wajib memilih tokoh yang setelah perpindahan memiliki daya dramatik kuat atau pertentangan kuat (misalnya berpindah menjadi tokoh pendukung perempuan yang bengis)

  ### Desain kesenjangan informasi

  - Rancang kesenjangan informasi secukupnya di atas landasan dunia asli, agar tokoh utama penutur punya ruang penjelajahan
  - Pengetahuan tentang dunia asli boleh dipakai untuk memanfaatkan celah demi perolehan berlebih

  ## Strategi Menutup Medan Cemburu

  Medan cemburu pada hakikatnya adalah salah satu bentuk pertentangan; kendalikan intensitas perlawanannya, jangan sampai muncul pertentangan yang tak terdamaikan antara para pasangan di alur cinta.

  | Cara menutup | Pelaksanaan |
  |---------|------|
  | Kaitkan kembali ke alur karier | Biarkan para pasangan di alur cinta mengalihkan perebutan perhatian menjadi "siapa yang berkontribusi lebih besar bagi alur karier tokoh utama" |
  | Sisipkan peristiwa mendadak pada alur karier | Ketika perlawanan memuncak, gunakan peristiwa mendadak agar semua orang beralih dari pertikaian internal menjadi bersatu menghadapi pihak luar |
  | Lewati dengan sekali sapuan | Paling banyak dua orang saling tidak suka dan melontarkan dua kalimat sindiran, lalu selesai, sangat ditahan |

  ## Menghindari Jebakan dalam Membentuk Tokoh Naif Manis

  ### Enam jebakan yang wajib dihindari

  1. Kesalahan tokoh utama perempuan tidak boleh disengaja, ia tidak boleh tahu sesuatu tak boleh dilakukan tetapi tetap melakukannya
  2. Kesalahan tokoh utama perempuan tidak boleh melanggar moral - hal terpenting bagi tokoh naif manis adalah kepekaan moral tinggi seperti anak kecil yang lugu
  3. Tidak boleh berdiri di menara moral untuk menuduh orang lain (perilaku sok bermoral) sementara dirinya sendiri tidak melakukannya dengan baik
  4. Tidak boleh setelah berselisih dengan rekan satu tim akibat perilaku sok bermoral itu, rekan timnya justru dibuat mengakui salah dan memujinya
  5. Cara yang benar: memiliki standar moral yang lebih tinggi -> segala perbuatannya sesuai dengan itu -> karena itu ia tampak berbeda dari yang lain dan sedikit naif
  6. Boleh menulis alur pertumbuhan: setelah menempati posisi orang yang pernah ia tuduh, ia menyadari bahwa cara itulah pilihan terbaik yang tersedia

  ### Penggunaan terbalik

  Saat membentuk tokoh antagonis yang naif manis, timpakan keenam butir di atas kepadanya, agar pembaca langsung membencinya sejak pandangan pertama.

  ## Metode Pembalikan Dua Arah untuk Perubahan Karakterisasi

  Cara menyesuaikan karakterisasi ketika hubungan pada alur cinta mengalami perubahan.

  ### Gagasan inti

  - Perubahan terbaik adalah kedua orang berubah, dan setelah berubah keadaannya justru berlawanan dengan hubungan berpadanan mereka sebelumnya
  - Perubahan harus berupa penyesuaian setempat di atas karakterisasi asal, tetap terhubung erat dengan karakterisasi asal, hindari perombakan sembarangan

  ### Aturan pelaksanaan

  - Perubahan karakterisasi terjadi setelah tahap cinta terpisah gunung dan laut (terutama setelah menghadapi penghalang terbesar), jangan lagi merancang pertentangan baru, cukup taburkan kemanisan
  - Penghalang yang sesungguhnya telah diselesaikan di bagian sebelumnya, dan pada titik ini keinginan pembaca yang paling mendesak adalah menyantap lebih banyak kemanisan
  - Kemanisan ditaburkan melalui perilaku pasangan yang nyata dan perawatan yang penuh perhatian untuk menyatakan cinta, bukan pemanis industri bergaya "aku mencintaimu"

  ## Pemeriksaan Konsistensi Perilaku Tokoh

  ### Langkah pertama: singkirkan dorongan dari luar

  Periksa apakah perilaku tokoh semata-mata demi mengarahkan alur cerita ke suatu arah. Jika tokoh "kebetulan" melakukan hal yang mendorong alur cerita tanpa motif dari dirinya sendiri, tandai sebagai "pergeseran karakterisasi", dan alasan yang wajar pada tataran tokoh wajib ditambahkan untuk perilaku itu.

  ### Langkah kedua: pemastian sasaran emosi

  Sebelum menulis setiap bagian, perjelas tiga unsur:
  1. Emosi sasaran bagian ini: emosi apa yang hendak ditimbulkan alur cerita ini pada pembaca?
  2. Apakah ciri watak tokoh mendukung emosi itu: apakah atribut latar tokoh secara wajar mengarah ke arah emosi tersebut?
  3. Apakah perilaku tokoh sesuai dengan penempatan misinya: apakah perilaku tokoh pada bagian ini selaras dengan penempatan fungsinya di dalam cerita?

  ### Langkah ketiga: penurunan perilaku dari karakterisasi

  Turunkan perilaku tokoh dalam adegan dari atribut yang telah ditetapkan (pengalaman/watak/tujuan/kondisi saat ini):
  - Daftarkan 2-3 kemungkinan reaksi tokoh itu dalam adegan tersebut
  - Nilai keselarasan setiap reaksi dengan pola perilaku tokoh yang sudah ada
  - Pilih reaksi yang paling sesuai dengan karakterisasinya dan paling bermuatan ketegangan dramatik

  ### Langkah keempat: pemeriksaan keselarasan emosi

  Periksa apakah inti emosi yang diungkapkan tokoh selaras dengan emosi sasaran adegan. Jika tidak selaras, sesuaikan perilaku tokoh atau emosi sasaran adegan, untuk memastikan keluaran tetap konsisten pada dimensi emosi.

  **Dua jalur pelaksanaan**:
  - Jalur A: tetapkan emosi sasaran lebih dahulu -> turunkan perilaku tokoh dari karakterisasinya -> periksa keselarasan
  - Jalur B: turunkan perilaku tokoh dari karakterisasinya lebih dahulu -> tarik balik emosi sasaran adegan -> periksa keselarasan

  ## Zona Penyangga Penaklukan Tokoh Pendukung

  Proses perubahan sikap tokoh pendukung terhadap tokoh utama = proses tokoh utama menaklukkan tokoh pendukung, yang disertai harapan besar dan titik kepuasan.

  ### Jenis zona penyangga

  Daring dan luring, pembicaraan di belakang, kebersamaan berjarak, jurang kedudukan, jurang keintiman, tingkat kepercayaan, kesenjangan informasi, dan lain-lain.

  ### Langkah pelaksanaan

  1. Jaga agar zona penyangga selalu ada
  2. Pilih titik balik peristiwa dari kerangka volume (5~7 buah)
  3. Pada setiap titik balik, tandai kondisi tokoh pendukung dan perubahan sikapnya terhadap tokoh utama
  4. Setiap kali penaklukan mencapai titik kunci, perubahan sikap tokoh pendukung wajib dituliskan dengan jelas
  5. Perubahan sikap itu sendiri sudah menghasilkan gelombang emosi dan harapan

  ### Aturan pelaksanaan

  - Tokoh pendukung tidak boleh berdiri diam seperti NPC menunggu dipicu oleh tokoh utama
  - Tokoh pendukung harus memiliki tindakannya sendiri, dan peristiwa dapat dimunculkan dari pandangan tokoh pendukung
  - Tokoh yang berpihak baik pun sama: orang yang sikapnya sejalan dengan tokoh utama juga harus punya tindakan dan motifnya sendiri

  ## Memanfaatkan Kesenjangan Persepsi Identitas Tokoh untuk Menciptakan Konflik

  "Reputasi" satu tokoh yang sama di mata orang berbeda bersifat dinamis, bukan nilai yang tetap.

  | Sudut pandang | Yang dianggap penting | Penilaian atas tokoh utama pria |
  |------|----------|-------------|
  | Sudut pandang awam | Latar keluarga sebanding, daya tahan terhadap risiko | Tingkat kecocokan syarat secara keseluruhan |
  | Tokoh utama pria sendiri | Mencari uang menghidupi keluarga + perasaan | Relatif setara dan sepadan |
  | Sudut pandang tokoh utama perempuan | Perasaan + kesetiaan + cinta | Selama ia peduli, itu sudah setara dan sepadan |
  | Anak orang kaya | Tingkat kecocokan penampilan dan latar keluarga | Akulah yang lebih setara dan sepadan |
  | Orang lewat | Perbandingan syarat secara keseluruhan | Tokoh utama perempuan semestinya menikahi anak orang kaya |

  **Pokok pelaksanaan**:
  - Perbedaan penilaian orang yang berbeda atas satu tokoh yang sama = sumber alami pertentangan dan konflik
  - Salah satu titik kepuasan inti cerita cinta: perbedaan penilaian dari dimensi yang berbeda

  ## Hubungan Sekaligus Musuh Sekaligus Kawan

  Jenis hubungan tokoh yang paling berdaya pikat.

  ### Aturan pelaksanaan

  - Prasyarat: kedua tokoh itu sendiri harus berdaya pikat, jika tidak hasilnya hanya tempelan yang dipaksa seimbang lima banding lima
  - Inti: pengakuan yang tinggi + konflik yang mutlak -> saling menghargai -> jika salah satunya hilang, daya pikatnya lenyap seluruhnya
  - Musuh bebuyutan yang sejati = kedua pihak saling mengakui, pengesahan dari orang luar tidak berlaku

  ## Penempatan Pesaing dan Penggunaan Alur Kekeluargaan

  ### Pesaing (efek ikan lele)

  - Penempatan: menambah ketegangan dan tekanan bagi tokoh utama pria/perempuan -> mendorong laju penaklukan
  - Titik berat penempatan alur ceritanya ada "sebelum simpul puncak" -> termasuk tahap pelandasan
  - Tidak banyak berguna untuk menulis alur cerita lanjutan setelah puncak -> bukan cara untuk memperpanjang usia cerita

  ### Empat arah alur kekeluargaan

  | Arah | Kegunaan | Waktu penggunaan |
  |------|------|---------|
  | Dukungan dari pihak pria | Menyediakan uang, kedudukan, dan kekuasaan | Berperan sebelum puncak |
  | Hambatan dari pihak pria | Memasang penghalang agar tokoh utama memperoleh pengakuan | Bisa dipakai sebelum maupun sesudah simpul |
  | Dukungan dari pihak perempuan | Pos pengisian perasaan yang lembut dan menenangkan | Berperan sebelum puncak |
  | Hambatan dari pihak perempuan | Orang tua tidak menyetujui -> berupaya demi memperoleh pengakuan | Bisa dipakai sebelum maupun sesudah simpul |

  Dukungan terutama berperan sebelum puncak, hambatan bisa dipakai sebelum maupun sesudah simpul, dan hambatan lebih leluasa diperankan.

  ## Panduan Penulisan Cerita Cinta Segmen Pembaca Pria

  ### Mengapa pembaca membaca cerita cinta

  | Nilai | Sumber |
  |------|------|
  | Nilai emosi | Mengisi kekosongan perasaan "dibutuhkan dan dipedulikan" |
  | Nilai harga diri | Syarat tokoh utama perempuan baik -> membawanya keluar terasa membanggakan -> tokoh pendukung iri dan cemburu |
  | Alasan tokoh utama perempuan berkedudukan tinggi | Alat pamer dan tamparan balik yang lebih kuat + kepuasan harga diri yang lebih besar |

  ### Teknik inti: tulis cerita cinta seperti cerita naik level

  - Proses tarik-ulur ambigu itulah yang paling berdaya tarik
  - Bilah kemajuan tingkat kesukaan: setiap langkah maju = satu "tingkat" dalam cerita naik level
  - Setiap peristiwa adalah satu kali "naik level" -> lewat konflik, peredaan, pemahaman, dan kesepahaman, tingkat kesukaan mendaki

  ### Jalur naik level tingkat kesukaan

  Orang lewat -> orang baik (membantu nenek menyeberang jalan) -> orang baik yang lurus dan berani (maju melindungi) -> kawan yang cukup baik (memahami kesulitan keluarga asalnya) -> menyukai tetapi belum sadar (lewat kesempatan khusus melihat sisi masing-masing yang tidak diketahui orang)

  ### Prinsip kunci: tokoh utama tidak mengejar secara aktif

  - Pembaca segmen pria saat ini pada umumnya tidak menyukai karakterisasi "penjilat cinta"
  - Tingkat kesukaan didorong oleh daya tarik dari kualitas unggul tokoh utama pria sendiri, bukan oleh pengejaran aktif
  - Tokoh utama pria membantu tokoh utama perempuan sebagai hal yang mudah dilakukan dan tanpa disengaja -> karena itu tokoh utama perempuan mengingatnya

  ### Ketaksetangkupan naik level perasaan

  - Dua bilah kemajuan: hubungan sosial di permukaan (orang lewat -> kawan -> kekasih) + tingkat kesukaan emosional yang sebenarnya
  - Kedua bilah itu sebaiknya tidak melaju berdampingan -> satu cepat satu lambat -> menghadirkan pertentangan dan konflik yang kaya
  - Alur emosi lebih cepat daripada alur sosial -> pola nona besar Kaguya (tingkat kesukaan keduanya sudah penuh tetapi mulutnya keras dan tak mau menyatakan)
  - Alur sosial lebih cepat daripada alur emosi -> pola menantu tinggal di rumah mertua/Memilih Langit (di permukaan suami istri, tetapi tingkat kesukaan sebenarnya nol)

  ### Menulis tokoh utama perempuan berbuat baik kepada tokoh utama

  | Jenis tokoh utama perempuan | Cara memberi |
  |---------|---------|
  | Rendah diri dan cemas bergaul | Diam-diam membantu dan menyelipkan sesuatu tetapi takut ditemukan |
  | Jenis jual mahal manis | Membuatkan bekal dengan sungguh-sungguh tetapi mulutnya keras: "kebetulan buatannya berlebih, sekalian kubawa" |
  | Terus terang dan berani | Memberi hadiah dengan lugas atau menyatakan perasaan secara langsung |

  ### Manfaatkan perbandingan dengan baik

  | Jenis perbandingan | Pelaksanaan |
  |------|------|
  | Perbandingan garis waktu | Sikap tokoh utama perempuan saat baru mengenal tokoh utama vs setelah akrab |
  | Standar ganda | Tidak mengizinkan orang lain mengusap kepalanya tetapi tokoh utama boleh -> menonjolkan kedudukan istimewa |
  | Kesenjangan informasi | Identitas ganda tokoh utama pria dan perempuan (daring vs nyata) -> menanti reaksi saat terbongkar |

  ## Sistem Tingkat Kesukaan (Kerangka Umum)

  ### Empat tahap

  Perjumpaan tak terduga -> komedi cinta -> cinta terpisah gunung dan laut -> penutup besar

  ### Tabel padanan tingkat kesukaan x tahap hubungan

  Tingkat kesukaan (negatif/nol/separuh/penuh) x tahap hubungan (akrab/menjajaki/ambigu/pemastian)

  Prinsip pemadanan tahap: **hitung berdasarkan sisi yang lebih rendah**. Tingkat kesukaan sudah sampai tetapi tahap hubungan belum sampai = perilaku terasa mendadak.

  ### Tiga jenis ambang perilaku pasangan

  | Jenis perilaku | Ambang | Keterangan |
  |---------|------|------|
  | Perilaku yang perlu ditoleransi | Kesukaan separuh+ | Keintiman aktif, mengalah, wajib diberi imbalan jika tidak akan berubah menjadi penjilat cinta |
  | Perilaku perlakuan istimewa | Kesukaan separuh+ | Hak kepemilikan, kepercayaan, pengorbanan, perlakuan khusus, penenangan |
  | Perilaku keterkaitan | Kesukaan separuh+ pada kedua pihak | Kesepahaman tanpa kata, berbagi, menemani |

  Menulis perilaku yang perlu ditoleransi saat tingkat kesukaan belum memadai = terasa menjijikkan/seperti pelecehan.

  ### 5 templat struktur alur perasaan

  | Templat | Inti |
  |------|------|
  | Perubahan tingkat kesukaan | Mungkin naik/turun/sudah turun -> jalur penanganan masing-masing -> gema sisa |
  | Menerima manfaat | Menikmati keuntungan yang dibawa pasangan = inti pamer pada alur cinta |
  | Perebutan perhatian | Beberapa tokoh berebut perhatian tokoh utama, bukan tokoh utama yang cemburu pada orang lain |
  | Perkembangan terhambat | Penghalang -> mencoba menyelesaikan -> selesai -> gema sisa |
  | Suapan kemanisan | Interaksi sehari-hari pasangan |

  ## Kemandirian Tujuan Tokoh dan Desain Alur Hubungan

  ### Prinsip kemandirian tujuan tokoh utama

  - Tujuan tokoh utama wajib menjadi miliknya sendiri -> tidak boleh berupa "membantu orang lain mewujudkan tujuannya" -> jika tidak, tokoh utama berubah menjadi tokoh pendukung/tokoh alat
  - Cara yang benar: ubah tujuan orang lain menjadi tujuan tokoh utama sendiri (memadamkan pemberontakan = melindungi kepentingannya sendiri/memperoleh pengakuan/memperoleh sumber daya)
  - Cara pemeriksaan diri: buka satu bab secara acak -> apa yang sedang dikejar tokoh utama secara aktif -> jika tidak ada -> tokoh utama merosot menjadi bidak orang lain

  ### Desain berlapis alur perasaan

  - Perkembangan perasaan bukan linear, seharusnya ada simpul naik level, dan setiap simpul berpadanan dengan satu puncak alur cerita
  - Ketidaksejajaran antara alur hubungan sosial dan alur perasaan yang sesungguhnya menciptakan ketegangan
  - Ritme terbaik: perasaan lambat lebih dahulu lalu cepat -> tahap awal melandasi dan menumpuk tingkat kesukaan -> tahap akhir meledak terpusat -> dipadankan dengan upacara yang megah

  ### Penempatan fungsional tokoh pendukung

  | Jenis | Fungsi | Waktu penggunaan |
  |------|------|---------|
  | Pesaing (jenis ikan lele) | Menciptakan tekanan untuk mendorong tindakan tokoh utama | Sebelum simpul puncak |
  | Kerabat dan kawan jenis pendukung | Menyediakan sumber daya/dukungan emosi | Berperan sebelum puncak |
  | Kerabat dan kawan jenis penghambat | Tidak mengakui -> memasang syarat -> tokoh utama mengatasinya -> memperoleh pengakuan | Bisa dipakai sebelum maupun sesudah simpul |

  ## Tokoh Manipulatif Bermuka Dua/Tokoh Negatif

  - Bisa mendorong alur cerita tetapi harus dipakai dengan hati-hati
  - Pastikan tokoh itu memang tak tergantikan
  - Ketika tokoh utama berada di posisi kuat, tokoh apa pun bisa berubah menjadi umpan balik positif
  - Ketika tokoh utama berada di posisi lemah, tokoh negatif akan dibenci pembaca

references:
  - name: Daftar Pemeriksaan Lengkap Alur Hubungan
    content: |
      Setiap kali selesai merancang hubungan tokoh/alur perasaan, periksa butir demi butir:

      - [ ] **Jenis hubungan jelas**: setiap hubungan penting sudah digolongkan ke salah satu dari konflik/persekutuan/keintiman/otoritas
      - [ ] **Hubungan memiliki busur**: setiap hubungan penting sedikitnya mengalami satu ujian atau perubahan
      - [ ] **Karakterisasi punya inti**: karakterisasi tokoh utama memiliki ciri inti yang jelas beserta dasar pengembangannya
      - [ ] **Kemandirian tujuan**: tujuan tokoh utama adalah miliknya sendiri, bukan membantu orang lain mewujudkan tujuannya
      - [ ] **Tingkat kesukaan berpadanan**: perilaku pasangan sesuai dengan tahap tingkat kesukaan saat ini (dihitung berdasarkan sisi yang lebih rendah)
      - [ ] **Terasa pas bagi kelompok pembaca**: segmen pembaca pria merancang peristiwa di sekeliling "memamerkan keunggulan", segmen pembaca wanita di sekeliling "memperdalam keterhubungan"
      - [ ] **Tokoh pendukung punya tindakan**: tokoh pendukung bukan patok diam bergaya NPC yang menunggu dipicu, ia punya tindakan dan motifnya sendiri
      - [ ] **Zona penyangga ada**: zona penyangga tetap dijaga selama proses penaklukan tokoh pendukung, dan perubahan sikap ditandai pada setiap titik balik
      - [ ] **Medan cemburu terkendali**: dalam hubungan banyak pihak tidak ada pertentangan yang tak terdamaikan di antara para pasangan
      - [ ] **Waktu menabur kemanisan tepat**: setelah cinta terpisah gunung dan laut, tidak lagi dirancang pertentangan baru, hanya perilaku pasangan yang nyata dan manis
      - [ ] **Tokoh tidak hanya bercinta**: dalam hidup tokoh ada isi selain cinta, ia bukan tokoh alat perasaan yang dangkal
  - name: Tahap Perasaan dan Strategi Penutup
    content: |
      - Perjumpaan tak terduga: pertahankan jarak dan kesenjangan informasi.
      - Komedi cinta: naikkan tingkat kesukaan secara bertahap lewat konflik, peredaan, pemahaman, dan kesepahaman.
      - Cinta terpisah gunung dan laut: hadapi penghalang terbesar, selesaikan pertentangan yang sesungguhnya, jangan menciptakan pertentangan baru lagi.
      - Penutup besar: tuntaskan dengan tindakan jangka panjang, perawatan, dan perilaku pasangan yang konkret.
      - Medan cemburu dapat dikaitkan ke alur karier, disatukan menghadapi pihak luar lewat peristiwa mendadak, atau dilewati setelah paling banyak dua kalimat sindiran yang ditahan.
