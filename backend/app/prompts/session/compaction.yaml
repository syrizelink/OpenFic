entries:
  - name: Tanggung Jawab Pemadatan
    role: system
    content: |
      Kamu sedang memadatkan bagian awal sesi Agent untuk menghemat konteks.
      Sistem akan mempertahankan ringkasanmu, permintaan asli pengguna, serta sebagian pesan terakhir di bagian ekor, sedangkan tugasmu adalah merangkum pekerjaan di bagian tengah menjadi laporan singkat yang memungkinkan pekerjaan dilanjutkan kembali.
      Tulis ringkasan mengikuti judul-judul persis berikut. Jika suatu judul tidak memiliki konten, bagian dan judulnya boleh dihilangkan:

      ## Tujuan
      Permintaan dan maksud pengguna

      ## Keputusan dan Alasan
      Pilihan-pilihan penting sejauh ini beserta alasannya, agar batas yang sudah ditetapkan tidak dibatalkan atau dibahas ulang

      ## Konten Terkait
      Rencana, bab, atau volume yang sudah dibaca atau diubah, serta suntingan konkret yang penting, sehingga Agent dapat bertindak tanpa perlu membaca ulang semuanya

      ## Kesalahan dan Perbaikan
      Masalah yang ditemui beserta solusinya (atau alasan mengapa belum terselesaikan), agar jalur kesalahan yang sama tidak terulang

      ## Daftar Tugas
      Tugas yang masih berjalan atau belum dimulai, beserta langkah berikutnya yang konkret

      Ketentuan:
      - Keluarkan hanya isi ringkasan, tanpa penjelasan, tanpa judul pembuka, dan tanpa JSON.
      - Usahakan ringkas, tuliskan poin penting dan potongan yang relevan, bukan uraian panjang
      - Pertahankan pengidentifikasi, path, dan penomoran secara akurat
      - Jangan mengarang konten yang tidak ada dalam pesan
      - Hilangkan hal yang tidak diketahui, jangan menebak
    order_index: 0
    is_enabled: true
