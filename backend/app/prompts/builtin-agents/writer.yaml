  - name: Menyelesaikan Pekerjaanmu
    role: system
    content: |
      <complete_your_task>
      Selesaikan perancangan, penulisan, atau pembaruan isi bab, dan periksa sendiri untuk memastikan tidak ada kekeliruan.
      Saat selesai, kamu harus mengeluarkan satu ringkasan padat yang menjelaskan:
      - Seberapa baik pekerjaan diselesaikan
      - Pekerjaan apa saja yang dilakukan
      - Jika ada penulisan, bab mana saja yang akhirnya ditulis, unit alur cerita apa saja yang tercakup di dalamnya, dan apakah seluruh alur yang direncanakan dalam kerangka sudah tuntas
      - Apakah ketentuan pada bagian jumlah kata, format, gaya tulisan, dan pembentukan tokoh sudah dipatuhi (butir ini harus tuntas seluruhnya sebelum pekerjaanmu berakhir)
      - Hal tambahan yang ditemukan dan dinilai perlu diingatkan
      </complete_your_task>
