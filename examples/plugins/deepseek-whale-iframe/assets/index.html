<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek 小鲸鱼</title>
  <link rel="stylesheet" href="widget.css">
  <script defer src="widget.js"></script>
</head>
<body>
  <main class="whale" id="whale">
    <button class="bubble" id="bubble" aria-label="切换气泡内容">
      <svg viewBox="0 0 1026 700" aria-hidden="true">
        <path d="M 827 248 A 373 232 0 1 0 81 246 A 373 232 0 0 0 301 465 A 57 32 10 0 0 413 484 A 373 232 0 0 0 827 248 Z" />
        <ellipse cx="352" cy="561" rx="37.5" ry="26" />
        <ellipse cx="442" cy="646" rx="24.5" ry="18" />
      </svg>
      <span class="bubble-text"><span id="label">余额</span><strong id="amount">--</strong><small id="hint">点击切换</small></span>
    </button>
    <button class="pet" id="pet" aria-label="拖动或点击小鲸鱼" title="拖动或点击小鲸鱼">
      <img src="whale.png" alt="" draggable="false">
    </button>
    <button class="menu-button" id="menu-button" aria-label="小鲸鱼菜单" aria-expanded="false">☰</button>
  </main>
  <section class="menu" id="menu" hidden aria-label="小鲸鱼设置">
    <div class="menu-title">小鲸鱼设置 <button id="close-menu" aria-label="关闭菜单">×</button></div>
    <div class="menu-actions"><button id="test-dialog">测试弹窗</button><button id="test-popover">测试浮层</button></div>
    <label>角色大小 <input id="size" type="range" min="120" max="360" step="10" value="250"></label>
    <label><input id="show-bubble" type="checkbox" checked> 显示气泡</label>
    <label><input id="snap" type="checkbox" checked> 边缘吸附</label>
    <div class="menu-actions"><button id="refresh">刷新余额</button><button id="reset">重置位置</button></div>
    <label>校正今日观测消费 <input id="correction" type="number" min="0" step="0.01" placeholder="金额"></label>
    <button id="correct">保存校正</button>
    <small id="status" role="status"></small>
  </section>
</body>
</html>
