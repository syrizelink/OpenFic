name: Package Build

on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      version:
        value: ${{ jobs.context.outputs.version }}
      release_tag:
        value: ${{ jobs.context.outputs.release_tag }}
      image:
        value: ${{ jobs.context.outputs.image }}
      major_minor:
        value: ${{ jobs.context.outputs.major_minor }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.18.0"
  PNPM_VERSION: "11.8.0"
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  # ---------------------------------------------------------------- context
  context:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      image: ${{ steps.meta.outputs.image }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo '::error::Signed package previews must run on the default branch'
            exit 1
          fi
          VERSION=$(jq -r '.version' mobile/package.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Package version must be major.minor.patch'
            exit 1
          fi
          for package in frontend/package.json desktop/package.json; do
            if ! jq -e --arg version "$VERSION" '.version == $version' "$package" >/dev/null; then
              echo "::error::Version mismatch in $package"
              exit 1
            fi
          done
          backend_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' backend/pyproject.toml)
          if [[ "$backend_version" != "$VERSION" ]]; then
            echo '::error::Version mismatch in backend/pyproject.toml'
            exit 1
          fi
          RELEASE_TAG="v${VERSION}"
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo '::error::Release tags must point to default-branch history'
              exit 1
            fi
            RELEASE_TAG=${GITHUB_REF#refs/tags/}
            if [[ "$RELEASE_TAG" != "v${VERSION}" ]]; then
              echo '::error::Release tag does not match mobile/package.json'
              exit 1
            fi
          fi
          IMAGE=ghcr.io/${{ github.repository_owner }}/openfic
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- frontend
  build-frontend:
    needs: [context]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - name: 构建前端产物
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          OPENFIC_BUILD_VERSION=${{ needs.context.outputs.version }} pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------- pypi
  build-python:
    needs: [context, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: 生成 uv 缓存 key lock
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("backend/uv.lock")
          target = Path("backend/.uv-cache-key.lock")
          lines = source.read_text(encoding="utf-8").splitlines()
          normalized: list[str] = []
          is_openfic_package = False

          for line in lines:
              if line == "[[package]]":
                  is_openfic_package = False
              elif line == 'name = "openfic"':
                  is_openfic_package = True

              if is_openfic_package and line.startswith("version = "):
                  continue

              normalized.append(line)

          target.write_text("\n".join(normalized) + "\n", encoding="utf-8")
          PY
      - uses: actions/cache/restore@v5
        id: uv-cache
        with:
          path: .uv-cache
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/.uv-cache-key.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-${{ env.PYTHON_VERSION }}-
      - name: 构建后端 Python 包
        working-directory: backend
        run: uv build
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ steps.uv-cache.outputs.cache-hit != 'true' }}
        with:
          path: .uv-cache
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: backend/dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- docker
  docker:
    needs: [context]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: linux-x86_64
            variant: sqlite
            tag_suffix: ""
            extra: ""
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux-aarch64
            variant: sqlite
            tag_suffix: ""
            extra: ""
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: linux-x86_64
            variant: postgresql
            tag_suffix: -postgresql
            extra: postgresql
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux-aarch64
            variant: postgresql
            tag_suffix: -postgresql
            extra: postgresql
    runs-on: ${{ matrix.runner }}
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: tags
        run: |
          IMAGE=${{ needs.context.outputs.image }}
          VERSION=${{ needs.context.outputs.version }}
          MAJOR_MINOR=${{ needs.context.outputs.major_minor }}
          SUFFIX=${{ matrix.suffix }}
          TAG_SUFFIX=${{ matrix.tag_suffix }}

          echo "tags=${IMAGE}:latest${TAG_SUFFIX}-${SUFFIX},${IMAGE}:${VERSION}${TAG_SUFFIX}-${SUFFIX},${IMAGE}:${MAJOR_MINOR}${TAG_SUFFIX}-${SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            OPENFIC_EXTRA=${{ matrix.extra }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v7
        with:
          name: docker-${{ matrix.variant }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          if-no-files-found: error

  # ---------------------------------------------------------------- android
  android:
    needs: [context, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: 安装 Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: 安装构建依赖
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir mobile install --frozen-lockfile
      - name: 校验移动端版本与更新清单逻辑
        working-directory: mobile
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          pnpm test
          pnpm type-check
          pnpm exec node --input-type=module -e 'import p from "./package.json" with { type: "json" }; if (p.version !== process.env.RELEASE_VERSION) throw new Error("Mobile version does not match release tag")'
      - name: 构建移动端并同步 Android
        working-directory: mobile
        run: |
          pnpm build:shell
          pnpm exec node scripts/copy-frontend.mjs
          pnpm exec cap sync android
      - name: 运行 Android 单元测试
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: 设置签名文件路径
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/openfic-release.keystore" >> "$GITHUB_ENV"
      - name: 准备正式签名
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: 准备 PR 临时签名
        id: pr-signing
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$password" \
            -keypass "$password" -alias openfic-ci -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=OpenFic CI' -noprompt
      - name: 构建正式 APK 与更新清单
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'pull_request' && steps.pr-signing.outputs.password || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'openfic-ci' || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && steps.pr-signing.outputs.password || secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm exec node scripts/build-apk.mjs --release
      - name: 校验 APK 签名
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose mobile/out/OpenFic-*-android.apk'
      - name: 校验 Android 更新清单与 APK 一致
        working-directory: mobile
        run: |
          pnpm exec node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { createUpdateManifest } from './scripts/android-update.mjs';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          const apk = await readFile(`out/OpenFic-${version}-android.apk`);
          const manifest = JSON.parse(await readFile('out/android-update.json', 'utf8'));
          assert.deepEqual(manifest, createUpdateManifest(version, apk));
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: android-update
          path: |
            mobile/out/OpenFic-*-android.apk
            mobile/out/android-update.json
          if-no-files-found: error
      - name: 清理签名文件
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

  # ---------------------------------------------------------------- desktop
  desktop:
    needs: [context, build-frontend, build-python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            electron_args: "--win --x64"
            arch: x64
            artifact_name: windows-update-x86_64
          - os: windows-11-arm
            electron_args: "--win --arm64"
            arch: arm64
            artifact_name: windows-update-aarch64
          - os: ubuntu-24.04
            electron_args: "--linux --x64"
            artifact_name: desktop-linux-x86_64
          - os: ubuntu-24.04-arm
            electron_args: "--linux --arm64"
            artifact_name: desktop-linux-aarch64
          - os: macos-15-intel
            electron_args: "--mac --x64"
            arch: x64
            artifact_name: desktop-mac-x86_64
          - os: macos-15
            electron_args: "--mac --arm64"
            arch: arm64
            artifact_name: desktop-mac-aarch64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v8
        with:
          name: backend-dist
          path: backend-dist
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-desktop-${{ hashFiles('desktop/pnpm-lock.yaml', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-desktop-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - uses: actions/cache/restore@v5
        id: electron-cache
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-
      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 安装桌面端依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: 构建桌面端
        working-directory: desktop
        run: pnpm build
      - name: Smoke test macOS runtime
        if: matrix.os == 'macos-15'
        working-directory: desktop
        timeout-minutes: 20
        run: pnpm exec electron tests/main/runtime-smoke.mjs ../backend-dist/openfic-*.whl
      - name: 构建 Electron 安装包
        working-directory: desktop
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.electron_args }} --publish never
      - name: 校验 Windows 安装包完整性
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(desktop/dist-electron/*.zip)
          ((${#archives[@]}))
          for archive in "${archives[@]}"; do
            7z t "$archive"
          done
      - name: 校验 Linux 安装包完整性
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tar_files=(desktop/dist-electron/*.tar.gz)
          ((${#tar_files[@]}))
          for tar_file in "${tar_files[@]}"; do tar -tzf "$tar_file" >/dev/null; done
      - name: 校验 macOS 安装包完整性
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zip_files=(desktop/dist-electron/*.zip)
          dmg_files=(desktop/dist-electron/*.dmg)
          ((${#zip_files[@]} && ${#dmg_files[@]}))
          for zip_file in "${zip_files[@]}"; do unzip -t "$zip_file"; done
          for dmg_file in "${dmg_files[@]}"; do hdiutil verify "$dmg_file"; done

      - name: Install and launch Windows application
        if: runner.os == 'Windows'
        working-directory: desktop
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem -LiteralPath 'dist-electron' -Filter 'OpenFic-*-win-${{ matrix.arch }}-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one Windows installer, found $($installer.Count)" }

          $installDirectory = Join-Path $env:RUNNER_TEMP "openfic-${{ matrix.arch }}-$env:GITHUB_RUN_ID"
          $userDataDirectory = Join-Path $env:RUNNER_TEMP "openfic-user-data-${{ matrix.arch }}-$env:GITHUB_RUN_ID"
          $standardOutput = Join-Path $env:RUNNER_TEMP "openfic-${{ matrix.arch }}.out.log"
          $standardError = Join-Path $env:RUNNER_TEMP "openfic-${{ matrix.arch }}.err.log"
          $application = Join-Path $installDirectory 'OpenFic.exe'
          $process = $null

          try {
            $installerProcess = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', '/currentuser', "/D=$installDirectory") -Wait -PassThru
            if ($installerProcess.ExitCode -ne 0) { throw "Windows installer exited with code $($installerProcess.ExitCode)" }
            if (-not (Test-Path -LiteralPath $application)) { throw "Installed application was not found: $application" }

            $process = Start-Process -FilePath $application -ArgumentList "--user-data-dir=$userDataDirectory" -RedirectStandardOutput $standardOutput -RedirectStandardError $standardError -PassThru
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              Get-Content -LiteralPath $standardOutput, $standardError -ErrorAction SilentlyContinue
              throw "Installed application exited before the startup check completed with code $($process.ExitCode)"
            }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit(10000) | Out-Null
            }
            Remove-Item -LiteralPath $installDirectory, $userDataDirectory, $standardOutput, $standardError -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Launch Linux packages
        if: runner.os == 'Linux'
        working-directory: desktop
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          app_images=(dist-electron/OpenFic-*-linux-*.AppImage)
          tar_files=(dist-electron/OpenFic-*-linux-*.tar.gz)
          ((${#app_images[@]} == 1))
          ((${#tar_files[@]} == 1))
          packages=()
          if ! command -v Xvfb >/dev/null; then packages+=(xvfb); fi
          if ! command -v xdotool >/dev/null; then packages+=(xdotool); fi
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install --yes "${packages[@]}"
          fi

          install_dir=$(mktemp -d)
          app_image_user_data_dir=$(mktemp -d)
          tarball_user_data_dir=$(mktemp -d)
          app_image_log=$(mktemp)
          tarball_log=$(mktemp)
          xvfb_log=$(mktemp)
          xvfb_pid=""
          app_pids=()

          stop_application() {
            local app_pid="$1"
            if kill -0 "$app_pid" 2>/dev/null; then kill "$app_pid" || true; fi
            for _ in {1..5}; do
              if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$app_pid" 2>/dev/null; then kill -9 "$app_pid" || true; fi
            wait "$app_pid" || true
          }

          print_diagnostics() {
            local log_path="$1"
            local user_data_dir="$2"
            cat "$log_path" || true
            if [[ -d "$user_data_dir/logs" ]]; then
              find "$user_data_dir/logs" -type f -name '*.log' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
            fi
          }

          cleanup() {
            for app_pid in "${app_pids[@]}"; do
              stop_application "$app_pid"
            done
            if [[ -n "$xvfb_pid" ]] && kill -0 "$xvfb_pid" 2>/dev/null; then kill "$xvfb_pid" || true; fi
            wait "$xvfb_pid" 2>/dev/null || true
            rm -rf "$install_dir" "$app_image_user_data_dir" "$tarball_user_data_dir" "$app_image_log" "$tarball_log" "$xvfb_log"
          }
          trap cleanup EXIT

          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1280x800x24 > "$xvfb_log" 2>&1 &
          xvfb_pid=$!
          sleep 1
          if ! kill -0 "$xvfb_pid" 2>/dev/null; then
            cat "$xvfb_log"
            exit 1
          fi

          launch_and_verify() {
            local package_name="$1"
            local log_path="$2"
            local user_data_dir="$3"
            shift 3

            "$@" > "$log_path" 2>&1 &
            local app_pid=$!
            app_pids+=("$app_pid")
            local window_visible=false
            for _ in {1..30}; do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                local exit_code=0
                wait "$app_pid" || exit_code=$?
                print_diagnostics "$log_path" "$user_data_dir"
                echo "$package_name exited before the startup check completed with code $exit_code"
                return 1
              fi
              if xdotool search --onlyvisible --name 'OpenFic' >/dev/null 2>&1; then window_visible=true; fi
              sleep 1
            done
            if [[ "$window_visible" != true ]]; then
              print_diagnostics "$log_path" "$user_data_dir"
              echo "$package_name started but did not show an OpenFic window"
              return 1
            fi
            stop_application "$app_pid"
          }

          chmod +x "${app_images[0]}"
          launch_and_verify AppImage "$app_image_log" "$app_image_user_data_dir" "${app_images[0]}" --appimage-extract-and-run --no-sandbox --user-data-dir="$app_image_user_data_dir"

          tar -xzf "${tar_files[0]}" -C "$install_dir"
          mapfile -t tarball_applications < <(find "$install_dir" -type f -name openfic-desktop -perm -111)
          if ((${#tarball_applications[@]} != 1)); then
            echo "Expected one executable named openfic-desktop, found ${#tarball_applications[@]}"
            find "$install_dir" -maxdepth 3 -type f -printf '%m %p\n' | sort
            exit 1
          fi
          launch_and_verify tar.gz "$tarball_log" "$tarball_user_data_dir" "${tarball_applications[0]}" --no-sandbox --user-data-dir="$tarball_user_data_dir"
      - name: Install and launch macOS application
        if: runner.os == 'macOS'
        working-directory: desktop
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(dist-electron/OpenFic-*-mac-${{ matrix.arch }}.dmg)
          ((${#dmg_files[@]} == 1))

          mount_dir=$(mktemp -d)
          install_dir=$(mktemp -d)
          user_data_dir=$(mktemp -d)
          app_log=$(mktemp)
          app_pid=""
          is_mounted=false

          cleanup() {
            if [[ "$is_mounted" == true ]]; then hdiutil detach "$mount_dir" -quiet || true; fi
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" || true
              sleep 2
              if kill -0 "$app_pid" 2>/dev/null; then kill -9 "$app_pid" || true; fi
              wait "$app_pid" || true
            fi
            rm -rf "$mount_dir" "$install_dir" "$user_data_dir" "$app_log"
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmg_files[0]}"
          is_mounted=true
          app_sources=("$mount_dir"/*.app)
          ((${#app_sources[@]} == 1))
          ditto "${app_sources[0]}" "$install_dir/OpenFic.app"
          hdiutil detach "$mount_dir" -quiet
          is_mounted=false

          "$install_dir/OpenFic.app/Contents/MacOS/OpenFic" --user-data-dir="$user_data_dir" > "$app_log" 2>&1 &
          app_pid=$!
          for _ in {1..10}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$app_log"
              wait "$app_pid"
              exit 1
            fi
            sleep 1
          done
      - name: 统一安装包架构命名
        working-directory: desktop
        run: pnpm exec node scripts/normalize-artifact-names.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.blockmap
            desktop/dist-electron/*.AppImage
            desktop/dist-electron/*.tar.gz
            desktop/dist-electron/*.zip
            desktop/dist-electron/*.dmg
          if-no-files-found: error
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ steps.electron-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

  desktop-windows-update:
    needs: [context, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-update-*
          merge-multiple: true
          path: desktop/dist-electron
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 整理 Windows 自动更新产物
        working-directory: desktop
        run: node scripts/prepare-windows-update.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.blockmap
            desktop/dist-electron/*.zip
            desktop/dist-electron/latest*.yml
          if-no-files-found: error

  verify:
    name: Verify all packages
    if: always()
    needs: [context, build-frontend, build-python, docker, android, desktop, desktop-windows-update]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful builds
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
