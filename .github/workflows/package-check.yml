name: Package Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22.18.0'
  PNPM_VERSION: '11.8.0'

jobs:
  frontend:
    name: Frontend package
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend package
        working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

  python:
    name: Python package
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build Python package
        working-directory: backend
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: backend/dist/*.whl

  docker:
    name: Docker (${{ matrix.platform }})
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false

  desktop:
    name: Desktop (${{ matrix.os }} ${{ matrix.arch }})
    needs: [frontend, python]
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            arch: x64
          - os: windows-11-arm
            target: --win
            arch: arm64
          - os: ubuntu-24.04
            target: --linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: --linux
            arch: arm64
          - os: macos-15-intel
            target: --mac
            arch: x64
          - os: macos-15
            target: --mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v8
        if: matrix.os == 'macos-15'
        with:
          name: backend-dist
          path: backend-dist
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build desktop application
        working-directory: desktop
        run: pnpm build
      - name: Smoke test macOS runtime
        if: matrix.os == 'macos-15'
        working-directory: desktop
        timeout-minutes: 20
        run: pnpm exec electron tests/main/runtime-smoke.mjs ../backend-dist/openfic-*.whl
      - name: Build desktop package
        working-directory: desktop
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verify Windows ZIP archives
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zip_files=(dist-electron/*.zip)
          ((${#zip_files[@]}))
          for zip_file in "${zip_files[@]}"; do 7z t "$zip_file"; done
      - name: Verify Linux archives
        if: runner.os == 'Linux'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tar_files=(dist-electron/*.tar.gz)
          ((${#tar_files[@]}))
          for tar_file in "${tar_files[@]}"; do tar -tzf "$tar_file" >/dev/null; done
      - name: Verify macOS disk images
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          shopt -s nullglob
          zip_files=(dist-electron/*.zip)
          dmg_files=(dist-electron/*.dmg)
          ((${#zip_files[@]} && ${#dmg_files[@]}))
          for zip_file in "${zip_files[@]}"; do unzip -t "$zip_file"; done
          for dmg_file in "${dmg_files[@]}"; do
            hdiutil verify "$dmg_file"
          done
      - name: Install and launch Windows application
        if: runner.os == 'Windows'
        working-directory: desktop
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem -LiteralPath 'dist-electron' -Filter 'OpenFic-*-win-${{ matrix.arch }}-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one Windows installer, found $($installer.Count)" }

          $installDirectory = Join-Path $env:RUNNER_TEMP "openfic-${{ matrix.arch }}-$env:GITHUB_RUN_ID"
          $userDataDirectory = Join-Path $env:RUNNER_TEMP "openfic-user-data-${{ matrix.arch }}-$env:GITHUB_RUN_ID"
          $standardOutput = Join-Path $env:RUNNER_TEMP "openfic-${{ matrix.arch }}.out.log"
          $standardError = Join-Path $env:RUNNER_TEMP "openfic-${{ matrix.arch }}.err.log"
          $application = Join-Path $installDirectory 'OpenFic.exe'
          $process = $null

          try {
            & $installer[0].FullName /S "/D=$installDirectory"
            if ($LASTEXITCODE -ne 0) { throw "Windows installer exited with code $LASTEXITCODE" }
            if (-not (Test-Path -LiteralPath $application)) { throw "Installed application was not found: $application" }

            $process = Start-Process -FilePath $application -ArgumentList "--user-data-dir=$userDataDirectory" -RedirectStandardOutput $standardOutput -RedirectStandardError $standardError -PassThru
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              Get-Content -LiteralPath $standardOutput, $standardError -ErrorAction SilentlyContinue
              throw "Installed application exited before the startup check completed with code $($process.ExitCode)"
            }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit(10000) | Out-Null
            }
            Remove-Item -LiteralPath $installDirectory, $userDataDirectory, $standardOutput, $standardError -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Launch Linux AppImage
        if: runner.os == 'Linux'
        working-directory: desktop
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          app_images=(dist-electron/OpenFic-*-linux-*.AppImage)
          ((${#app_images[@]} == 1))
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes xvfb
          fi

          user_data_dir=$(mktemp -d)
          app_log=$(mktemp)
          app_pid=""

          cleanup() {
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" || true
              wait "$app_pid" || true
            fi
            rm -rf "$user_data_dir" "$app_log"
          }
          trap cleanup EXIT

          chmod +x "${app_images[0]}"

          xvfb-run --auto-servernum "${app_images[0]}" --appimage-extract-and-run --user-data-dir="$user_data_dir" > "$app_log" 2>&1 &
          app_pid=$!
          for _ in {1..10}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$app_log"
              wait "$app_pid"
              exit 1
            fi
            sleep 1
          done
      - name: Install and launch macOS application
        if: runner.os == 'macOS'
        working-directory: desktop
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(dist-electron/OpenFic-*-mac-${{ matrix.arch }}.dmg)
          ((${#dmg_files[@]} == 1))

          mount_dir=$(mktemp -d)
          install_dir=$(mktemp -d)
          user_data_dir=$(mktemp -d)
          app_log=$(mktemp)
          app_pid=""
          is_mounted=false

          cleanup() {
            if [[ "$is_mounted" == true ]]; then hdiutil detach "$mount_dir" -quiet || true; fi
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" || true
              sleep 2
              if kill -0 "$app_pid" 2>/dev/null; then kill -9 "$app_pid" || true; fi
              wait "$app_pid" || true
            fi
            rm -rf "$mount_dir" "$install_dir" "$user_data_dir" "$app_log"
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmg_files[0]}"
          is_mounted=true
          app_sources=("$mount_dir"/*.app)
          ((${#app_sources[@]} == 1))
          ditto "${app_sources[0]}" "$install_dir/OpenFic.app"
          hdiutil detach "$mount_dir" -quiet
          is_mounted=false

          "$install_dir/OpenFic.app/Contents/MacOS/OpenFic" --user-data-dir="$user_data_dir" > "$app_log" 2>&1 &
          app_pid=$!
          for _ in {1..10}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$app_log"
              wait "$app_pid"
              exit 1
            fi
            sleep 1
          done

  summary:
    name: Summary
    if: "always() && !startsWith(github.event.pull_request.head.ref, 'release-please--')"
    needs: [frontend, python, docker, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Verify packages
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          for result in "$FRONTEND_RESULT" "$PYTHON_RESULT" "$DOCKER_RESULT" "$DESKTOP_RESULT"; do
            if [ "$result" = 'failure' ] || [ "$result" = 'cancelled' ]; then
              exit 1
            fi
          done
