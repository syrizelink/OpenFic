name: Package Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packages:
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    uses: ./.github/workflows/package-build.yml

  summary:
    name: Summary
    if: "always() && !startsWith(github.event.pull_request.head.ref, 'release-please--')"
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - name: Verify packages
        env:
          RESULT: ${{ needs.packages.result }}
        run: test "$RESULT" = success
