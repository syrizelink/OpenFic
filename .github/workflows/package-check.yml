name: Package Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22.18.0'
  PNPM_VERSION: '11.8.0'

jobs:
  frontend:
    name: Frontend package
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend package
        working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

  python:
    name: Python package
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build Python package
        working-directory: backend
        run: uv build

  docker:
    name: Docker (${{ matrix.platform }})
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false

  desktop:
    name: Desktop (${{ matrix.os }} ${{ matrix.arch }})
    needs: frontend
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            arch: x64
          - os: windows-11-arm
            target: --win
            arch: arm64
          - os: ubuntu-24.04
            target: --linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: --linux
            arch: arm64
          - os: macos-15-intel
            target: --mac
            arch: x64
          - os: macos-15
            target: --mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build desktop application
        working-directory: desktop
        run: pnpm build
      - name: Build desktop package
        working-directory: desktop
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.target }} --${{ matrix.arch }} --publish never

  summary:
    name: Summary
    if: "always() && !startsWith(github.event.pull_request.head.ref, 'release-please--')"
    needs: [frontend, python, docker, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Verify packages
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          for result in "$FRONTEND_RESULT" "$PYTHON_RESULT" "$DOCKER_RESULT" "$DESKTOP_RESULT"; do
            if [ "$result" = 'failure' ] || [ "$result" = 'cancelled' ]; then
              exit 1
            fi
          done
