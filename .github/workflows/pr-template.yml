name: PR Template Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate template
    if: "!startsWith(github.event.pull_request.head.ref, 'release-please--')"
    runs-on: ubuntu-latest
    steps:
      - name: Validate title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          shopt -s nocasematch

          errors=()
          title_pattern='^(feat|fix|build|chore|ci|docs|style|refactor|perf|test)(\([^)]+\))?!?: .+'

          if ! [[ "$PR_TITLE" =~ $title_pattern ]]; then
            errors+=("Judul PR harus sesuai format Conventional Commits")
          fi

          body=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed '/<!--/,/-->/d')
          change_description=$(printf '%s\n' "$body" | sed -n '/^## Deskripsi Perubahan$/,/^## /{ /^## /!p }' | sed '/^[[:space:]]*-[[:space:]]*\(Masalah\|Tingkat Kepentingan\|Perubahan\):[[:space:]]*$/d' | sed '/^[[:space:]]*\.\.\.[[:space:]]*$/d' | tr -d '[:space:]')

          if [ -z "$change_description" ]; then
            errors+=("Deskripsi Perubahan harus diisi dengan konten yang sebenarnya")
          fi

          if ! printf '%s\n' "$body" | grep -Eq '^- \[[xX]\] (Fitur Baru|Perbaikan Bug|Pembaruan Dokumentasi|Penyesuaian Format Kode|Refaktor Kode|Optimalisasi Performa|Terkait Pengujian|Lain-lain)'; then
            errors+=("Wajib memilih setidaknya satu tipe perubahan")
          fi

          if [ "${#errors[@]}" -gt 0 ]; then
            printf '::error::%s\n' "$(IFS=';'; echo "${errors[*]}")"
            exit 1
          fi
