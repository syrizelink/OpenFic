name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish-pypi:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-dist
          path: dist
      - name: 发布已验证的 Python 包
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [sqlite, postgresql]
        suffix: [linux-x86_64, linux-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-${{ matrix.variant }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/docker-image
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布已验证的 Docker 镜像
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
          MAJOR_MINOR: ${{ needs.build.outputs.major_minor }}
          VARIANT: ${{ matrix.variant }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/docker-image/image.tar"
          tag_suffix=''
          if [[ "$VARIANT" == postgresql ]]; then tag_suffix=-postgresql; fi
          for version in "$VERSION" "$MAJOR_MINOR" latest; do
            docker push "${IMAGE}:${version}${tag_suffix}-${SUFFIX}"
          done

  docker-manifest:
    needs: [build, publish-docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布多架构 Docker 标签
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
          MAJOR_MINOR: ${{ needs.build.outputs.major_minor }}
        run: |
          set -euo pipefail
          for tag_suffix in '' -postgresql; do
            for version in "$VERSION" "$MAJOR_MINOR" latest; do
              docker buildx imagetools create \
                -t "${IMAGE}:${version}${tag_suffix}" \
                "${IMAGE}:${VERSION}${tag_suffix}-linux-x86_64" \
                "${IMAGE}:${VERSION}${tag_suffix}-linux-aarch64"
            done
          done

  publish-release:
    needs: [build, publish-pypi, docker-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: android-update
          path: assets
      - name: 发布已验证的安装包与更新清单
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: assets/*
          fail_on_unmatched_files: true
