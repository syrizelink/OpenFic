apply plugin: 'com.android.application'

def mobilePackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def version = (project.findProperty('openficUpdateTestVersion') ?: mobilePackage.version).toString()
if (!(version ==~ /(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)/)) {
    throw new GradleException('Android requires a stable major.minor.patch version')
}
def (major, minor, patch) = version.tokenize('.').collect { it.toBigInteger() }
def androidVersionCode = major * 1000000 + minor * 1000 + patch
if (minor > 999 || patch > 999 || androidVersionCode < 1 || androidVersionCode > 2100000000) {
    throw new GradleException('Android version is outside the supported versionCode range')
}
def signingVariables = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def hasReleaseSigning = signingVariables.every { System.getenv(it) }

android {
    namespace "com.openfic.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "com.openfic.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode.intValue()
        versionName version
        buildConfigField 'String', 'OPENFIC_UPDATE_TEST_BASE_URL', '\"\"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
        }
        updateTest {
            initWith debug
            matchingFallbacks = ['debug']
            applicationIdSuffix ".dev.updatetest"
            debuggable true
            signingConfig signingConfigs.debug
            def baseUrl = (project.findProperty('openficUpdateTestBaseUrl') ?: '').toString()
            def escapedBaseUrl = baseUrl.replace('\\', '\\\\').replace('\"', '\\\"')
            buildConfigField 'String', 'OPENFIC_UPDATE_TEST_BASE_URL', '\"' + escapedBaseUrl + '\"'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
}

gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseSigning && graph.allTasks.any { it.name in ['packageRelease', 'signReleaseBundle'] }) {
        throw new GradleException('Release APK requires ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
